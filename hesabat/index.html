<style>
:root{
  --bg:#050505; --card:#121110; --text:#f3ecda; --muted:#a89f8a; --line:#2b2517;
  --primary:#d4af37; --primary-ink:#0a0804; --soft:#201a09; --silver:#b9bdc4;
  --good:#3ddc84; --good-bg:#10291a; --bad:#ff6b60; --bad-bg:#341816; --warn:#ffb74d; --warn-bg:#33260d;
  --shadow:0 2px 14px rgba(0,0,0,.6);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
#app{max-width:640px;margin:0 auto;padding:14px 14px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
.top h1{font-size:20px;margin:0;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{background:linear-gradient(135deg,#e6c15a 0%,#c39a2c 55%,#a67f1f 100%);color:#17110a;border-radius:22px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero .l{opacity:.8;font-size:14px}
.hero .v{font-size:34px;font-weight:800;margin:2px 0}
.hero .s{opacity:.8;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.tl{color:var(--muted);font-size:13px}
.tv{font-size:20px;font-weight:800;margin-top:2px}
.ts{color:var(--muted);font-size:12px;margin-top:2px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.abtn{border:0;border-radius:16px;padding:16px 8px;background:var(--soft);color:var(--primary);font-weight:700;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.abtn .ic{font-size:26px}
.abtn:active,.btn:active{transform:scale(.98)}
.btn{border:0;border-radius:14px;padding:14px 16px;background:var(--primary);color:var(--primary-ink);font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:var(--soft);color:var(--primary)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.small{padding:9px 12px;font-size:14px;width:auto;border-radius:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-stock{background:var(--soft);color:var(--primary)}
.b-paid{background:var(--good-bg);color:var(--good)}
.b-debt{background:var(--warn-bg);color:var(--warn)}
.ptag{font-size:12px;background:var(--soft);color:var(--primary);border-radius:99px;padding:2px 8px;margin-inline-start:6px;font-weight:700}
.car{cursor:pointer}
.car .name{font-weight:700;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;white-space:nowrap;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);margin-bottom:10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.nav button{flex:1;border:0;background:none;padding:6px 1px;color:var(--muted);font-weight:600;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ic{font-size:20px}
.nav button.on{color:var(--primary)}
.ov{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh h2{margin:0;font-size:19px}
.x{border:0;background:var(--card);border-radius:99px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--muted)}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:14px;color:var(--muted);margin-bottom:5px;font-weight:600}
.fld input,.fld select,.prow input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--card)}
.fld input:focus,.fld select:focus,.search:focus,.prow input:focus{outline:2px solid var(--primary);outline-offset:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:12px;align-items:center}
.prow .pp{grid-column:1/2;border-style:dashed}
.irow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:12px;align-items:center;border:1px dashed var(--line);border-radius:14px;padding:8px}.irow input,.irow select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 10px;background:var(--card);color:inherit;font:inherit}.irow input:disabled{opacity:.45}.irow .iv{grid-column:1/3}.irow .im{grid-column:1/-1}.irow .ip{grid-column:2/-1;border-style:dashed}
.prow .po{grid-column:2/-1;width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 10px;background:var(--card);color:inherit;font:inherit}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.preview{background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.preview:empty{display:none}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700}
.pcard{border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-top:10px}

<script>
(function(){
"use strict";
var $ = function(s){return document.querySelector(s)};
var AR = "٠١٢٣٤٥٦٧٨٩";
var EXP_TYPES = ["صيانة","دهان","سمكرة","كهرباء","ترخيص وأوراق","غسيل وتنضيف","توكيل","عمولة المعرض","عمولة مسوق","نقل","أخرى"];

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function parseNum(v){
  if(v==null) return 0;
  var s=String(v).replace(/[٠-٩]/g,function(d){return AR.indexOf(d)}).replace(/[٬,\s]/g,"").replace("٫",".");
  if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  var n=parseFloat(s); return isFinite(n)?n:0;
}
function fmt(n){var r=Math.round(n||0);if(r===0)r=0;return r.toLocaleString("en-US")}
function fmtIn(v){var s=String(v==null?"":v).replace(/[٠-٩]/g,function(d){return AR.indexOf(d)});var neg=/^\s*-/.test(s);var d=s.replace(/\D/g,"").replace(/^0+(?=\d)/,"");if(!d)return neg?"-":"";return (neg?"-":"")+d.replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function moneyInput(el){var v=el.value,pos=el.selectionStart==null?v.length:el.selectionStart,before=v.slice(0,pos).replace(/[^0-9٠-٩]/g,"").length,nv=fmtIn(v);if(nv===v)return;el.value=nv;var i=0,c=0;while(i<nv.length&&c<before){if(/\d/.test(nv[i]))c++;i++}try{el.setSelectionRange(i,i)}catch(x){}}
function pct(x){return '<span class="num">'+(Math.round((x||0)*1000)/10)+'%</span>'}
function m(n,cls){return '<span class="num '+(cls||"")+'">'+fmt(n)+'</span> ج'}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){var p=s.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fdate(s){return s?'<bdi>'+s.split("-").reverse().join("/")+'</bdi>':""}
function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("show")},2600)}

/* ---------- state ---------- */
var db=null,FS=null,FBA=null;
var S={cars:[],expenses:[],cols:[],cap:[],pay:[],transfers:[],ledger:[],ext:[],inv:[],invmov:[],settings:null,loaded:{},tab:"home",filter:"stock",q:"",day:todayStr(),noDb:false,err:null,auth:"checking"};
var modal=null;
function allLoaded(){var l=S.loaded;return l.cars&&l.expenses&&l.cols&&l.cap&&l.pay&&l.transfers&&l.ledger&&l.ext&&l.inv&&l.invmov&&l.settings}

/* ---------- calculations ---------- */
function paidNow(c){var b=+c.buyPrice||0;return typeof c.buyPaid==="number"?Math.max(0,Math.min(c.buyPaid,b)):b}
function expSrc(e){return e.sv===2?(e.src==="insta"?"insta":e.src==="fund"?"fund":"cash"):(e.src==="insta"?"insta":"fund")}
function reimbDay(c){return c.reimbDate||c.sellDate||c.buyDate}
function flowsOf(cars,d){
  var cash=0,insta=0,fund=0,ids={},pk={},fx={};
  cars.forEach(function(c){ids[c.id]=1;c.parts.forEach(function(p){pk[c.id+"|"+p.id]=1})});
  function ok(x){return d==null||x===d}
  function add(src,n){if(src==="fund")fund+=n;else if(src==="insta")insta+=n;else cash+=n}
  cars.forEach(function(c){if(ok(c.buyDate))add(c.buySrc,-paidNow(c)+(+c.tradeIn||0)+c.pTotal)});
  S.expenses.forEach(function(e){if(!ids[e.carId])return;var s=expSrc(e);if(s==="fund")fx[e.carId]=(fx[e.carId]||0)+(+e.amount||0);if(ok(e.date))add(s,-(+e.amount||0))});
  cars.forEach(function(c){var a=fx[c.id]||0;if(c.reimbursed&&a&&ok(reimbDay(c))){cash-=a;fund+=a}});
  S.cols.forEach(function(x){if(ids[x.carId]&&ok(x.date)){cash+=+x.cash||0;insta+=+x.insta||0}});
  S.pay.forEach(function(x){if(pk[x.carId+"|"+x.pid]&&ok(x.date))add(x.src,-(+x.amount||0))});
  S.cap.forEach(function(x){if((x.kind==="withdraw"||x.kind==="pwithdraw"||x.kind==="jam")&&ok(x.date))add(x.src,-(+x.amount||0));else if(x.kind==="addcap"&&ok(x.date))add(x.src,+x.amount||0)});
  S.transfers.forEach(function(x){if(!ok(x.date))return;var a=+x.amount||0;if(x.dir==="toFund"){add(x.src,-a);fund+=a}else if(x.dir==="fromFund"){fund-=a;add(x.src,a)}else if(x.dir==="toInsta"){cash-=a;insta+=a}else{cash+=a;insta-=a}});
  S.ledger.forEach(function(x){if(x.kind==="spay"&&ids[x.carId]&&ok(x.date))add(x.src,-(+x.amount||0))});
  S.invmov.forEach(function(x){if(!ok(x.date))return;if(x.kind==="dep")add(x.src==="insta"?"insta":"cash",+x.amount||0);else if(x.kind==="wd")add(x.src==="insta"?"insta":"cash",-(+x.amount||0))});
  var lm=lmapOf();
  S.ledger.forEach(function(x){if(ok(x.date))add(x.src,lsigned(x,lm))});
  return {cash:cash,insta:insta,fund:fund};
}
function calc(){
  var exp={},cash={},insta={},paidBy={},lossPd={},spd={};
  var fex={};S.expenses.forEach(function(e){exp[e.carId]=(exp[e.carId]||0)+(+e.amount||0);if(expSrc(e)==="fund")fex[e.carId]=(fex[e.carId]||0)+(+e.amount||0)});
  var trd={};S.cols.forEach(function(c){if(c.trade)trd[c.carId]=(trd[c.carId]||0)+(+c.trade||0);cash[c.carId]=(cash[c.carId]||0)+(+c.cash||0);insta[c.carId]=(insta[c.carId]||0)+(+c.insta||0)});
  S.pay.forEach(function(p){var k=p.carId+"|"+p.pid;paidBy[k]=(paidBy[k]||0)+(+p.amount||0)});
  S.cap.forEach(function(x){if(x.kind==="lossrepay"&&x.carId)lossPd[x.carId]=(lossPd[x.carId]||0)+(+x.amount||0)});
  S.ledger.forEach(function(x){if(x.kind==="spay")spd[x.carId]=(spd[x.carId]||0)+(+x.amount||0)});
  var cars=S.cars.map(function(c){
    var e=exp[c.id]||0,ca=cash[c.id]||0,ins=insta[c.id]||0,sold=typeof c.sellPrice==="number";
    var buy=+c.buyPrice||0,cost=buy+e,owedS=buy-paidNow(c),sPaid=spd[c.id]||0;
    var profit=sold?c.sellPrice-cost:null;
    var shs=shareList(c.partners||[],buy);
    var parts=(c.partners||[]).map(function(p,pi){
      var amt=+p.amount||0,hasPct=hasPctOf(p),share=shs[pi];
      var due=amt+(sold?profit*share:0),paid=paidBy[c.id+"|"+p.id]||0;
      return {id:p.id,name:p.name,amount:amt,pct:hasPct?+p.pct:null,of:p.of||"",share:share,profit:sold?profit*share:null,due:due,paid:paid,remaining:due-paid};
    });
    var pTotal=parts.reduce(function(a,p){return a+p.amount},0);
    var R0=parts.length?1-parts.reduce(function(a,p){return a+p.share},0):1;
    var invs=(c.investors||[]).map(function(v){var amt=+v.amount||0,sh=invShare(v,R0,buy),iv=invById(v.iid);return {iid:v.iid,name:iv?iv.name:(v.name||"مستثمر"),amount:amt,pct:hasPctOf(v)?+v.pct:null,mode:v.mode||"mine",share:sh,profit:sold?profit*sh:null}});
    var iTotal=invs.reduce(function(a,v){return a+v.amount},0);
    var ownerCap=buy-pTotal-iTotal,ownerShare=R0-invs.reduce(function(a,v){return a+v.share},0);
    var mp=sold?profit*ownerShare:null;
    var lossActive=!!(sold&&c.lossDeferred&&mp<0),lossAmt=lossActive?-mp:0,lossPaid=lossActive?(lossPd[c.id]||0):0;
    return Object.assign({},c,{fexp:fex[c.id]||0,owedSeller:owedS,sellerPaid:sPaid,sellerRem:owedS-sPaid,exp:e,cashIn:ca,instaIn:ins,cost:cost,sold:sold,profit:profit,
      tradeGot:trd[c.id]||0,remaining:sold?c.sellPrice-ca-ins-(trd[c.id]||0):null,parts:parts,pTotal:pTotal,invs:invs,iTotal:iTotal,ownerCap:ownerCap,ownerShare:ownerShare,
      myProfit:mp,lossActive:lossActive,lossAmt:lossAmt,lossPaid:lossPaid,lossRem:lossAmt-lossPaid});
  }).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
  var capital=+(S.settings&&S.settings.capital)||0, fund=+(S.settings&&S.settings.fund)||0;
  var withdraw=0,repay=0,pw=0;
  var jam=0,addcap=0;
  S.cap.forEach(function(x){var a=+x.amount||0;if(x.kind==="withdraw")withdraw+=a;else if(x.kind==="repay")repay+=a;else if(x.kind==="pwithdraw")pw+=a;else if(x.kind==="jam")jam+=a;else if(x.kind==="addcap")addcap+=a});
  var profit=0,profitEx=0,lossDef=0,lossPaid=0,soldN=0,stockN=0,stockCost=0,debts=0,deposits=0,unre=0,cashTot=0,instaTot=0,pOwed=0;
  cars.forEach(function(c){
    cashTot+=c.cashIn;instaTot+=c.instaIn;
    c.parts.forEach(function(p){pOwed+=p.remaining});
    if(c.sold){
      soldN++;profit+=c.myProfit;
      if(c.lossActive){lossDef+=c.lossAmt;lossPaid+=c.lossPaid}else profitEx+=c.myProfit;
      if(c.remaining>0)debts+=c.remaining;
    }else{stockN++;stockCost+=c.cost;deposits+=c.cashIn+c.instaIn}
    if(!c.reimbursed)unre+=c.fexp;
  });
  var recv=0,owe=0;loansCalc().forEach(function(l){if(l.dir==="out")recv+=l.remaining;else owe+=l.remaining});
  var sOwe=0;cars.forEach(function(c){sOwe+=c.sellerRem});owe+=sOwe;
  var extTot=0;S.ext.forEach(function(x){extTot+=+x.amount||0});
  var F=flowsOf(cars),fundBal=fund+F.fund,safeBal=capital-fund+F.cash,instaBal=F.insta,cashNow=safeBal+instaBal;
  var lossRem=lossDef-lossPaid,wDef=withdraw-repay,deficit=wDef+lossRem,capNow=capital+addcap-jam-deficit;
  var undist=profitEx-repay-lossPaid-pw,value=capNow+undist;
  var IS=invStats(cars);
  var check=Math.round(cashNow+fundBal+stockCost+debts+recv-owe-deposits-pOwed-IS.bal-value)===0;
  return {jam:jam,addcap:addcap,extTot:extTot,cars:cars,capital:capital,fund:fund,withdraw:withdraw,repay:repay,pw:pw,wDef:wDef,deficit:deficit,capNow:capNow,undist:undist,value:value,
    profit:profit,profitEx:profitEx,recv:recv,owe:owe,sOwe:sOwe,lossDef:lossDef,lossPaid:lossPaid,lossRem:lossRem,
    soldN:soldN,stockN:stockN,stockCost:stockCost,debts:debts,cashNow:cashNow,safeBal:safeBal,instaBal:instaBal,
    cashTot:cashTot,instaTot:instaTot,fundBal:fundBal,fundEmp:(S.settings&&S.settings.fundEmp)||"",unre:unre,pOwed:pOwed,inv:IS,check:check};
}

function dayCalc(d){

  var cols=S.cols.filter(function(c){return c.date===d});
  var sales=T.cars.filter(function(c){return c.sold&&c.sellDate===d});
  var caps=S.cap.filter(function(x){return x.date===d});
  var pays=S.pay.filter(function(x){return x.date===d});
  var trs=S.transfers.filter(function(x){return x.date===d});
  var lds=S.ledger.filter(function(x){return x.date===d&&x.kind!=="spay"}),sps=S.ledger.filter(function(x){return x.date===d&&x.kind==="spay"});

}

function kashEntries(T){
  var E=[],first=null,cm={};
  T.cars.forEach(function(c){cm[c.id]=c});
  function nm(id){var c=cm[id];return c?c.name:"عربية"}
  function add(o){if(Math.round(o.a)===0)return;if(o.d&&(!first||o.d<first))first=o.d;E.push(o)}
  T.cars.forEach(function(c){
    var paid=paidNow(c)-(+c.tradeIn||0),others=c.pTotal+c.iTotal,mine=paid-others;
    add({d:c.buyDate,c:c.createdAt||0,a:-mine,t:"شراء "+c.name,k:dline(c.tradeIn?"دخلت في بيعة":"",others>0.5?"المدفوع "+fmt(paid)+" · منه شركا/مستثمرين "+fmt(others):"",c.owedSeller>0.5?"باقي للبايع "+fmt(c.owedSeller):"")||"شراء عربية",car:c.id});
    if(c.sold&&(c.parts.length||c.invs.length)){
      var due=0;c.parts.forEach(function(p){due+=p.due});c.invs.forEach(function(v){due+=v.amount+(v.profit||0)});
      add({d:c.sellDate,c:(c.createdAt||0)+1,a:-due,t:"نصيب الشركا والمستثمرين في "+c.name,k:"فلوسهم وأرباحهم من البيعة",car:c.id});
    }
  });
  S.expenses.forEach(function(e){if(!cm[e.carId])return;add({d:e.date,c:e.createdAt||0,a:-(+e.amount||0),t:(e.type||"مصروف")+" - "+nm(e.carId),k:dline("مصروف",expSrc(e)==="fund"?"من العهدة":expSrc(e)==="insta"?"إنستاباي":""),car:e.carId})});
  S.cols.forEach(function(x){if(!cm[x.carId]||x.trade)return;var a=(+x.cash||0)+(+x.insta||0);add({d:x.date,c:x.createdAt||0,a:a,t:(x.refund?"مرتجع - رد فلوس ":a<0?"رد فلوس ":"تحصيل ")+nm(x.carId),k:"كاش "+fmt(Math.abs(+x.cash||0))+" · إنستاباي "+fmt(Math.abs(+x.insta||0)),car:x.carId})});
  S.pay.forEach(function(x){var c=cm[x.carId];if(!c||c.sold)return;var p=c.parts.find(function(q){return q.id===x.pid});add({d:x.date,c:x.createdAt||0,a:-(+x.amount||0),t:"تسليم "+(p?p.name:"شريك")+" - "+c.name,k:"فلوس شريك",car:c.id})});
  S.ledger.forEach(function(x){if(x.kind==="spay"&&cm[x.carId])add({d:x.date,c:x.createdAt||0,a:-(+x.amount||0),t:"سداد للبايع - "+nm(x.carId),k:"باقي تمن عربية",car:x.carId})});
  S.cap.forEach(function(x){var a=+x.amount||0;if(capOut(x.kind))add({d:x.date,c:x.createdAt||0,a:-a,t:capLabel(x).replace(/^\S+\s/,""),k:x.note||"رأس المال"});else if(capIn(x.kind))add({d:x.date,c:x.createdAt||0,a:a,t:"زيادة رأس المال",k:x.note||"رأس المال",cap:1})});
  var lm=lmapOf();
  S.ledger.forEach(function(x){if(x.kind!=="loan"&&x.kind!=="pay")return;var sg=lsigned(x,lm),lq=x.kind==="loan"?x:lm[x.loanId],who=lq?lq.person||"":"؟",t;
    if(x.kind==="loan")t=x.dir==="out"?"سلفة لـ"+who:"استلام فلوس من "+who;else t=lq&&lq.dir==="out"?who+" رجّع فلوس":"سداد لـ"+who;
    add({d:x.date,c:x.createdAt||0,a:sg,t:t,k:x.note||"سلف"})});
  if(T.capital)E.push({d:first||todayStr(),c:-1,a:T.capital,t:"رأس المال الأول",k:"أصل رأس المال",cap:1});
  E.sort(function(a,b){return (a.d||"").localeCompare(b.d||"")||a.c-b.c});
  return E;
}

var subLocked=false;
function lockWrites(){
  if(subLocked)return;subLocked=true;
  var F=firebase.firestore;
  function deny(){setTimeout(function(){toast("اشتراكك خلص، البرنامج دلوقتي للعرض بس. جدده عشان تضيف وتعدّل")},40);var e=new Error("expired");e.code="expired";return Promise.reject(e)}
  function wrap(P,names,check){names.forEach(function(n){var o=P[n];if(!o)return;P[n]=function(){if(S.expired&&check(this))return deny();return o.apply(this,arguments)}})}
  function mine(r){return /^users\//.test(r.path||"")}
  try{
    wrap(F.DocumentReference.prototype,["set","update","delete"],mine);
    wrap(F.CollectionReference.prototype,["add"],mine);
    wrap(F.WriteBatch.prototype,["commit"],function(){return true});
  }catch(e){/* لو حصل أي حاجة هنا البرنامج يكمّل عادي، والقواعد على السيرفر هي اللي بتمنع */}
}

function updatePreview(){
  var pv=$("#pv");if(!pv||!modal||modal.type!=="form")return;
  var k=modal.kind;
  if(k==="sellerpay"){
    var Ts=calc(),sa=parseNum(val("amount")),sc2=carById(val("carId")),si=val("src")==="insta";
    var sf2=Ts.safeBal+(si?0:-sa),ib2=Ts.instaBal+(si?-sa:0);
    pv.innerHTML='باقي للبايع بعد السداد: <b>'+m(Math.max((sc2?sc2.sellerRem:0)-sa,0))+'</b><br>بعد العملية: الخزنة <b class="'+(sf2<0?"bad":"")+'">'+m(sf2)+'</b> · إنستاباي <b class="'+(ib2<0?"bad":"")+'">'+m(ib2)+'</b>';
    return;
  }
  if(k==="loan"||k==="loanpay"){
    var Tp=calc(),pa0=parseNum(val("amount")),sg0;
    if(k==="loan")sg0=val("dir")==="in"?pa0:-pa0;
    else{var lq0=loansCalc().find(function(x){return x.id===val("loanId")});sg0=lq0&&lq0.dir==="out"?pa0:-pa0}
    var ins0=val("src")==="insta";
    var sf=Tp.safeBal+(ins0?0:sg0),ib=Tp.instaBal+(ins0?sg0:0);
    pv.innerHTML='بعد العملية: الخزنة <b class="'+(sf<0?"bad":"")+'">'+m(sf)+'</b> · إنستاباي <b class="'+(ib<0?"bad":"")+'">'+m(ib)+'</b>';
    return;
  }
  if(k==="fundmove"){
    var Tm=calc(),fa0=parseNum(val("amount")),tf0=val("dir")!=="fromFund",fi0=val("src")==="insta",sg=tf0?-fa0:fa0;
    var fs=Tm.safeBal+(fi0?0:sg),fi=Tm.instaBal+(fi0?sg:0),fb=Tm.fundBal-sg;
    pv.innerHTML='بعد العملية: العهدة <b>'+m(fb)+'</b> · الخزنة <b class="'+(fs<0?"bad":"")+'">'+m(fs)+'</b> · إنستاباي <b class="'+(fi<0?"bad":"")+'">'+m(fi)+'</b>';
    return;
  }
  if(k==="fundcount"){
    var Tc=calc(),s0=val("amount").trim();if(s0===""){pv.innerHTML="";return}

    return;
  }
  if(k==="buy"||k==="edit"){
    var price=parseNum(val("price")),sum=0,n=0,ssum=0,pd0=val("paid").trim(),stxt="";
    if(pd0!==""){var pdn=parseNum(pd0);stxt=pdn>price?'<b class="bad">المدفوع أكبر من سعر الشراء</b>':'هتدفع دلوقتي: <b>'+m(pdn)+'</b> · باقي للبايع: <b class="warn">'+m(price-pdn)+'</b>'}
    var plist=[],pnames=[];
    document.querySelectorAll("#sheet .prow").forEach(function(r){
      var a=parseNum(r.querySelector(".pa").value),ptx=r.querySelector(".pp").value.trim(),po=r.querySelector(".po");

    });
    ssum=shareSum(plist,price);
    var ilst=[],inames=[],isum=0;
    document.querySelectorAll("#sheet .irow").forEach(function(r){var a=parseNum(r.querySelector(".ia").value),pt=r.querySelector(".ip").value.trim(),md=r.querySelector(".im").value,s=r.querySelector(".iv"),op=s&&s.options[s.selectedIndex];if(a>0){isum+=a;ilst.push({amount:a,pct:pt!==""?parseNum(pt):0,mode:md});inames.push(op?op.text.replace(/ \(متاح.*$/,""):"مستثمر")}});
    if(!n&&!ilst.length){pv.innerHTML=stxt;return}
    var R0=1-ssum,ish=ilst.map(function(v){return invShare(v,R0,price)}),isr=ish.reduce(function(a,b){return a+b},0),mine=price-sum-isum;
    var shl=(n?shareList(plist,price).map(function(s,i){return esc(pnames[i])+' '+pct(s)}):[]).concat(ish.map(function(s,i){return '💼 '+esc(inames[i])+' '+pct(s)}));
    pv.innerHTML=mine<0?'<b class="bad">مبالغ الشركاء والمستثمرين أكبر من سعر الشراء</b>':(ssum>1.0001||isr>R0+0.0001)?'<b class="bad">نسب الأرباح أكتر من ١٠٠٪</b>':
      'رأس مالك: <b>'+m(mine)+'</b>'+(n?' · رأس مال الشركاء: '+m(sum):'')+(isum?' · فلوس مستثمرين: '+m(isum):'')+'<br>نسبة ربحك: <b>'+pct(R0-isr)+'</b> · '+shl.join(' · ');
    if(stxt)pv.innerHTML+='<br>'+stxt;
    return;
  }
  var c=carById(val("carId"));if(!c)return;

    var p=parseNum(val("price")),tv=parseNum(val("tval")),tr=tv>0?Math.min(p,tv):0,rest=p-tr-cash-ins,profit=p-c.cost;
    var t='تكلفة العربية: '+m(c.cost)+'<br>صافي الربح: <b class="'+(profit>=0?"good":"bad")+'">'+m(profit)+'</b>';
    c.invs.forEach(function(v){t+='<br>💼 '+esc(v.name)+' ('+pct(v.share)+'): <b class="'+(profit>=0?"good":"bad")+'">'+m(profit*v.share)+'</b>'});
    if(c.parts.length||c.invs.length)t+='<br>ربحك (نسبة '+pct(c.ownerShare)+'): <b class="'+(profit>=0?"good":"bad")+'">'+m(profit*c.ownerShare)+'</b>';
    if(tv>0)t+=tv>p?'<br>🔁 إنت هتدفع فرق للعميل: <b class="warn">'+m(tv-p)+'</b>':'<br>🔁 العميل هيدفع فرق: <b>'+m(p-tv)+'</b>';
    pv.innerHTML=t+(tv>p?'':'<br>باقي على العميل: <b>'+m(rest>0?rest:0)+'</b>');
  }else if(k==="collect"){
    var after=(c.remaining||0)-cash-ins;
    pv.innerHTML='باقي على العميل دلوقتي: '+m(c.remaining||0)+'<br>بعد التحصيل: <b>'+m(after>0?after:0)+'</b>';
  }
}

    }
  }finally{submitting=false}
}

var PFX="hesabat";
/* ---------- تشغيل أموال (المستثمرين) ---------- */
var INV_MODES=[["mine","من نصيبي أنا (بعد الشركاء)"],["all","من الربح كله"],["money","حسب فلوسه من سعر الشراء"]];
function invById(id){return S.inv.find(function(x){return x.id===id})}
function invName(id){var o=invById(id);return o?o.name:"مستثمر"}
function invShare(v,R0,price){
  var md=v.mode||"mine";
  if(md==="money")return price>0?(+v.amount||0)/price:0;
  var p=hasPctOf(v)?(+v.pct)/100:0;
  return md==="all"?p:p*R0;
}
function invNet(list){var n=0;list.forEach(function(x){if(x.kind==="dep")n+=+x.amount||0;else if(x.kind==="wd")n-=+x.amount||0});return n}
function invModeTxt(v){
  if(v.mode==="money")return "حسب فلوسه";
  if(v.mode==="all")return (v.pct!=null?v.pct+"% ":"")+"من الربح كله";
  return (v.pct!=null?v.pct+"% ":"")+"من نصيبك";
}
function invStats(cars){
  var mp={},list=[];
  S.inv.forEach(function(v){mp[v.id]={id:v.id,name:v.name||"",pct:hasPctOf(v)?+v.pct:null,note:v.note||"",createdAt:v.createdAt||0,dep:0,wd:0,prof:0,loss:0,lr:0,working:0,cars:[],moves:[]};list.push(mp[v.id])});
  S.invmov.forEach(function(x){var o=mp[x.iid];if(!o)return;var a=+x.amount||0;if(x.kind==="dep")o.dep+=a;else if(x.kind==="wd")o.wd+=a;else if(x.kind==="lossrepay")o.lr+=a;o.moves.push(x)});
  cars.forEach(function(c){(c.invs||[]).forEach(function(v){var o=mp[v.iid];if(!o)return;o.cars.push({c:c,v:v});if(!c.sold)o.working+=v.amount;else if(v.profit>=0)o.prof+=v.profit;else o.loss+=-v.profit})});
  var T={list:list,bal:0,working:0,free:0,lossRem:0,prof:0,loss:0,cap:0};
  list.forEach(function(o){
    o.cap=o.dep-o.wd;o.lossRem=o.loss-o.lr;o.profNet=o.prof-o.lr;o.bal=o.cap+o.prof-o.loss;o.free=o.bal-o.working;
    o.repayable=Math.max(0,Math.min(o.lossRem,o.profNet));
    o.moves.sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0)});
    o.cars.sort(function(a,b){return (b.c.buyDate||"").localeCompare(a.c.buyDate||"")});
    T.bal+=o.bal;T.working+=o.working;T.free+=o.free;T.lossRem+=Math.max(o.lossRem,0);T.prof+=o.prof;T.loss+=o.loss;T.cap+=o.cap;
  });
  list.sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0)});
  return T;
}
function invAvail(o,c){var a=o.free;if(c&&!c.sold)(c.invs||[]).forEach(function(v){if(v.iid===o.id)a+=v.amount});return a}

/* investors editor inside the car form */

function investorsBox(ilist,carId){

}
function readInvestors(carId){
  var rows=document.querySelectorAll("#sheet .irow"),out=[],bad=null,T=calc(),c=carId?T.cars.find(function(x){return x.id===carId}):null,used={};
  rows.forEach(function(r){
    if(bad)return;
    var iid=r.querySelector(".iv").value,a=parseNum(r.querySelector(".ia").value),pt=r.querySelector(".ip").value.trim(),md=r.querySelector(".im").value;
    if(!iid&&!a)return;
    var o=T.inv.list.find(function(x){return x.id===iid}),nm=o?o.name:"المستثمر";
    if(!iid){bad="اختار المستثمر";return}
    if(used[iid]){bad=nm+" متكرر في نفس العربية";return}used[iid]=1;
    if(a<=0){bad="اكتب المبلغ اللي هتاخده من "+nm;return}
    if(md!=="money"&&pt===""){bad="حدد نسبة "+nm;return}
    var rec={iid:iid,name:o?o.name:"",amount:a,mode:md==="all"||md==="money"?md:"mine"};
    if(md!=="money"){var pv=parseNum(pt);if(pv<0||pv>100){bad="نسبة الربح لازم تكون من ٠ لـ ١٠٠";return}rec.pct=pv}
    if(o&&!(c&&c.sold)){var av=invAvail(o,c);if(a>av+0.5){bad="رصيد "+nm+" المتاح "+fmt(av)+" بس";return}}
    out.push(rec);
  });
  return bad?{error:bad}:{list:out};
}
function invCheck(plist,ilist,price){
  var tot=plist.reduce(function(a,p){return a+p.amount},0)+ilist.reduce(function(a,v){return a+v.amount},0);
  if(tot>price+0.5)return "مبالغ الشركاء والمستثمرين أكبر من سعر الشراء";
  var R0=1-shareSum(plist,price),s=0;ilist.forEach(function(v){s+=invShare(v,R0,price)});
  if(s>R0+0.0001)return "نسب الأرباح أكتر من ١٠٠٪";
  return null;
}
function invLossPrompt(cid){
  var T=calc(),c=T.cars.find(function(x){return x.id===cid});if(!c||!c.sold)return;
  var hit=null;
  (c.invs||[]).forEach(function(v){if(hit||!(v.profit>0.5))return;var o=T.inv.list.find(function(x){return x.id===v.iid});if(o&&o.lossRem>0.5&&o.repayable>0.5)hit=o});
  if(hit)openForm("invloss",{iid:hit.id,carId:cid,fromSale:true});
}

/* ---------- الكاش بتاع مين ---------- */
function cashOwn(T){
  var pc=0,pw=0;
  T.cars.forEach(function(c){c.parts.forEach(function(p){var r=Math.max(p.remaining,0);if(c.sold)pc+=r;else pw+=r})});
  var ic=Math.max(T.inv.free,0);
  return {pc:pc,pw:pw,ic:ic,iw:T.inv.working,mine:T.cashNow-pc-ic,tot:T.cashNow};
}
function cashSplit(T){
  var hasP=T.cars.some(function(c){return c.parts.length});
  if(!hasP&&!T.inv.list.length)return "";
  var o=cashOwn(T),t=Math.max(o.tot,1),w=function(v){return Math.max(0,Math.min(100,v/t*100))};
  var h='<div class="card"><div class="sect" style="margin-top:0">💵 الكاش بتاع مين؟</div>'+
    '<div style="display:flex;height:10px;border-radius:6px;overflow:hidden;margin:4px 0 10px;background:var(--line)"><div style="width:'+w(o.mine)+'%;background:var(--primary)"></div><div style="width:'+w(o.pc)+'%;background:var(--silver)"></div><div style="width:'+w(o.ic)+'%;background:#8a6d1f"></div></div>'+
    '<div class="kv"><span>💰 بتاعتك انت</span><b class="'+(o.mine<0?"bad":"")+'">'+m(o.mine)+'</b></div>'+
    '<div class="kv"><span>🤝 بتاعة الشركاء <span class="sub">(فلوسهم وأرباحهم من عربيات اتباعت)</span></span><b>'+m(o.pc)+'</b></div>'+
    '<div class="kv"><span>💼 بتاعة المستثمرين <span class="sub">(الكاش بتاعهم)</span></span><b>'+m(o.ic)+'</b></div>'+
    '<div class="kv"><span>الإجمالي (كاش + إنستاباي)</span><b>'+m(o.tot)+'</b></div>';
  if(o.mine<-0.5)h+='<div class="banner" style="margin:10px 0 0">⚠️ انت صارف من فلوس الشركاء أو المستثمرين '+m(-o.mine)+'</div>';
  if(o.pw>0.5||o.iw>0.5)h+='<div class="sub" style="margin-top:8px">وبره الكاش، لسه شغال في عربيات: للشركاء '+m(o.pw)+' · للمستثمرين '+m(o.iw)+'</div>';
  h+='<button class="btn sec small" style="margin-top:10px" data-act="jard">📋 تفاصيل كل شخص</button></div>';
  return h;
}
/* ---------- جرد الشركاء والمستثمرين ---------- */
function jardPeople(){
  var T=calc(),mp={},L=[];
  function get(n){if(!mp[n]){mp[n]={name:n,pc:[],inv:null};L.push(mp[n])}return mp[n]}
  T.cars.forEach(function(c){c.parts.forEach(function(p){if(p.name)get(p.name).pc.push({c:c,p:p})})});
  T.inv.list.forEach(function(o){if(o.name)get(o.name).inv=o});
  L.forEach(function(x){
    var s={amt:0,prof:0,due:0,paid:0,rem:0,open:0,cash:0,inCars:0};
    x.pc.forEach(function(r){s.amt+=r.p.amount;var rr=Math.max(r.p.remaining,0);if(r.c.sold){s.prof+=r.p.profit;s.cash+=rr}else{s.open++;s.inCars+=rr}s.due+=r.p.due;s.paid+=r.p.paid;s.rem+=r.p.remaining});
    x.ps=s;x.kind=x.pc.length&&x.inv?"both":x.inv?"inv":"partner";
    x.ncars=x.pc.length+(x.inv?x.inv.cars.length:0);
    x.owed=s.rem+(x.inv?x.inv.bal:0);x.cash=s.cash+(x.inv?Math.max(x.inv.free,0):0);x.inCars=s.inCars+(x.inv?x.inv.working:0);
    x.net=s.prof+(x.inv?x.inv.prof-x.inv.loss:0);
    x.put=s.amt+(x.inv?x.inv.cap:0);
    x.rows=[];
    x.pc.forEach(function(r){x.rows.push({c:r.c,t:"p",amount:r.p.amount,share:r.p.share,profit:r.p.profit,paid:r.p.paid,rem:r.p.remaining})});
    if(x.inv)x.inv.cars.forEach(function(r){x.rows.push({c:r.c,t:"i",amount:r.v.amount,share:r.v.share,profit:r.v.profit,mode:r.v})});
    x.rows.sort(function(a,b){return (b.c.buyDate||"").localeCompare(a.c.buyDate||"")});
  });
  L.sort(function(a,b){return a.name.localeCompare(b.name,"ar")});
  return {T:T,list:L};
}
function jardKind(x){return x.kind==="both"?"🤝 شريك + 💼 مستثمر":x.kind==="inv"?"💼 مستثمر":"🤝 شريك"}
function jardKindTxt(x){return x.kind==="both"?"شريك/مستثمر":x.kind==="inv"?"مستثمر":"شريك"}

  h+=L.length?'<div class="sect">اختار الشخص اللي عايز تجرده</div><div class="card" style="padding:6px 16px">'+L.map(function(x){
    return '<div class="item car" data-act="person" data-name="'+esc(x.name)+'" style="cursor:pointer"><div style="flex:1"><div class="t">'+esc(x.name)+'<span class="ptag">'+jardKind(x)+'</span></div>'+

  }).join("")+'</div><div class="sub" style="margin:6px 2px">الرقم اللي جنب كل اسم = اللي ليه عندك (للشريك: فلوسه + ربحه − اللي اتسلّمه، وللمستثمر: رصيده).</div>':

  return h;
}

  if(x.inv){var o=x.inv,kv=[["إجمالي اللي جابه",rnum(o.dep)+" ج"]];
    if(o.wd>0.5)kv.push(["− اللي اتسحب له",rnum(o.wd)+" ج",RK.bad]);
    kv.push(["+ أرباحه",rnum(o.prof)+" ج",RK.good]);
    if(o.loss>0.5)kv.push(["− خسائره",rnum(o.loss)+" ج",RK.bad]);
    if(o.lossRem>0.5)kv.push(["خسارة عليه لسه",rnum(o.lossRem)+" ج",RK.warn]);
    kv.push(["= رصيده",rnum(o.bal)+" ج",RK.gold2],["منه في الخزنة",rnum(o.free)+" ج"],["منه في عربيات",rnum(o.working)+" ج"]);
    B.push({t:"sec",title:"حسابه كمستثمر"});B.push({t:"kv",rows:kv});
  }

}
function rbJardAll(){
  var J=jardPeople(),L=J.list;if(!L.length)return null;
  var np=0,ni=0,owP=0,pP=0,pI=0;
  L.forEach(function(x){if(x.pc.length){np++;owP+=x.ps.rem;pP+=x.ps.prof}if(x.inv){ni++;pI+=x.inv.prof-x.inv.loss}});
  var owI=J.T.inv.bal;
  var B=[{t:"tiles",items:[{l:"إجمالي اللي ليهم عندي",v:rnum(owP+owI)+" ج",acc:true},{l:"عدد الناس",v:String(L.length)},
    {l:"مستحق للشركاء ("+np+")",v:rnum(owP)+" ج"},{l:"أرصدة المستثمرين ("+ni+")",v:rnum(owI)+" ج"},
    {l:"أرباح الشركاء",v:rnum(pP,true)+" ج",c:rcol(pP)},{l:"صافي أرباح المستثمرين",v:rnum(pI,true)+" ج",c:rcol(pI)}]}];
  var CO=cashOwn(J.T);B[0].items.push({l:"منها في الخزنة",v:rnum(CO.pc+CO.ic)+" ج"},{l:"منها في عربيات",v:rnum(CO.pw+CO.iw)+" ج"});
  B.push({t:"sec",title:"الكاش بتاع مين"});B.push({t:"kv",rows:[["بتاعتي انا",rnum(CO.mine)+" ج",CO.mine<0?RK.bad:RK.gold2],["بتاعة الشركاء",rnum(CO.pc)+" ج"],["بتاعة المستثمرين",rnum(CO.ic)+" ج"],["إجمالي الكاش",rnum(CO.tot)+" ج"]]});
  B.push({t:"sec",title:"الجرد"});
  var tc=0,tn=0,to=0,tt=0;
  B.push({t:"table",cols:[{h:"الاسم",w:.24},{h:"الصفة",w:.17},{h:"عربيات",w:.1},{h:"دفع",w:.16,k:"n"},{h:"ربحه",w:.15,k:"n",s:1},{h:"ليه عندي",w:.18,k:"n"}],
    rows:L.map(function(x){tt+=x.ncars;tc+=x.put;tn+=x.net;to+=x.owed;return [x.name,jardKindTxt(x),String(x.ncars),x.put,{v:x.net,c:rcol(x.net)},{v:x.owed,c:x.owed>0.5?RK.warn:RK.text}]})
      .concat([{cells:["الإجمالي","",String(tt),tc,{v:tn,c:rcol(tn)},to]}])});
  B.push({t:"note",text:"«دفع» للشريك = اللي دفعه في العربيات، وللمستثمر = رأس ماله (اللي جابه − اللي سحبه). «ليه عندي» = الباقي للشريك + رصيد المستثمر. التقرير للمراجعة بس ومش بيسجّل أي حركة."});
  return {title:"جرد شامل للشركاء والمستثمرين",sub:L.length+" شخص · حتى "+rfd(todayStr()),file:PFX+"-jard-all-"+todayStr(),blocks:B};
}

/* investor reports */
function rbInvestor(){
  var T=calc(),o=T.inv.list.find(function(x){return x.id===modal.inv});if(!o)return null;
  var pc=function(x){return (Math.round((x||0)*1000)/10)+"%"},fz=function(x){return String(x).replace(/[\\\/:*?"<>|\s]+/g,"-")};
  var it=[{l:"رصيده الحالي",v:rnum(o.bal)+" ج",acc:true},{l:"رأس ماله (اللي جابه − اللي سحبه)",v:rnum(o.cap)+" ج"},{l:"أرباحه من العربيات",v:rnum(o.prof)+" ج",c:RK.good},
    {l:"شغال في عربيات",v:rnum(o.working)+" ج"},{l:"كاش في الخزنة",v:rnum(o.free)+" ج"}];
  if(o.loss>0.5)it.push({l:"خسائره من العربيات",v:rnum(o.loss)+" ج",c:RK.bad},{l:"خسارة عليه لسه",v:rnum(Math.max(o.lossRem,0))+" ج",c:o.lossRem>0.5?RK.warn:RK.good});
  var B=[{t:"tiles",items:it}];
  var cars=o.cars.slice().sort(function(a,b){return (a.c.buyDate||"").localeCompare(b.c.buyDate||"")});
  if(cars.length){
    var ta=0,tp=0;
    B.push({t:"sec",title:"العربيات اللي دخل فيها ("+cars.length+")"});
    B.push({t:"table",cols:[{h:"العربية",w:.32},{h:"من فلوسه",w:.2,k:"n"},{h:"نصيبه",w:.13},{h:"ربحه",w:.18,k:"n",s:1},{h:"الحالة",w:.17}],
      rows:cars.map(function(x){var c=x.c,v=x.v;ta+=v.amount;if(c.sold)tp+=v.profit;return [c.name,v.amount,pc(v.share),c.sold?{v:v.profit,c:rcol(v.profit)}:"",c.sold?"اتباعت":"في المعرض"]})
        .concat([{cells:["الإجمالي",ta,"",{v:tp,c:rcol(tp)},""]}])});
  }else B.push({t:"empty",text:"لسه ما دخلش في أي عربية"});
  var mv=o.moves.filter(function(x){return x.kind!=="lossrepay"}).sort(function(a,b){return (a.date||"").localeCompare(b.date||"")});
  if(mv.length){B.push({t:"sec",title:"الإيداعات والسحوبات"});
    B.push({t:"table",cols:[{h:"البند",w:.5},{h:"التاريخ",w:.22},{h:"المبلغ",w:.28,k:"n",s:1}],
      rows:mv.map(function(x){var a=+x.amount||0,d=x.kind==="dep";return [(d?"إيداع":"سحب")+(x.note?" - "+x.note:""),rfd(x.date),{v:d?a:-a,c:d?RK.good:RK.bad}]})})}
  var lr=o.moves.filter(function(x){return x.kind==="lossrepay"}).sort(function(a,b){return (a.date||"").localeCompare(b.date||"")});
  if(lr.length)B.push({t:"table",cols:[{h:"سداد الخسارة من أرباحه",w:.5},{h:"التاريخ",w:.22},{h:"المبلغ",w:.28,k:"n"}],rows:lr.map(function(x){return ["دفعة سداد",rfd(x.date),+x.amount||0]}).concat([{cells:["الإجمالي","",o.lr]}])});
  B.push({t:"sec",title:"الحساب"});
  var kv=[["إجمالي اللي جابه",rnum(o.dep)+" ج"]];
  if(o.wd>0.5)kv.push(["− اللي اتسحب له",rnum(o.wd)+" ج",RK.bad]);
  kv.push(["+ أرباحه",rnum(o.prof)+" ج",RK.good]);
  if(o.loss>0.5)kv.push(["− خسائره",rnum(o.loss)+" ج",RK.bad]);
  kv.push(["= رصيده الحالي",rnum(o.bal)+" ج",RK.gold2]);
  B.push({t:"kv",rows:kv});
  B.push({t:"note",text:"فلوس المستثمر محسوبة لوحدها بعيد عن رأس مال المعرض. لما بتدخل عربية بيتاخد جزء من رصيده، وبعد البيع فلوسه ونصيبه من الربح أو الخسارة بيرجعوا لرصيده. الربح الصافي = سعر البيع − (سعر الشراء + المصاريف)."});
  return {title:"كشف حساب مستثمر",sub:o.name+" · حتى "+rfd(todayStr()),file:PFX+"-investor-"+fz(o.name)+"-"+todayStr(),blocks:B};
}
function rbInvAll(){
  var T=calc(),I=T.inv;if(!I.list.length)return null;
  var B=[{t:"tiles",items:[{l:"إجمالي فلوس المستثمرين",v:rnum(I.bal)+" ج",acc:true},{l:"شغالة في عربيات",v:rnum(I.working)+" ج"},{l:"كاش في الخزنة",v:rnum(I.free)+" ج"},
    {l:"أرباحهم من العربيات",v:rnum(I.prof)+" ج",c:RK.good},{l:"عدد المستثمرين",v:String(I.list.length)}]}];
  if(I.loss>0.5)B[0].items.push({l:"خسائر عليهم لسه",v:rnum(I.lossRem)+" ج",c:I.lossRem>0.5?RK.warn:RK.good});
  B.push({t:"sec",title:"المستثمرين"});
  var tc=0,tpf=0,tl=0,tw=0,tb=0;
  B.push({t:"table",cols:[{h:"المستثمر",w:.22},{h:"رأس ماله",w:.16,k:"n"},{h:"أرباحه",w:.15,k:"n"},{h:"خسائره",w:.14,k:"n"},{h:"في عربيات",w:.15,k:"n"},{h:"الرصيد",w:.18,k:"n"}],
    rows:I.list.map(function(o){tc+=o.cap;tpf+=o.prof;tl+=o.loss;tw+=o.working;tb+=o.bal;return [o.name,o.cap,{v:o.prof,c:RK.good},o.loss>0.5?{v:o.loss,c:RK.bad}:"",o.working,o.bal]})
      .concat([{cells:["الإجمالي",tc,tpf,tl,tw,tb]}])});
  var owe=I.list.filter(function(o){return o.lossRem>0.5});
  if(owe.length)B.push({t:"table",cols:[{h:"خسائر لسه عليهم",w:.4},{h:"اتسدد من أرباحه",w:.3,k:"n"},{h:"الباقي عليه",w:.3,k:"n"}],rows:owe.map(function(o){return [o.name,o.lr,{v:o.lossRem,c:RK.warn}]})});
  var act=[];T.cars.forEach(function(c){if(!c.sold&&c.invs.length)act.push(c)});
  if(act.length){B.push({t:"sec",title:"عربيات في المعرض بفلوس مستثمرين ("+act.length+")"});
    B.push({t:"table",cols:[{h:"العربية",w:.4},{h:"المستثمر",w:.32},{h:"من فلوسه",w:.28,k:"n"}],
      rows:[].concat.apply([],act.map(function(c){return c.invs.map(function(v){return [c.name,v.name,v.amount]})}))})}
  B.push({t:"note",text:"الرصيد = رأس ماله (اللي جابه − اللي اتسحب له) + أرباحه − خسائره. التقرير ده للمراجعة بس ومش بيسجّل أي حركة."});
  return {title:"تقرير شامل للمستثمرين",sub:I.list.length+" مستثمر · حتى "+rfd(todayStr()),file:PFX+"-investors-"+todayStr(),blocks:B};
}

function rlayout(ctx,spec,imgs,draw){
  var W=RW,R=W-RP,y=46,B=spec.blocks,eS=168;
  if(draw){
    ctx.save();rrect(ctx,R-eS,y,eS,eS,28);ctx.clip();if(imgs.emb)ctx.drawImage(imgs.emb,R-eS,y,eS,eS);ctx.restore();

    rtxt(ctx,brandName(),R-eS-30,y+84,rf(54,800),RK.gold,"right","rtl");
    rtxt(ctx,"كشف حساب",R-eS-30,y+134,rf(29,600),RK.silver,"right","rtl");
  }

  if(draw){var g=ctx.createLinearGradient(RP,0,R,0);g.addColorStop(0,"rgba(212,175,55,0)");g.addColorStop(.5,RK.gold);g.addColorStop(1,"rgba(212,175,55,0)");ctx.fillStyle=g;ctx.fillRect(RP,y,R-RP,3)}
  y+=40;
  if(draw)rtxt(ctx,rfit(ctx,spec.title,rf(48,800),R-RP),R,y+40,rf(48,800),RK.gold2);
  y+=62;
  if(draw)rtxt(ctx,rfit(ctx,spec.sub,rf(29,600),R-RP),R,y+28,rf(29,600),RK.muted);
  y+=58;
  B.forEach(function(b){
    if(b.t==="tiles"){
      var tw=(R-RP-24)/2,th=122;
      b.items.forEach(function(it,i){
        var col=i%2,row=Math.floor(i/2),x=R-tw-col*(tw+24),yy=y+row*(th+20);
        if(!draw)return;
        if(it.acc){var g2=ctx.createLinearGradient(x,yy,x+tw,yy+th);g2.addColorStop(0,"#ecd27a");g2.addColorStop(1,"#b08a22");rrect(ctx,x,yy,tw,th,22,g2)}
        else rrect(ctx,x,yy,tw,th,22,RK.panel,RK.line);
        rtxt(ctx,rfit(ctx,it.l,rf(25,600),tw-48),x+tw-24,yy+44,rf(25,600),it.acc?"#2a2007":RK.muted);
        rtxt(ctx,it.v,x+tw-24,yy+102,rf(40,800),it.acc?"#17110a":(it.c||RK.text),"right","ltr");
      });
      y+=Math.ceil(b.items.length/2)*(th+20)+8;
    }else if(b.t==="sec"){
      y+=26;
      if(draw){rrect(ctx,R-8,y,8,38,4,RK.gold);rtxt(ctx,rfit(ctx,b.title,rf(34,800),R-RP-40),R-28,y+31,rf(34,800),RK.gold2)}
      y+=68;
    }else if(b.t==="table"){
      var tw2=R-RP,xs=[],acc=R;
      b.cols.forEach(function(c){var w=c.w*tw2;xs.push({r:acc,w:w});acc-=w});
      if(draw){rrect(ctx,RP,y,tw2,52,14,"#1b1608");b.cols.forEach(function(c,i){rtxt(ctx,c.h,xs[i].r-16,y+35,rf(23,700),RK.gold,"right","rtl")})}
      y+=52;
      b.rows.forEach(function(row,ri){
        var cells=Array.isArray(row)?row:row.cells,tot=!Array.isArray(row),rh=62;
        if(draw){
          if(tot){ctx.fillStyle=RK.gold;ctx.fillRect(RP,y,tw2,2)}
          else if(ri%2===1)rrect(ctx,RP,y,tw2,rh,0,"rgba(255,255,255,.035)");
          cells.forEach(function(cell,i){
            if(cell==null||cell==="")return;
            var v=(typeof cell==="object")?cell.v:cell,cc=(typeof cell==="object")?cell.c:null,col=b.cols[i];
            if(col.k==="n")rtxt(ctx,rnum(v,col.s),xs[i].r-16,y+41,rf(28,800),tot?RK.gold2:(cc||RK.text),"right","ltr");
            else rtxt(ctx,rfit(ctx,v,rf(27,tot?800:600),xs[i].w-30),xs[i].r-16,y+41,rf(27,tot?800:600),tot?RK.gold2:(cc||RK.text),"right","rtl");
          });
          if(!tot){ctx.fillStyle=RK.line;ctx.fillRect(RP,y+rh-1,tw2,1)}
        }
        y+=rh;
      });
      y+=14;
    }else if(b.t==="kv"){
      var rh2=60,hh=b.rows.length*rh2+20;
      if(draw){
        rrect(ctx,RP,y,R-RP,hh,22,RK.panel,RK.line);
        b.rows.forEach(function(r,i){
          var yy=y+10+i*rh2;
          rtxt(ctx,r[0],R-26,yy+40,rf(27,600),RK.muted);
          rtxt(ctx,r[1],RP+26,yy+40,rf(28,800),r[2]||RK.text,"left",r[3]||"ltr");
          if(i<b.rows.length-1){ctx.fillStyle=RK.line;ctx.fillRect(RP+22,yy+rh2-1,R-RP-44,1)}
        });
      }
      y+=hh+16;
    }else if(b.t==="note"){
      ctx.font=rf(24,600);ctx.direction="rtl";
      var words=b.text.split(" "),lines=[],cur="";
      words.forEach(function(w){var tt=cur?cur+" "+w:w;if(ctx.measureText(tt).width>R-RP-20&&cur){lines.push(cur);cur=w}else cur=tt});
      if(cur)lines.push(cur);
      if(draw)lines.forEach(function(l,i){rtxt(ctx,l,R-10,y+30+i*40,rf(24,600),RK.muted)});
      y+=lines.length*40+18;
    }else if(b.t==="empty"){
      if(draw){rrect(ctx,RP,y,R-RP,120,22,RK.panel,RK.line);rtxt(ctx,b.text,W/2,y+72,rf(30,600),RK.muted,"center","rtl")}
      y+=140;
    }
  });
  y+=30;
  if(draw){
    ctx.fillStyle=RK.line;ctx.fillRect(RP,y,R-RP,2);
    rtxt(ctx,brandName(),W/2,y+48,rf(24,600),RK.silver,"center","rtl");
    rtxt(ctx,"تاريخ الإصدار "+rfd(todayStr()),W/2,y+88,rf(22,400),RK.muted,"center","rtl");
  }
  return y+120;
}

async function renderReport(spec){
  try{await Promise.all([document.fonts.load("400 24px Cairo",ARTXT),document.fonts.load("600 24px Cairo",ARTXT),document.fonts.load("700 30px Cairo",ARTXT),document.fonts.load("800 30px Cairo",ARTXT),document.fonts.load("800 54px Cairo",brandName())])}catch(e){}
  var imgs={emb:(await loadImg(brandLogo()))||(await loadImg(IMG_EMB)),full:await loadImg(IMG_FULL)};
  var mc=document.createElement("canvas");mc.width=RW;mc.height=10;
  var H=Math.ceil(rlayout(mc.getContext("2d"),spec,imgs,false));
  var cv=document.createElement("canvas");cv.width=RW;cv.height=H;
  var ctx=cv.getContext("2d");ctx.fillStyle=RK.bg;ctx.fillRect(0,0,RW,H);
  if(imgs.full){var ws=Math.min(RW*.95,Math.max(H*.6,520));ctx.globalAlpha=.045;ctx.drawImage(imgs.full,(RW-ws)/2,Math.max(H/2-ws/2,200),ws,ws);ctx.globalAlpha=1}
  rlayout(ctx,spec,imgs,true);
  return cv;
}

function stlRange(){

  else if(sp==="month")f=t.slice(0,8)+"01";
  else if(sp==="range"){f=modal.sf||"";t=modal.st||t}
  return {f:f,t:t};
}
function stlCars(){
  var R=stlRange(),sp=modal.sp||"all";
  return calc().cars.filter(function(c){return c.sold&&(sp==="all"||((c.sellDate||"")>=R.f&&(c.sellDate||"")<=R.t))})
    .sort(function(a,b){return (b.sellDate||"").localeCompare(a.sellDate||"")});
}
function stlSelected(){var sel=modal.sel||{};return stlCars().filter(function(c){return sel[c.id]})}

function stlFx(c){return typeof c.fexp==="number"?c.fexp:c.exp}

      rows:rows.concat([{cells:["الإجمالي",tc,{v:tp,c:rcol(tp)},pDue,pPaid,pRem]}])});

  var R=stlRange(),sp=modal.sp||"all",sub=cars.length+" عربية · "+(sp==="all"?"حتى "+rfd(todayStr()):"من "+rfd(R.f)+" إلى "+rfd(R.t));
  return {title:"تقفيل حساب",sub:sub,file:"hesabat-settle-"+todayStr(),blocks:B};

  for(i=1;i<=5;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  add(x+"trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");
  var bin=parts.join(""),u=new Uint8Array(bin.length);
  for(i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);

}

  }catch(e){if(e&&e.name==="AbortError")return}

/* ---------- cloud backups ---------- */
var BK_KEEP=30,bkBusy=false,bkLastJson=null,bkBooted=false;
function bkPayload(){var d={};Object.keys(COLLS).forEach(function(k){d[COLLS[k]]=S[k]});return {app:"hesabat",version:1,at:new Date().toISOString(),settings:S.settings||null,brand:S.brand||null,data:d}}
async function cloudBackup(reason,force){
  if(DEMO||!S.user||!allLoaded()||bkBusy||S.expired)return false;
  var j=bkPayload(),core=JSON.stringify({s:j.settings,b:j.brand,d:j.data});
  var lk="hb_bk_"+S.user.uid,last=+lsGet(lk)||0,now=Date.now();
  if(!force){
    if(reason==="open"&&now-last<6*3600e3)return false;
    if(reason==="close"&&(core===bkLastJson||now-last<20*60e3))return false;
  }
  var str=JSON.stringify(j);if(str.length>900000){if(force)toast("البيانات كبيرة على النسخة السحابية، خد نسخة على الموبايل");return false}
  bkBusy=true;
  try{
    await db.collection("backups").doc().set({at:now,reason:reason,cars:S.cars.length,size:str.length,json:str});
    lsSet(lk,String(now));bkLastJson=core;
    var snap=await db.collection("backups").orderBy("at","desc").get();
    snap.docs.slice(BK_KEEP).forEach(function(d){d.ref.delete().catch(function(){})});
    return true;
  }catch(e){if(force)toast("تعذر عمل النسخة، اتأكد من النت");return false}
  finally{bkBusy=false}
}
function bkBoot(){if(bkBooted||DEMO||!allLoaded())return;bkBooted=true;bkLastJson=null;cloudBackup("open")}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")cloudBackup("close")});
window.addEventListener("pagehide",function(){cloudBackup("close")});
function bkWhen(t){var d=new Date(t);return '<bdi>'+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()+" — "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+'</bdi>'}
var BK_LBL={open:"عند الفتح",close:"عند القفل",manual:"يدوي",prerestore:"قبل الاسترجاع"};
async function openCloud(){
  if(DEMO)return toast("النسخ السحابية مش متاحة في النسخة التجريبية");
  modal={type:"cloud"};
  openSheet(sheetHead("☁️ النسخ الاحتياطية")+'<div class="empty">جاري التحميل…</div>');
  try{
    var snap=await db.collection("backups").orderBy("at","desc").limit(BK_KEEP).get();
    if(!modal||modal.type!=="cloud")return;
    var rows=snap.docs.map(function(d){var x=d.data();return '<div class="card bkrow"><div><div style="font-weight:700">'+bkWhen(x.at)+'</div><div class="sub">'+(BK_LBL[x.reason]||"")+' · '+(x.cars||0)+' عربية</div></div><button class="btn sec small" data-act="cloudRestore" data-id="'+d.id+'">استرجاع</button></div>'}).join("");
    $("#sheet").innerHTML=sheetHead("☁️ النسخ الاحتياطية")+'<div class="sub" style="margin-bottom:12px">النسخ دي محفوظة على السيرفر مش على موبايلك. بتتعمل لوحدها لما تفتح البرنامج وتقفله، وبنحتفظ بآخر '+BK_KEEP+' نسخة. لو موبايلك ضاع، ادخل بحسابك من أي موبايل وهتلاقي بياناتك.</div>'+
      '<button class="btn" data-act="cloudNow" style="margin-bottom:14px">عمل نسخة دلوقتي</button>'+(rows||'<div class="empty">لسه مفيش نسخ</div>');
  }catch(e){$("#sheet").innerHTML=sheetHead("☁️ النسخ الاحتياطية")+'<div class="banner">تعذر تحميل النسخ، اتأكد من النت.</div>'}
}
async function cloudRestore(id){
  try{var d=await db.doc("backups/"+id).get();var j=JSON.parse(d.data().json)}catch(e){return toast("تعذر قراءة النسخة")}
  confirmBox("هترجّع بياناتك لـ "+bkWhen(d.data().at)+". أي حاجة اتسجلت بعدها هتتشال (وهنعمل نسخة من الوضع الحالي قبل الاسترجاع عشان لو غيّرت رأيك). متأكد؟",async function(){
    await cloudBackup("prerestore",true);
    try{
      var ops=[];
      Object.keys(COLLS).forEach(function(k){
        var c=COLLS[k],keep={};(j.data[c]||[]).forEach(function(x){keep[x.id]=1;var o=Object.assign({},x);delete o.id;ops.push(["set",c+"/"+x.id,o])});
        (S[k]||[]).forEach(function(x){if(!keep[x.id])ops.push(["del",c+"/"+x.id])});
      });
      ops.push(j.settings?["set","settings/main",j.settings]:["del","settings/main"]);
      ops.push(j.brand?["set","settings/brand",j.brand]:["del","settings/brand"]);
      for(var i=0;i<ops.length;i+=400){var b=FS.batch();ops.slice(i,i+400).forEach(function(x){if(x[0]==="set")b.set(db.doc(x[1]),x[2]);else b.delete(db.doc(x[1]))});await b.commit()}
      closeSheet();toast("اترجعت البيانات ✔");
    }catch(e){toast("تعذر الاسترجاع، جرّب تاني")}
  });
}
