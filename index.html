<style>
:root{
  --bg:#050505; --card:#121110; --text:#f3ecda; --muted:#a89f8a; --line:#2b2517;
  --primary:#d4af37; --primary-ink:#0a0804; --soft:#201a09; --silver:#b9bdc4;
  --good:#3ddc84; --good-bg:#10291a; --bad:#ff6b60; --bad-bg:#341816; --warn:#ffb74d; --warn-bg:#33260d;
  --shadow:0 2px 14px rgba(0,0,0,.6);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
#app{max-width:640px;margin:0 auto;padding:14px 14px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
.top h1{font-size:20px;margin:0;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{background:linear-gradient(135deg,#e6c15a 0%,#c39a2c 55%,#a67f1f 100%);color:#17110a;border-radius:22px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero .l{opacity:.8;font-size:14px}
.hero .v{font-size:34px;font-weight:800;margin:2px 0}
.hero .s{opacity:.8;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.tl{color:var(--muted);font-size:13px}
.tv{font-size:20px;font-weight:800;margin-top:2px}
.ts{color:var(--muted);font-size:12px;margin-top:2px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.abtn{border:0;border-radius:16px;padding:16px 8px;background:var(--soft);color:var(--primary);font-weight:700;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.abtn .ic{font-size:26px}
.abtn:active,.btn:active{transform:scale(.98)}
.btn{border:0;border-radius:14px;padding:14px 16px;background:var(--primary);color:var(--primary-ink);font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:var(--soft);color:var(--primary)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.small{padding:9px 12px;font-size:14px;width:auto;border-radius:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-stock{background:var(--soft);color:var(--primary)}
.b-paid{background:var(--good-bg);color:var(--good)}
.b-debt{background:var(--warn-bg);color:var(--warn)}
.ptag{font-size:12px;background:var(--soft);color:var(--primary);border-radius:99px;padding:2px 8px;margin-inline-start:6px;font-weight:700}
.car{cursor:pointer}
.car .name{font-weight:700;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;white-space:nowrap;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);margin-bottom:10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.nav button{flex:1;border:0;background:none;padding:6px 1px;color:var(--muted);font-weight:600;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ic{font-size:20px}
.nav button.on{color:var(--primary)}
.ov{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh h2{margin:0;font-size:19px}
.x{border:0;background:var(--card);border-radius:99px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--muted)}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:14px;color:var(--muted);margin-bottom:5px;font-weight:600}
.fld input,.fld select,.prow input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--card)}
.fld input:focus,.fld select:focus,.search:focus,.prow input:focus{outline:2px solid var(--primary);outline-offset:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:12px;align-items:center}
.prow .pp{grid-column:1/-1;border-style:dashed}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.preview{background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.preview:empty{display:none}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700}
.pcard{border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-top:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .d{color:var(--muted);font-size:12px}
.del{border:0;background:none;color:var(--muted);font-size:17px;cursor:pointer;padding:6px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.sect{font-weight:800;margin:14px 2px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#1b160a;color:#f3ecda;border:1px solid #d4af37;padding:11px 18px;border-radius:14px;z-index:60;font-weight:600;max-width:90%;text-align:center;display:none}
.toast.show{display:block}
.login{max-width:380px;margin:8vh auto 0;text-align:center}.login img{width:120px;height:120px;border-radius:26px;box-shadow:var(--shadow);margin-bottom:10px}.login h2{font-family:"Cinzel",serif;color:var(--primary);letter-spacing:2px;margin:6px 0 2px;font-size:26px}.login form{text-align:right;margin-top:18px}.login .err{color:var(--bad);font-size:14px;min-height:20px;margin:4px 0 10px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:14px;margin-bottom:12px;font-weight:600}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav input{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);text-align:center}
.daynav button{border:0;background:var(--card);border-radius:12px;width:44px;height:46px;font-size:18px;cursor:pointer;box-shadow:var(--shadow);color:var(--text)}
.ok{color:var(--good);font-weight:700;font-size:13px}

function parseNum(v){

function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){var p=s.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fdate(s){return s?'<bdi>'+s.split("-").reverse().join("/")+'</bdi>':""}
function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("show")},2600)}

/* ---------- state ---------- */
var db=null,FS=null;
var S={cars:[],expenses:[],cols:[],cap:[],pay:[],transfers:[],ledger:[],settings:null,loaded:{},tab:"home",filter:"stock",q:"",day:todayStr(),noDb:false,err:null,auth:"checking"};
var modal=null;
function allLoaded(){var l=S.loaded;return l.cars&&l.expenses&&l.cols&&l.cap&&l.pay&&l.transfers&&l.ledger&&l.settings}

/* ---------- calculations ---------- */
function paidNow(c){var b=+c.buyPrice||0;return typeof c.buyPaid==="number"?Math.max(0,Math.min(c.buyPaid,b)):b}
function flowsOf(cars,d){
  var cash=0,insta=0,ids={},pk={};
  cars.forEach(function(c){ids[c.id]=1;c.parts.forEach(function(p){pk[c.id+"|"+p.id]=1})});
  function ok(x){return d==null||x===d}
  function add(src,n){if(src==="insta")insta+=n;else cash+=n}
  cars.forEach(function(c){if(ok(c.buyDate))add(c.buySrc,-paidNow(c)+c.pTotal)});
  S.expenses.forEach(function(e){if(ids[e.carId]&&ok(e.date))add(e.src,-(+e.amount||0))});
  S.cols.forEach(function(x){if(ids[x.carId]&&ok(x.date)){cash+=+x.cash||0;insta+=+x.insta||0}});
  S.pay.forEach(function(x){if(pk[x.carId+"|"+x.pid]&&ok(x.date))add(x.src,-(+x.amount||0))});
  S.cap.forEach(function(x){if((x.kind==="withdraw"||x.kind==="pwithdraw")&&ok(x.date))add(x.src,-(+x.amount||0))});
  S.transfers.forEach(function(x){if(!ok(x.date))return;var a=+x.amount||0;if(x.dir==="toInsta"){cash-=a;insta+=a}else{cash+=a;insta-=a}});
  S.ledger.forEach(function(x){if(x.kind==="spay"&&ids[x.carId]&&ok(x.date))add(x.src,-(+x.amount||0))});
  var lm=lmapOf();
  S.ledger.forEach(function(x){if(ok(x.date))add(x.src,lsigned(x,lm))});
  return {cash:cash,insta:insta};
}
function calc(){
  var exp={},cash={},insta={},paidBy={},lossPd={},spd={};
  S.expenses.forEach(function(e){exp[e.carId]=(exp[e.carId]||0)+(+e.amount||0)});
  S.cols.forEach(function(c){cash[c.carId]=(cash[c.carId]||0)+(+c.cash||0);insta[c.carId]=(insta[c.carId]||0)+(+c.insta||0)});
  S.pay.forEach(function(p){var k=p.carId+"|"+p.pid;paidBy[k]=(paidBy[k]||0)+(+p.amount||0)});
  S.cap.forEach(function(x){if(x.kind==="lossrepay"&&x.carId)lossPd[x.carId]=(lossPd[x.carId]||0)+(+x.amount||0)});
  S.ledger.forEach(function(x){if(x.kind==="spay")spd[x.carId]=(spd[x.carId]||0)+(+x.amount||0)});
  var cars=S.cars.map(function(c){
    var e=exp[c.id]||0,ca=cash[c.id]||0,ins=insta[c.id]||0,sold=typeof c.sellPrice==="number";
    var buy=+c.buyPrice||0,cost=buy+e,owedS=buy-paidNow(c),sPaid=spd[c.id]||0;
    var profit=sold?c.sellPrice-cost:null;
    var parts=(c.partners||[]).map(function(p){
      var amt=+p.amount||0,hasPct=p.pct!=null&&p.pct!==""&&isFinite(+p.pct),share=hasPct?(+p.pct)/100:(buy>0?amt/buy:0);
      var due=amt+(sold?profit*share:0),paid=paidBy[c.id+"|"+p.id]||0;
      return {id:p.id,name:p.name,amount:amt,pct:hasPct?+p.pct:null,share:share,profit:sold?profit*share:null,due:due,paid:paid,remaining:due-paid};
    });
    var pTotal=parts.reduce(function(a,p){return a+p.amount},0);
    var ownerCap=buy-pTotal,ownerShare=parts.length?1-parts.reduce(function(a,p){return a+p.share},0):1;
    var mp=sold?profit*ownerShare:null;
    var lossActive=!!(sold&&c.lossDeferred&&mp<0),lossAmt=lossActive?-mp:0,lossPaid=lossActive?(lossPd[c.id]||0):0;
    return Object.assign({},c,{owedSeller:owedS,sellerPaid:sPaid,sellerRem:owedS-sPaid,exp:e,cashIn:ca,instaIn:ins,cost:cost,sold:sold,profit:profit,
      remaining:sold?c.sellPrice-ca-ins:null,parts:parts,pTotal:pTotal,ownerCap:ownerCap,ownerShare:ownerShare,
      myProfit:mp,lossActive:lossActive,lossAmt:lossAmt,lossPaid:lossPaid,lossRem:lossAmt-lossPaid});
  }).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
  var capital=+(S.settings&&S.settings.capital)||0, fund=+(S.settings&&S.settings.fund)||0;
  var withdraw=0,repay=0,pw=0;
  S.cap.forEach(function(x){var a=+x.amount||0;if(x.kind==="withdraw")withdraw+=a;else if(x.kind==="repay")repay+=a;else if(x.kind==="pwithdraw")pw+=a});
  var profit=0,profitEx=0,lossDef=0,lossPaid=0,soldN=0,stockN=0,stockCost=0,debts=0,deposits=0,unre=0,cashTot=0,instaTot=0,pOwed=0;
  cars.forEach(function(c){
    cashTot+=c.cashIn;instaTot+=c.instaIn;
    c.parts.forEach(function(p){pOwed+=p.remaining});
    if(c.sold){
      soldN++;profit+=c.myProfit;
      if(c.lossActive){lossDef+=c.lossAmt;lossPaid+=c.lossPaid}else profitEx+=c.myProfit;
      if(c.remaining>0)debts+=c.remaining;
    }else{stockN++;stockCost+=c.cost;deposits+=c.cashIn+c.instaIn}
    if(!c.reimbursed)unre+=c.exp;
  });
  var recv=0,owe=0;loansCalc().forEach(function(l){if(l.dir==="out")recv+=l.remaining;else owe+=l.remaining});
  var sOwe=0;cars.forEach(function(c){sOwe+=c.sellerRem});owe+=sOwe;
  var F=flowsOf(cars),safeBal=capital+F.cash,instaBal=F.insta,cashNow=safeBal+instaBal;
  var lossRem=lossDef-lossPaid,wDef=withdraw-repay,deficit=wDef+lossRem,capNow=capital-deficit;
  var undist=profitEx-repay-lossPaid-pw,value=capNow+undist;
  var check=Math.round(cashNow+stockCost+debts+recv-owe-deposits-pOwed-value)===0;
  return {cars:cars,capital:capital,fund:fund,withdraw:withdraw,repay:repay,pw:pw,wDef:wDef,deficit:deficit,capNow:capNow,undist:undist,value:value,
    profit:profit,profitEx:profitEx,recv:recv,owe:owe,sOwe:sOwe,lossDef:lossDef,lossPaid:lossPaid,lossRem:lossRem,
    soldN:soldN,stockN:stockN,stockCost:stockCost,debts:debts,cashNow:cashNow,safeBal:safeBal,instaBal:instaBal,
    cashTot:cashTot,instaTot:instaTot,fundBal:fund-unre,unre:unre,pOwed:pOwed,check:check};
}
function carById(id){return calc().cars.find(function(c){return c.id===id})}

function dayCalc(d){
  var T=calc();
  var buys=T.cars.filter(function(c){return c.buyDate===d});
  var exps=S.expenses.filter(function(e){return e.date===d});
  var cols=S.cols.filter(function(c){return c.date===d});
  var sales=T.cars.filter(function(c){return c.sold&&c.sellDate===d});
  var caps=S.cap.filter(function(x){return x.date===d});
  var pays=S.pay.filter(function(x){return x.date===d});
  var trs=S.transfers.filter(function(x){return x.date===d});
  var lds=S.ledger.filter(function(x){return x.date===d&&x.kind!=="spay"}),sps=S.ledger.filter(function(x){return x.date===d&&x.kind==="spay"});
  var buyT=0,expT=0,cashT=0,instaT=0,profT=0,wdT=0,pInT=0,pOutT=0,buyPd=0,spT=0;
  buys.forEach(function(c){buyT+=+c.buyPrice||0;buyPd+=paidNow(c);pInT+=c.pTotal});
  exps.forEach(function(e){expT+=+e.amount||0});
  cols.forEach(function(c){cashT+=+c.cash||0;instaT+=+c.insta||0});
  sales.forEach(function(c){profT+=c.myProfit});
  caps.forEach(function(x){if(x.kind==="withdraw"||x.kind==="pwithdraw")wdT+=+x.amount||0});
  pays.forEach(function(x){pOutT+=+x.amount||0});
  var lmx=lmapOf(),ldT=0;lds.forEach(function(x){ldT+=lsigned(x,lmx)});sps.forEach(function(x){spT+=+x.amount||0});
  return {buys:buys,exps:exps,cols:cols,sales:sales,caps:caps,pays:pays,trs:trs,lds:lds,sps:sps,spT:spT,buyPd:buyPd,acct:flowsOf(T.cars,d),
    buyT:buyT,expT:expT,cashT:cashT,instaT:instaT,profT:profT,wdT:wdT,pInT:pInT,pOutT:pOutT,
    net:cashT+instaT+pInT-buyPd-spT-expT-wdT-pOutT+ldT};
}

/* ---------- accounts / capital helpers ---------- */
function sgn(n){return n<0?"bad":(n>0?"good":"")}
function lossCars(){return calc().cars.filter(function(c){return c.lossActive&&c.lossRem>0.5})}
function capOut(k){return k==="withdraw"||k==="pwithdraw"}
function capLabel(x){
  if(x.kind==="withdraw")return "👤 سحب من رأس المال";
  if(x.kind==="pwithdraw")return "💵 سحب أرباح";
  if(x.kind==="lossrepay"){var cr=S.cars.find(function(c){return c.id===x.carId});return "📉 سداد خسارة "+esc(cr?cr.name:"عربية")}
  return "🏦 سداد عجز السحب";
}
function srcNote(x){return x&&x.src==="insta"?"من إنستاباي":""}
function dline(){var a=[],i;for(i=0;i<arguments.length;i++)if(arguments[i])a.push(arguments[i]);return a.join(" · ")}
function srcSel(n,sel){
  var T=calc();
  return '<select name="'+n+'"><option value="cash"'+(sel==="insta"?"":" selected")+'>الخزنة - كاش (رصيدها '+fmt(T.safeBal)+')</option><option value="insta"'+(sel==="insta"?" selected":"")+'>إنستاباي (رصيده '+fmt(T.instaBal)+')</option></select>';
}
function srcVal(){return val("src")==="insta"?"insta":"cash"}

/* ---------- db writes ---------- */
async function create(coll,data){
  try{var ref=db.collection(coll).doc();await ref.set(Object.assign({},data,{createdAt:Date.now()}));return ref.id}
  catch(e){toast("تعذر الحفظ، جرّب تاني");return null}
}
async function patch(path,data){try{await db.doc(path).update(data);return true}catch(e){toast("تعذر الحفظ، جرّب تاني");return false}}
async function removeDoc(path){try{await db.doc(path).delete();return true}catch(e){toast("تعذر الحذف");return false}}

/* ---------- rendering ---------- */
function tile(l,v,s,cls){return '<div class="tile"><div class="tl">'+l+'</div><div class="tv '+(cls||"")+'">'+v+'</div>'+(s?'<div class="ts">'+s+'</div>':"")+'</div>'}
function statusBadge(c){
  if(!c.sold)return '<span class="badge b-stock">في المعرض</span>';
  if(c.remaining>0)return '<span class="badge b-debt">باقي فلوس</span>';
  return '<span class="badge b-paid">اتباعت</span>';
}
function carCard(c){
  var line=c.sold?('ربحك <b class="'+(c.myProfit>=0?"good":"bad")+'">'+m(c.myProfit)+'</b>'):('اشتريت '+fdate(c.buyDate));
  return '<div class="card car" data-act="car" data-id="'+c.id+'"><div class="row"><span class="name">'+esc(c.name)+(c.parts.length?'<span class="ptag">🤝 شراكة</span>':'')+(c.lossActive?'<span class="ptag">📉 خسارة على مراحل</span>':'')+(c.sellerRem>0.5?'<span class="ptag">⏳ باقي للبايع '+fmt(c.sellerRem)+'</span>':'')+'</span>'+statusBadge(c)+'</div>'+
    '<div class="row sub" style="margin-top:6px"><span>التكلفة '+m(c.cost)+'</span><span>'+line+'</span></div></div>';
}

function filteredCars(){
  var T=calc(),q=S.q.trim().toLowerCase();
  return T.cars.filter(function(c){
    if(S.filter==="stock"&&c.sold)return false;
    if(S.filter==="sold"&&!c.sold)return false;
    if(S.filter==="debt"&&!(c.sold&&c.remaining>0))return false;
    if(S.filter==="partner"&&!c.parts.length)return false;
    if(q&&c.name.toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function carListHtml(){
  var l=filteredCars();
  if(!l.length)return '<div class="empty">'+(S.cars.length?"مفيش عربيات بالشكل ده":"لسه مسجلتش أي عربية.<br>دوس على «شراء عربية» وابدأ.")+'</div>';
  return l.map(carCard).join("");
}

    '<div class="sect">حركة اليوم</div><div class="card" style="padding:6px 16px">'+list+'</div>';

function capSplit(T){
  var cap=T.capNow,fund=Math.min(Math.max(T.fund,0),Math.max(cap,0)),rest=cap-fund,pf=cap>0?Math.round(fund/cap*100):0;
  return '<div class="card"><div class="sect" style="margin-top:0">توزيع رأس المال</div>'+
    '<div class="kv"><span>رأس المال الحالي</span><b>'+m(cap)+'</b></div>'+
    '<div style="display:flex;height:10px;border-radius:6px;overflow:hidden;margin:8px 0 10px;background:var(--line)"><div style="width:'+(100-pf)+'%;background:var(--primary)"></div><div style="width:'+pf+'%;background:var(--silver)"></div></div>'+
    '<div class="kv"><span>🚗 للشغل (شراء عربيات)</span><b>'+m(rest,rest<0?"bad":"")+'</b></div>'+
    '<div class="kv"><span>🧾 منه عهدة للمصاريف</span><b>'+m(fund)+'</b></div>'+
    '<div class="kv" style="padding-right:14px"><span class="sub">· اتصرف منها ولسه ما اترديش</span><b>'+m(T.unre)+'</b></div>'+
    '<div class="kv" style="padding-right:14px"><span class="sub">· الباقي في العهدة</span><b>'+m(T.fundBal,T.fundBal<0?"bad":"")+'</b></div>'+
    '<div class="sub" style="margin-top:8px">العهدة جزء من رأس المال مش خصم منه — الفلوس لسه بتاعتك، بس متخصصة للمصاريف.</div></div>';
}
function renderCap(){

  var items=list.length?list.map(function(x){
    var out=capOut(x.kind),dd=dline(srcNote(x),esc(x.note||""));
    return '<div class="item"><div style="flex:1"><div class="t">'+capLabel(x)+'</div><div class="d">'+fdate(x.date)+(dd?" · "+dd:"")+'</div></div><span class="num '+(out?"bad":"good")+'" style="font-weight:700">'+fmt(x.amount)+'</span><button class="del" data-act="delitem" data-coll="capital" data-id="'+x.id+'" aria-label="حذف">🗑</button></div>';

    return '<div class="item car" data-act="car" data-id="'+c.id+'" style="cursor:pointer"><div style="flex:1"><div class="t">'+esc(c.name)+'</div><div class="d">الخسارة '+fmt(c.lossAmt)+' · اتسدد '+fmt(c.lossPaid)+'</div></div><span class="num '+(c.lossRem>0.5?"warn":"good")+'" style="font-weight:700">'+fmt(Math.max(c.lossRem,0))+'</span></div>';

    capSplit(T)+
    '<div class="grid2">'+tile("سحب من رأس المال",m(T.withdraw),"سددت منه "+m(T.repay))+tile("خسائر عربيات متبقية",m(T.lossRem,T.lossRem>0.5?"warn":""),"اتسدد "+m(T.lossPaid)+" من "+m(T.lossDef))+'</div>'+
    '<div class="grid2">'+tile("أرباح متاحة (حصتك بس)",m(T.undist),"للسحب أو لسداد العجز")+tile("أرباح اتسحبت",m(T.pw),"")+'</div>'+
    '<div class="actions">'+

/* ---------- loans / ledger ---------- */
function lmapOf(){var m={};S.ledger.forEach(function(x){if(x.kind==="loan")m[x.id]=x});return m}
function lsigned(x,lm){
  var a=+x.amount||0;
  if(x.kind==="loan")return x.dir==="out"?-a:a;
  if(x.kind==="pay"&&lm[x.loanId])return lm[x.loanId].dir==="out"?a:-a;
  return 0;
}
function loansCalc(){
  var m={},list=[];
  S.ledger.forEach(function(x){if(x.kind==="loan"){m[x.id]={id:x.id,person:x.person||"",dir:x.dir,amount:+x.amount||0,date:x.date,src:x.src,note:x.note||"",createdAt:x.createdAt||0,paid:0,pays:[]};list.push(m[x.id])}});
  S.ledger.forEach(function(x){if(x.kind==="pay"&&m[x.loanId]){m[x.loanId].paid+=+x.amount||0;m[x.loanId].pays.push(x)}});
  list.forEach(function(l){l.remaining=l.amount-l.paid;l.pays.sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0)})});
  return list.sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||b.createdAt-a.createdAt});
}
function loanRow(l){
  var out=l.dir==="out",open=l.remaining>0.5;
  return '<div class="item car" data-act="loan" data-id="'+l.id+'" style="cursor:pointer"><div style="flex:1"><div class="t">'+esc(l.person||"بدون اسم")+'</div><div class="d">'+(out?"سلفته ":"استلمت منه ")+fmt(l.amount)+' · '+fdate(l.date)+(l.paid>0?' · '+(out?"رجّع ":"سددت ")+fmt(l.paid):'')+'</div></div><span class="num '+(open?(out?"warn":"bad"):"good")+'" style="font-weight:700">'+(open?fmt(l.remaining):'✔')+'</span></div>';
}
function sellerBox(){
  var a=calc().cars.filter(function(c){return c.sellerRem>0.5});if(!a.length)return "";
  return '<div class="sect">عليك لبايعي العربيات</div><div class="card" style="padding:6px 16px">'+a.map(function(c){
    return '<div class="item car" data-act="car" data-id="'+c.id+'" style="cursor:pointer"><div style="flex:1"><div class="t">'+esc(c.name)+'</div><div class="d">السعر '+fmt(c.buyPrice)+' · اتدفع '+fmt(paidNow(c)+c.sellerPaid)+' · '+fdate(c.buyDate)+'</div></div><span class="num bad" style="font-weight:700">'+fmt(c.sellerRem)+'</span></div>'}).join("")+'</div>';
}
function renderLed(){
  var T=calc(),L=loansCalc();
  var oo=L.filter(function(l){return l.dir==="out"&&l.remaining>0.5}),oi=L.filter(function(l){return l.dir==="in"&&l.remaining>0.5}),dn=L.filter(function(l){return l.remaining<=0.5});
  function box(t,a){return a.length?'<div class="sect">'+t+'</div><div class="card" style="padding:6px 16px">'+a.map(loanRow).join("")+'</div>':""}
  return '<div class="top"><h1>سلف وأمانات</h1></div>'+
    '<div class="hero"><div class="l">ليك عند الناس</div><div class="v">'+m(T.recv)+'</div><div class="s">عليك للناس: '+m(T.owe)+'</div></div>'+
    '<div class="actions"><button class="abtn" data-act="form" data-kind="loan" data-sub="out"><span class="ic">➖</span>إدّيت فلوس لحد</button><button class="abtn" data-act="form" data-kind="loan" data-sub="in"><span class="ic">➕</span>استلمت فلوس من حد</button></div>'+
    ((L.length||T.sOwe>0.5)?"":'<div class="empty">لسه مفيش سلف.<br>مثال: حد سحب ١٠٠ ألف من الخزنة وهيرجعها، سجّلها هنا والفلوس هتتخصم من الخزنة وتتحسب «ليك عند الناس» لحد ما يرجّعها.</div>')+
    box("ليك عندهم",oo)+box("عليك ليهم",oi)+sellerBox()+box("اتسددت",dn);
}

  }).join("")+'</div>';
  h+='<button class="btn danger" style="margin-top:10px" data-act="delloan" data-id="'+l.id+'">حذف السلفة</button>';
  var prev=$("#sheet").scrollTop;

}

function refresh(){

  if(act&&(act.id==="q")){renderListOnly();return}
  render();

  if(modal&&modal.type==="loan")renderLoan();

function renderListOnly(){var l=$("#carList");if(l)l.innerHTML=carListHtml();if(modal&&modal.type==="detail")renderDetail()}

/* ---------- sheets ---------- */
function openSheet(html){$("#sheet").innerHTML=html;$("#ov").classList.add("show");$("#sheet").scrollTop=0}
function closeSheet(){$("#ov").classList.remove("show");modal=null}
function done(o){closeSheet();if(o&&o.carId&&carById(o.carId))openDetail(o.carId)}
function sheetHead(t){return '<div class="sh"><h2>'+t+'</h2><button class="x" data-act="close" aria-label="إغلاق">✕</button></div>'}
function confirmBox(msg,yes){
  confirmBox.fn=yes;
  $("#sheetc").innerHTML='<div class="sh"><h2>تأكيد</h2></div><div style="margin-bottom:16px">'+msg+'</div><div class="two"><button class="btn danger" data-act="cyes">أيوه، متأكد</button><button class="btn sec" data-act="cno">لأ</button></div>';
  $("#ovc").classList.add("show");
}
function closeConfirm(){$("#ovc").classList.remove("show");confirmBox.fn=null}

function val(n){var el=$("#sheet [name='"+n+"']");return el?el.value:""}
function fld(l,inner){return '<label class="fld"><span>'+l+'</span>'+inner+'</label>'}
function minp(n,v,ph){return '<input name="'+n+'" inputmode="decimal" autocomplete="off" placeholder="'+(ph||"0")+'" value="'+(v==null?"":esc(v))+'">'}
function dinp(n,v){return '<input type="date" name="'+n+'" value="'+(v||todayStr())+'">'}
function carSel(n,cars,sel){
  return '<select name="'+n+'">'+cars.map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?" selected":"")+'>'+esc(c.name)+(c.sold?" (اتباعت)":"")+'</option>'}).join("")+'</select>';
}
function stockFirst(T){return T.cars.filter(function(c){return !c.sold}).concat(T.cars.filter(function(c){return c.sold}))}

/* partners editor */
function partnerRow(p){
  return '<div class="prow" data-pid="'+esc(p&&p.id||"")+'"><input class="pn" placeholder="اسم الشريك" autocomplete="off" value="'+esc(p?p.name:"")+'"><input class="pa" inputmode="decimal" autocomplete="off" placeholder="المبلغ اللي دفعه" value="'+(p?esc(p.amount):"")+'"><button class="del" data-act="rmp" aria-label="حذف الشريك">✕</button><input class="pp" inputmode="decimal" autocomplete="off" placeholder="نسبته من الربح % (فاضي = حسب المبلغ)" value="'+(p&&p.pct!=null?esc(p.pct):"")+'"></div>';
}
function partnersBox(list){
  return '<div class="fld"><span>الشركاء في العربية (اختياري)</span><div id="plist">'+(list||[]).map(partnerRow).join("")+'</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px"><button class="btn sec small" data-act="addp">+ إضافة شريك</button><button class="btn sec small" data-act="eqp">⚖️ قسّم الربح بالتساوي</button></div><div class="sub" style="margin-top:8px">حدد نسبة كل شريك من الربح زي ما اتفقتوا. النسبة اللي مش مكتوبة بتتحسب حسب المبلغ اللي دفعه، والباقي من ١٠٠٪ ليك.</div></div><div class="preview" id="pv"></div>';
}
function readPartners(){
  var rows=document.querySelectorAll("#sheet .prow"),out=[],bad=null;
  rows.forEach(function(r,i){
    var n=r.querySelector(".pn").value.trim(),a=parseNum(r.querySelector(".pa").value),pt=r.querySelector(".pp").value.trim();
    if(!n&&!a&&!pt)return;
    if(!n||a<=0){bad="اكتب اسم الشريك والمبلغ اللي دفعه";return}
    var o2={id:r.dataset.pid||("p"+Date.now().toString(36)+i),name:n,amount:a};
    if(pt!==""){var pv2=parseNum(pt);if(pv2<0||pv2>100){bad="نسبة الربح لازم تكون من ٠ لـ ١٠٠";return}o2.pct=pv2}
    out.push(o2);
  });
  return bad?{error:bad}:{list:out};
}

function shareSum(list,price){return list.reduce(function(t,p){return t+(p.pct!=null?p.pct/100:(price>0?p.amount/price:0))},0)}
function openForm(kind,o){
  o=o||{};var T=calc(),h="",prevModal=modal;
  modal={type:"form",kind:kind,o:o};
  if(kind==="buy"){
    h=sheetHead("شراء عربية")+fld("اسم العربية / الموديل / اللوحة",'<input name="name" autocomplete="off" placeholder="مثال: كورولا 2018 - أ ب ج 1234">')+
      '<div class="two">'+fld("سعر الشراء (الإجمالي)",minp("price"))+fld("تاريخ الشراء",dinp("date"))+'</div>'+
      fld("اتدفع دلوقتي للبايع (سيبه فاضي لو دفعت الكل)",minp("paid","","اتدفع كله"))+fld("اتدفعت من",srcSel("src"))+partnersBox([])+'<button class="btn" data-act="submit">حفظ</button>';
  }else if(kind==="edit"){
    var c=carById(o.id);if(!c)return;
    h=sheetHead("تعديل العربية")+fld("الاسم",'<input name="name" value="'+esc(c.name)+'">')+
      '<div class="two">'+fld("سعر الشراء",minp("price",c.buyPrice))+fld("تاريخ الشراء",dinp("date",c.buyDate))+'</div>'+
      fld("اتدفع دلوقتي للبايع (سيبه فاضي لو دفعت الكل)",minp("paid",(typeof c.buyPaid==="number"&&c.buyPaid<c.buyPrice)?c.buyPaid:"","اتدفع كله"))+fld("اتدفعت من",srcSel("src",c.buySrc))+
      (c.sold?'<div class="two">'+fld("سعر البيع",minp("sprice",c.sellPrice))+fld("تاريخ البيع",dinp("sdate",c.sellDate))+'</div>':"")+

function updatePreview(){
  var pv=$("#pv");if(!pv||!modal||modal.type!=="form")return;
  var k=modal.kind;
  if(k==="sellerpay"){
    var Ts=calc(),sa=parseNum(val("amount")),sc2=carById(val("carId")),si=val("src")==="insta";
    var sf2=Ts.safeBal+(si?0:-sa),ib2=Ts.instaBal+(si?-sa:0);
    pv.innerHTML='باقي للبايع بعد السداد: <b>'+m(Math.max((sc2?sc2.sellerRem:0)-sa,0))+'</b><br>بعد العملية: الخزنة <b class="'+(sf2<0?"bad":"")+'">'+m(sf2)+'</b> · إنستاباي <b class="'+(ib2<0?"bad":"")+'">'+m(ib2)+'</b>';
    return;
  }
  if(k==="loan"||k==="loanpay"){
    var Tp=calc(),pa0=parseNum(val("amount")),sg0;
    if(k==="loan")sg0=val("dir")==="in"?pa0:-pa0;
    else{var lq0=loansCalc().find(function(x){return x.id===val("loanId")});sg0=lq0&&lq0.dir==="out"?pa0:-pa0}
    var ins0=val("src")==="insta";
    var sf=Tp.safeBal+(ins0?0:sg0),ib=Tp.instaBal+(ins0?sg0:0);
    pv.innerHTML='بعد العملية: الخزنة <b class="'+(sf<0?"bad":"")+'">'+m(sf)+'</b> · إنستاباي <b class="'+(ib<0?"bad":"")+'">'+m(ib)+'</b>';
    return;
  }
  if(k==="transfer"){
    var T0=calc(),ta=parseNum(val("amount")),toSafe=val("dir")!=="toInsta";
    var s0=T0.safeBal+(toSafe?ta:-ta),i0=T0.instaBal+(toSafe?-ta:ta);
    pv.innerHTML='بعد التحويل: الخزنة <b class="'+(s0<0?"bad":"")+'">'+m(s0)+'</b> · إنستاباي <b class="'+(i0<0?"bad":"")+'">'+m(i0)+'</b>';
    return;
  }
  if(k==="buy"||k==="edit"){
    var price=parseNum(val("price")),sum=0,n=0,ssum=0,pd0=val("paid").trim(),stxt="";
    if(pd0!==""){var pdn=parseNum(pd0);stxt=pdn>price?'<b class="bad">المدفوع أكبر من سعر الشراء</b>':'هتدفع دلوقتي: <b>'+m(pdn)+'</b> · باقي للبايع: <b class="warn">'+m(price-pdn)+'</b>'}
    document.querySelectorAll("#sheet .prow").forEach(function(r){
      var a=parseNum(r.querySelector(".pa").value),ptx=r.querySelector(".pp").value.trim();
      if(a>0){sum+=a;n++;ssum+=ptx!==""?parseNum(ptx)/100:(price>0?a/price:0)}
    });
    if(!n){pv.innerHTML=stxt;return}
    var mine=price-sum;
    pv.innerHTML=mine<0?'<b class="bad">مبالغ الشركاء أكبر من سعر الشراء</b>':ssum>1.0001?'<b class="bad">نسب الأرباح أكتر من ١٠٠٪</b>':
      'رأس مالك: <b>'+m(mine)+'</b> · رأس مال الشركاء: '+m(sum)+'<br>نسبة ربحك: <b>'+pct(1-ssum)+'</b> · نسبة الشركاء: '+pct(ssum);
    if(stxt)pv.innerHTML+='<br>'+stxt;
    return;
  }
  var c=carById(val("carId"));if(!c)return;
  var cash=parseNum(val("cash")),ins=parseNum(val("insta"));
  if(k==="sell"){
    var p=parseNum(val("price")),rest=p-cash-ins,profit=p-c.cost;
    var t='تكلفة العربية: '+m(c.cost)+'<br>صافي الربح: <b class="'+(profit>=0?"good":"bad")+'">'+m(profit)+'</b>';
    if(c.parts.length)t+='<br>ربحك (نسبة '+pct(c.ownerShare)+'): <b class="'+(profit>=0?"good":"bad")+'">'+m(profit*c.ownerShare)+'</b>';
    pv.innerHTML=t+'<br>باقي على العميل: <b>'+m(rest>0?rest:0)+'</b>';
  }else if(k==="collect"){
    var after=(c.remaining||0)-cash-ins;
    pv.innerHTML='باقي على العميل دلوقتي: '+m(c.remaining||0)+'<br>بعد التحصيل: <b>'+m(after>0?after:0)+'</b>';
  }
}

var submitting=false;
async function submitForm(){
  if(!modal||modal.type!=="form"||submitting)return;
  var k=modal.kind,o=modal.o;submitting=true;
  try{
    if(k==="buy"){
      var name=val("name").trim(),price=parseNum(val("price"));
      if(!name)return toast("اكتب اسم العربية");if(price<=0)return toast("اكتب سعر الشراء");
      var rp=readPartners();if(rp.error)return toast(rp.error);
      var tot=rp.list.reduce(function(a,p){return a+p.amount},0);
      if(tot>price)return toast("مبالغ الشركاء أكبر من سعر الشراء");if(shareSum(rp.list,price)>1.0001)return toast("نسب الأرباح أكتر من ١٠٠٪");
      var pdS=val("paid").trim(),bp=null;
      if(pdS!==""){bp=parseNum(pdS);if(bp<0||bp>price)return toast("المدفوع لازم يكون من ٠ لحد سعر الشراء");if(bp>=price)bp=null}
      if(await create("cars",{name:name,buyPrice:price,buyPaid:bp,buyDate:val("date")||todayStr(),buySrc:srcVal(),reimbursed:false,partners:rp.list})){closeSheet();toast("اتسجلت العربية ✔")}
    }else if(k==="edit"){
      var nm=val("name").trim(),pr=parseNum(val("price"));
      if(!nm||pr<=0)return toast("راجع الاسم وسعر الشراء");
      var rp2=readPartners();if(rp2.error)return toast(rp2.error);
      var tot2=rp2.list.reduce(function(a,p){return a+p.amount},0);
      if(tot2>pr)return toast("مبالغ الشركاء أكبر من سعر الشراء");if(shareSum(rp2.list,pr)>1.0001)return toast("نسب الأرباح أكتر من ١٠٠٪");
      var pdE=val("paid").trim(),bpe=null;
      if(pdE!==""){bpe=parseNum(pdE);if(bpe<0||bpe>pr)return toast("المدفوع لازم يكون من ٠ لحد سعر الشراء");if(bpe>=pr)bpe=null}
      var ecar=carById(o.id),owedN=bpe==null?0:pr-bpe;
      if(ecar&&owedN<ecar.sellerPaid-0.5)return toast("اتسجّل سداد للبايع أكتر من الباقي الجديد، امسح السدادات الأول");
      var d={name:nm,buyPrice:pr,buyPaid:bpe,buyDate:val("date"),buySrc:srcVal(),partners:rp2.list};
      if($("#sheet [name='sprice']")){var sp=parseNum(val("sprice"));if(sp<=0)return toast("راجع سعر البيع");d.sellPrice=sp;d.sellDate=val("sdate")}
      if(await patch("cars/"+o.id,d)){done(o);toast("اتعدّلت ✔")}
    }else if(k==="expense"){
      var a=parseNum(val("amount"));if(a<=0)return toast("اكتب المبلغ");
      if(await create("expenses",{carId:val("carId"),amount:a,date:val("date")||todayStr(),type:val("type"),src:srcVal(),note:val("note").trim()})){done(o);toast("اتسجّل المصروف ✔")}
    }else if(k==="sell"){
      var sp2=parseNum(val("price")),cash=parseNum(val("cash")),ins=parseNum(val("insta")),cid=val("carId"),dt=val("date")||todayStr();
      if(sp2<=0)return toast("اكتب سعر البيع");
      if(cash+ins>sp2)return toast("المحصّل أكبر من سعر البيع");
      var ok=await patch("cars/"+cid,{sellPrice:sp2,sellDate:dt});
      if(ok&&(cash>0||ins>0))ok=!!(await create("collections",{carId:cid,date:dt,cash:cash,insta:ins,note:"عند البيع"}));
      if(ok){done(o);toast("اتباعت ✔")}
    }else if(k==="collect"){
      var c1=parseNum(val("cash")),i1=parseNum(val("insta"));
      if(c1+i1<=0)return toast("اكتب المبلغ المحصّل");
      if(await create("collections",{carId:val("carId"),date:val("date")||todayStr(),cash:c1,insta:i1,note:val("note").trim()})){done(o);toast("اتسجّل التحصيل ✔")}
    }else if(k==="payout"){
      var pa=parseNum(val("amount"));if(pa<=0)return toast("اكتب المبلغ");
      if(await create("payouts",{carId:val("carId"),pid:val("pid"),amount:pa,date:val("date")||todayStr(),src:srcVal(),note:val("note").trim()})){done(o);toast("اتسجّل التسليم ✔")}
    }else if(k==="capital"){
      var am=parseNum(val("amount")),ck=val("kind"),T2=calc();
      if(am<=0)return toast("اكتب المبلغ");
      var rec={kind:ck,amount:am,date:val("date")||todayStr(),note:val("note").trim()};
      if(ck==="withdraw"||ck==="pwithdraw")rec.src=srcVal();
      if(ck==="pwithdraw"&&am>T2.undist+0.5)return toast("المبلغ أكبر من الأرباح المتاحة ("+fmt(T2.undist)+"). للسحب من رأس المال اختار «سحب من رأس المال»");
      if(ck==="repay"&&am>T2.wDef+0.5)return toast("السداد أكبر من عجز السحب ("+fmt(T2.wDef)+")");
      if(ck==="lossrepay"){
        var lcar=carById(val("carId"));
        if(!lcar||!lcar.lossActive)return toast("اختار عربية عليها خسارة");
        if(am>lcar.lossRem+0.5)return toast("المبلغ أكبر من المتبقي من الخسارة ("+fmt(lcar.lossRem)+")");
        if(am>T2.undist+0.5)return toast("المبلغ أكبر من الأرباح المتاحة ("+fmt(T2.undist)+")");
        rec.carId=lcar.id;
      }
      if(await create("capital",rec)){
        if(ck==="lossrepay"&&o.carId)done({carId:rec.carId});else closeSheet();
        toast("اتسجّل ✔");
      }
    }else if(k==="transfer"){
      var ta=parseNum(val("amount"));if(ta<=0)return toast("اكتب المبلغ");
      if(await create("transfers",{dir:val("dir")==="toInsta"?"toInsta":"toSafe",amount:ta,date:val("date")||todayStr(),note:val("note").trim()})){closeSheet();toast("اتسجّل التحويل ✔")}
    }else if(k==="loan"){
      var lpn=val("person").trim(),lam=parseNum(val("amount"));
      if(!lpn)return toast("اكتب اسم الشخص");
      if(lam<=0)return toast("اكتب المبلغ");
      var lnid=await create("ledger",{kind:"loan",person:lpn,dir:val("dir")==="in"?"in":"out",amount:lam,date:val("date")||todayStr(),src:srcVal(),note:val("note").trim()});
      if(lnid){closeSheet();toast("اتسجّلت ✔")}
    }else if(k==="loanpay"){
      var lid=val("loanId"),pa2=parseNum(val("amount")),ln2=loansCalc().find(function(x){return x.id===lid});
      if(!ln2)return toast("السلفة مش موجودة");
      if(pa2<=0)return toast("اكتب المبلغ");
      if(pa2>ln2.remaining+0.5)return toast("المبلغ أكبر من المتبقي ("+fmt(ln2.remaining)+")");
      if(await create("ledger",{kind:"pay",loanId:lid,amount:pa2,date:val("date")||todayStr(),src:srcVal(),note:val("note").trim()})){closeSheet();openLoan(lid);toast("اتسجّلت الدفعة ✔")}
    }else if(k==="sellerpay"){
      var spc=carById(val("carId")),spa=parseNum(val("amount"));
      if(!spc)return toast("العربية مش موجودة");
      if(spa<=0)return toast("اكتب المبلغ");
      if(spa>spc.sellerRem+0.5)return toast("المبلغ أكبر من المتبقي للبايع ("+fmt(spc.sellerRem)+")");
      if(await create("ledger",{kind:"spay",carId:spc.id,amount:spa,date:val("date")||todayStr(),src:srcVal(),note:val("note").trim()})){done(o);toast("اتسجّل السداد ✔")}
    }else if(k==="settings"){
      try{await db.doc("settings/main").set({capital:parseNum(val("capital")),fund:parseNum(val("fund"))});closeSheet();toast("اتحفظت ✔")}
      catch(e){toast("تعذر الحفظ، جرّب تاني")}
    }
  }finally{submitting=false}
}

function renderDetail(){
  var c=carById(modal.carId);if(!c){closeSheet();return}
  var exps=S.expenses.filter(function(e){return e.carId===c.id}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0)});
  var cols=S.cols.filter(function(x){return x.carId===c.id}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"")});
  var pays=S.pay.filter(function(x){return x.carId===c.id}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"")});
  var hasP=c.parts.length>0;
  var h=sheetHead(esc(c.name))+'<div style="margin:-4px 0 10px">'+statusBadge(c)+(hasP?'<span class="ptag">🤝 شراكة</span>':'')+'</div>';
  h+='<div class="card"><div class="kv"><span>تاريخ الشراء</span><b>'+fdate(c.buyDate)+'</b></div><div class="kv"><span>سعر الشراء</span><b>'+m(c.buyPrice)+'</b></div>'+
     (c.owedSeller>0.5?'<div class="kv"><span>اتدفع للبايع</span><b>'+m(paidNow(c)+c.sellerPaid)+'</b></div><div class="kv"><span>باقي للبايع</span><b class="'+(c.sellerRem>0.5?"warn":"good")+'">'+(c.sellerRem>0.5?m(c.sellerRem):"اتسدد بالكامل ✔")+'</b></div>':'')+'<div class="kv"><span>المصاريف</span><b>'+m(c.exp)+'</b></div><div class="kv"><span>التكلفة الإجمالية</span><b>'+m(c.cost)+'</b></div>';
  if(c.sold){
    h+='<div class="kv"><span>تاريخ البيع</span><b>'+fdate(c.sellDate)+'</b></div><div class="kv"><span>سعر البيع</span><b>'+m(c.sellPrice)+'</b></div>'+
       '<div class="kv"><span>محصّل كاش</span><b>'+m(c.cashIn)+'</b></div><div class="kv"><span>محصّل إنستاباي</span><b>'+m(c.instaIn)+'</b></div>'+
       '<div class="kv"><span>باقي على العميل</span><b class="'+(c.remaining>0?"warn":"")+'">'+m(c.remaining>0?c.remaining:0)+'</b></div>'+
       '<div class="kv"><span>'+(hasP?"صافي الربح (بعد المصاريف)":"الربح")+'</span><b class="'+(c.profit>=0?"good":"bad")+'">'+m(c.profit)+'</b></div>';
    if(hasP)h+='<div class="kv"><span>ربحك</span><b class="'+(c.myProfit>=0?"good":"bad")+'">'+m(c.myProfit)+'</b></div>';
  }
  h+='</div>';
  if(c.sold&&c.myProfit<0){
    var lp=S.cap.filter(function(x){return x.kind==="lossrepay"&&x.carId===c.id}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"")});
    h+='<div class="sect">الخسارة 📉</div><div class="card">';
    if(!c.lossDeferred){
      h+='<div class="sub" style="margin-bottom:10px">خسارتك في العربية دي <b class="bad">'+m(-c.myProfit)+'</b> وبتتخصم من أرباحك على طول. لو عايز تسددها من أرباح عربيات تانية على مراحل، فعّل السداد على مراحل.</div>'+
         '<button class="btn sec" data-act="lossdef" data-id="'+c.id+'" data-on="1">سداد الخسارة على مراحل</button>';
    }else{
      h+='<div class="kv"><span>خسارتك</span><b class="bad">'+m(c.lossAmt)+'</b></div><div class="kv"><span>اتسدد من الأرباح</span><b>'+m(c.lossPaid)+'</b></div><div class="kv"><span>المتبقي</span><b class="'+(c.lossRem>0.5?"warn":"good")+'">'+m(Math.max(c.lossRem,0))+'</b></div>'+
         '<div class="two" style="margin-top:10px"><button class="btn" data-act="form" data-kind="capital" data-sub="lossrepay" data-car="'+c.id+'">+ سداد دفعة</button><button class="btn sec" data-act="lossdef" data-id="'+c.id+'" data-on="0">إلغاء السداد على مراحل</button></div>';
      if(lp.length)h+=lp.map(function(x){return '<div class="item"><div style="flex:1"><div class="t">دفعة سداد</div><div class="d">'+fdate(x.date)+(x.note?" · "+esc(x.note):"")+'</div></div><span class="num good" style="font-weight:700">'+fmt(x.amount)+'</span><button class="del" data-act="delitem" data-coll="capital" data-id="'+x.id+'" aria-label="حذف">🗑</button></div>'}).join("");
    }
    h+='</div>';
  }
  if(hasP){
    h+='<div class="sect">الشراكة 🤝</div><div class="card"><div class="kv"><span>رأس مالك</span><b>'+m(c.ownerCap)+'</b></div><div class="kv"><span>نسبة ربحك</span><b>'+pct(c.ownerShare)+'</b></div>';
    if(c.sold)h+='<div class="kv"><span>اللي ليك عند البيع</span><b>'+m(c.ownerCap+c.exp+c.myProfit)+'</b></div><div class="sub">رأس مالك + المصاريف اللي دفعتها + ربحك</div>';
    c.parts.forEach(function(p){
      h+='<div class="pcard"><div class="row"><b>'+esc(p.name)+'</b><span class="sub">دفع '+m(p.amount)+' · نسبته من الربح '+pct(p.share)+'</span></div>';
      if(c.sold){
        h+='<div class="kv"><span>ربحه</span><b class="'+(p.profit>=0?"good":"bad")+'">'+m(p.profit)+'</b></div>'+
           '<div class="kv"><span>المستحق له</span><b>'+m(p.due)+'</b></div>'+
           '<div class="kv"><span>اتسلّم</span><b>'+m(p.paid)+'</b></div>'+
           '<div class="kv"><span>المتبقي</span><b class="'+(p.remaining>0?"warn":"")+'">'+m(p.remaining)+'</b></div>';
      }else{
        h+='<div class="sub" style="padding:6px 0">هيتحسب ربحه لما العربية تتباع.</div>';
      }
      h+='<div style="padding:6px 0 8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec small" data-act="form" data-kind="payout" data-car="'+c.id+'" data-pid="'+esc(p.id)+'">تسليم فلوس لـ'+esc(p.name)+'</button><button class="btn sec small" data-act="report" data-kind="partner" data-name="'+esc(p.name)+'" data-car="'+c.id+'">📄 تقرير للشريك</button></div></div>';
    });
    h+='</div>';
  }
  if(c.owedSeller>0.5){
    if(c.sellerRem>0.5)h+='<button class="btn" style="margin-bottom:10px" data-act="form" data-kind="sellerpay" data-car="'+c.id+'">💳 سداد للبايع (باقي '+fmt(c.sellerRem)+')</button>';
    var sps2=S.ledger.filter(function(x){return x.kind==="spay"&&x.carId===c.id}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"")});
    if(sps2.length)h+='<div class="sect">المدفوع للبايع</div><div class="card" style="padding:6px 16px">'+sps2.map(function(x){
      return '<div class="item"><div style="flex:1"><div class="t">دفعة للبايع</div><div class="d">'+fdate(x.date)+(dline(srcNote(x),esc(x.note||""))?" · "+dline(srcNote(x),esc(x.note||"")):"")+'</div></div><span class="num" style="font-weight:700">'+fmt(x.amount)+'</span><button class="del" data-act="delitem" data-coll="ledger" data-id="'+x.id+'" aria-label="حذف">🗑</button></div>'}).join("")+'</div>';
  }
  h+='<div class="two" style="margin-bottom:10px"><button class="btn sec" data-act="form" data-kind="expense" data-car="'+c.id+'">+ مصروف</button>'+
     (c.sold?'<button class="btn sec" data-act="form" data-kind="collect" data-car="'+c.id+'">+ تحصيل</button>':'<button class="btn" data-act="form" data-kind="sell" data-car="'+c.id+'">بيع العربية</button>')+'</div>';
  if(c.exp>0)h+='<div class="card row"><span>المصاريف اتردّت للعهدة؟</span><button class="btn small '+(c.reimbursed?"":"sec")+'" data-act="reimb" data-id="'+c.id+'">'+(c.reimbursed?"✔ نعم":"لأ")+'</button></div>';
  if(exps.length){h+='<div class="sect">المصاريف</div><div class="card" style="padding:6px 16px">'+exps.map(function(e){
    return '<div class="item"><div style="flex:1"><div class="t">'+esc(e.type||"مصروف")+'</div><div class="d">'+fdate(e.date)+(dline(srcNote(e),esc(e.note||""))?" · "+dline(srcNote(e),esc(e.note||"")):"")+'</div></div><span class="num" style="font-weight:700">'+fmt(e.amount)+'</span><button class="del" data-act="delitem" data-coll="expenses" data-id="'+e.id+'" aria-label="حذف">🗑</button></div>'}).join("")+'</div>'}
  if(cols.length){h+='<div class="sect">التحصيلات</div><div class="card" style="padding:6px 16px">'+cols.map(function(x){
    return '<div class="item"><div style="flex:1"><div class="t">كاش '+fmt(x.cash)+' · إنستاباي '+fmt(x.insta)+'</div><div class="d">'+fdate(x.date)+(x.note?" · "+esc(x.note):"")+'</div></div><button class="del" data-act="delitem" data-coll="collections" data-id="'+x.id+'" aria-label="حذف">🗑</button></div>'}).join("")+'</div>'}
  if(pays.length){h+='<div class="sect">التسليمات للشركاء</div><div class="card" style="padding:6px 16px">'+pays.map(function(x){
    var p=c.parts.find(function(q){return q.id===x.pid});
    return '<div class="item"><div style="flex:1"><div class="t">'+esc(p?p.name:"شريك")+'</div><div class="d">'+fdate(x.date)+(dline(srcNote(x),esc(x.note||""))?" · "+dline(srcNote(x),esc(x.note||"")):"")+'</div></div><span class="num" style="font-weight:700">'+fmt(x.amount)+'</span><button class="del" data-act="delitem" data-coll="payouts" data-id="'+x.id+'" aria-label="حذف">🗑</button></div>'}).join("")+'</div>'}
  h+='<div class="two" style="margin-top:6px"><button class="btn sec" data-act="form" data-kind="edit" data-car="'+c.id+'">تعديل</button>'+
     (c.sold?'<button class="btn danger" data-act="unsell" data-id="'+c.id+'">إلغاء البيع</button>':'<button class="btn danger" data-act="delcar" data-id="'+c.id+'">حذف العربية</button>')+'</div>';
  if(c.sold)h+='<button class="btn danger" style="margin-top:10px" data-act="delcar" data-id="'+c.id+'">حذف العربية</button>';
  var prev=$("#sheet").scrollTop;
  $("#sheet").innerHTML=h;$("#ov").classList.add("show");$("#sheet").scrollTop=prev;
}

function makePdf(cv){
  var jpg=atob(cv.toDataURL("image/jpeg",0.93).split(",")[1]),W=cv.width,H=cv.height,pw=595,ph=Math.round(pw*H/W*100)/100;
  var parts=[],off=0,offs=[];
  function add(s){parts.push(s);off+=s.length}
  add("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  offs[1]=off;add("1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n");
  offs[2]=off;add("2 0 obj\n<</Type/Pages/Kids[3 0 R]/Count 1>>\nendobj\n");
  offs[3]=off;add("3 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 "+pw+" "+ph+"]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>\nendobj\n");
  offs[4]=off;add("4 0 obj\n<</Type/XObject/Subtype/Image/Width "+W+"/Height "+H+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+jpg.length+">>\nstream\n");add(jpg);add("\nendstream\nendobj\n");
  var cs="q "+pw+" 0 0 "+ph+" 0 0 cm /Im0 Do Q";
  offs[5]=off;add("5 0 obj\n<</Length "+cs.length+">>\nstream\n"+cs+"\nendstream\nendobj\n");
  var xr=off,x="xref\n0 6\n0000000000 65535 f \n",i;
  for(i=1;i<=5;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  add(x+"trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");
  var bin=parts.join(""),u=new Uint8Array(bin.length);
  for(i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return u;
}
async function saveReport(f){
  if(!RC)return toast("استنى التقرير يتجهّز");
  var dl=dlShim();
  if(!dl)return toast("الحفظ مش متاح هنا");
  try{
    if(f==="pdf")await dl.save({filename:RC.file+".pdf",data:makePdf(RC.canvas)});
    else{var blob=await new Promise(function(r){RC.canvas.toBlob(r,"image/png")});await dl.save({filename:RC.file+".png",data:blob})}
  }catch(e){if(!e||e.code!=="declined")toast("تعذر الحفظ، جرّب تاني")}
}


function dlShim(){return {save:async function(o){
  var blob=o.data instanceof Blob?o.data:new Blob([o.data],{type:/\.pdf$/.test(o.filename)?"application/pdf":/\.png$/.test(o.filename)?"image/png":/\.json$/.test(o.filename)?"application/json":"text/csv;charset=utf-8"});
  try{var file=new File([blob],o.filename,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:o.filename});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
}}}

var COLLS={cars:"cars",expenses:"expenses",cols:"collections",cap:"capital",pay:"payouts",transfers:"transfers",ledger:"ledger"};
async function exportBackup(){
  var out={app:"aboud-auto",version:1,at:new Date().toISOString(),settings:S.settings||null,data:{}};

function importBackup(){
  var inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=async function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    try{var j=JSON.parse(await f.text());}catch(e){return toast("الملف ده مش نسخة احتياطية")}
    if(!j||j.app!=="aboud-auto"||!j.data)return toast("الملف ده مش نسخة احتياطية");
    if(!confirm("هيتم استرجاع البيانات من النسخة دي ودمجها مع الموجود. متأكد؟"))return;
    try{
      var ops=[];
      Object.keys(j.data).forEach(function(c){(j.data[c]||[]).forEach(function(d){var o=Object.assign({},d),id=o.id;delete o.id;if(id)ops.push([c+"/"+id,o])})});
      if(j.settings)ops.push(["settings/main",j.settings]);
      for(var i=0;i<ops.length;i+=400){var b=FS.batch();ops.slice(i,i+400).forEach(function(x){b.set(db.doc(x[0]),x[1])});await b.commit()}
      toast("اترجعت البيانات ✔");
    }catch(e){toast("تعذر الاسترجاع، جرّب تاني")}
  };
  inp.click();
}

async function exportCsv(){
  var dl=dlShim();
  if(!dl)return toast("التصدير مش متاح هنا");
  var T=calc();
  var head=["العربية","تاريخ الشراء","سعر الشراء","المصاريف","التكلفة","تاريخ البيع","سعر البيع","محصّل كاش","محصّل إنستاباي","باقي على العميل","صافي الربح","ربحك","الشركاء","الحالة","باقي للبايع"];
  var rows=T.cars.map(function(c){return [c.name,c.buyDate||"",c.buyPrice||0,c.exp,c.cost,c.sellDate||"",c.sold?c.sellPrice:"",c.cashIn,c.instaIn,c.sold?Math.max(c.remaining,0):"",c.sold?c.profit:"",c.sold?c.myProfit:"",
    c.parts.map(function(p){return p.name+" ("+Math.round(p.amount)+")"}).join(" + "),c.sold?(c.remaining>0?"باقي فلوس":"اتباعت"):"في المعرض",Math.max(c.sellerRem,0)]});
  var csv="\ufeff"+[head].concat(rows).map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(",")}).join("\n");

}

  else if(a==="car")openDetail(t.dataset.id);

  }

    var dp=S.ledger.filter(function(x){return x.kind==="pay"&&x.loanId===dlid});

    if(await removeDoc("ledger/"+dlid)){closeSheet();toast("اتحذفت")}})}

    var lcar=carById(t.dataset.id);if(!lcar)return;

    }
  }

  else if(a==="rkind"){modal.kind=t.dataset.k;drawReportSheet()}
  else if(a==="rsave")saveReport(t.dataset.f);
  else if(a==="export")exportCsv();
  else if(a==="backup")exportBackup();

    var cp=S.cap.filter(function(x){return x.carId===cid});
