<style>
:root{
  --bg:#050505; --card:#121110; --text:#f3ecda; --muted:#a89f8a; --line:#2b2517;
  --primary:#d4af37; --primary-ink:#0a0804; --soft:#201a09; --silver:#b9bdc4;
  --good:#3ddc84; --good-bg:#10291a; --bad:#ff6b60; --bad-bg:#341816; --warn:#ffb74d; --warn-bg:#33260d;
  --shadow:0 2px 14px rgba(0,0,0,.6);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
#app{max-width:640px;margin:0 auto;padding:14px 14px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
.top h1{font-size:20px;margin:0;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{background:linear-gradient(135deg,#e6c15a 0%,#c39a2c 55%,#a67f1f 100%);color:#17110a;border-radius:22px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero .l{opacity:.8;font-size:14px}
.hero .v{font-size:34px;font-weight:800;margin:2px 0}
.hero .s{opacity:.8;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.tl{color:var(--muted);font-size:13px}
.tv{font-size:20px;font-weight:800;margin-top:2px}
.ts{color:var(--muted);font-size:12px;margin-top:2px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.abtn{border:0;border-radius:16px;padding:16px 8px;background:var(--soft);color:var(--primary);font-weight:700;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.abtn .ic{font-size:26px}
.abtn:active,.btn:active{transform:scale(.98)}
.btn{border:0;border-radius:14px;padding:14px 16px;background:var(--primary);color:var(--primary-ink);font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:var(--soft);color:var(--primary)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.small{padding:9px 12px;font-size:14px;width:auto;border-radius:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.b-stock{background:var(--soft);color:var(--primary)}
.b-paid{background:var(--good-bg);color:var(--good)}
.b-debt{background:var(--warn-bg);color:var(--warn)}
.ptag{font-size:12px;background:var(--soft);color:var(--primary);border-radius:99px;padding:2px 8px;margin-inline-start:6px;font-weight:700}
.car{cursor:pointer}
.car .name{font-weight:700;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;white-space:nowrap;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);margin-bottom:10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.nav button{flex:1;border:0;background:none;padding:6px 1px;color:var(--muted);font-weight:600;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ic{font-size:20px}
.nav button.on{color:var(--primary)}
.ov{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh h2{margin:0;font-size:19px}
.x{border:0;background:var(--card);border-radius:99px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--muted)}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:14px;color:var(--muted);margin-bottom:5px;font-weight:600}
.fld input,.fld select,.prow input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--card)}
.fld input:focus,.fld select:focus,.search:focus,.prow input:focus{outline:2px solid var(--primary);outline-offset:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:12px;align-items:center}
.prow .pp{grid-column:1/2;border-style:dashed}
.irow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:12px;align-items:center;border:1px dashed var(--line);border-radius:14px;padding:8px}.irow input,.irow select{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 10px;background:var(--card);color:inherit;font:inherit}.irow input:disabled{opacity:.45}.irow .iv{grid-column:1/3}.irow .im{grid-column:1/-1}.irow .ip{grid-column:2/-1;border-style:dashed}
.prow .pr{grid-column:1/-1;width:100%;border:1px dashed var(--primary);border-radius:14px;padding:12px 10px;background:var(--card);color:inherit;font:inherit}
.prow .po{grid-column:2/-1;width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 10px;background:var(--card);color:inherit;font:inherit}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.preview{background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.preview:empty{display:none}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:700}
.pcard{border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-top:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .d{color:var(--muted);font-size:12px}
.del{border:0;background:none;color:var(--muted);font-size:17px;cursor:pointer;padding:6px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.sect{font-weight:800;margin:14px 2px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#1b160a;color:#f3ecda;border:1px solid #d4af37;padding:11px 18px;border-radius:14px;z-index:60;font-weight:600;max-width:90%;text-align:center;display:none}
.toast.show{display:block}
.login{max-width:380px;margin:8vh auto 0;text-align:center}.login img{width:120px;height:120px;border-radius:26px;box-shadow:var(--shadow);margin-bottom:10px}.login h2{font-family:"Cinzel",serif;color:var(--primary);letter-spacing:2px;margin:6px 0 2px;font-size:26px}.login form{text-align:right;margin-top:18px}.login .err{color:var(--bad);font-size:14px;min-height:20px;margin:4px 0 10px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:14px;margin-bottom:12px;font-weight:600}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav input{flex:1;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);text-align:center}
.daynav button{border:0;background:var(--card);border-radius:12px;width:44px;height:46px;font-size:18px;cursor:pointer;box-shadow:var(--shadow);color:var(--text)}
.ok{color:var(--good);font-weight:700;font-size:13px}

.brand{display:flex;align-items:center;gap:12px;margin:4px 2px 16px}
.brand img{width:68px;height:68px;border-radius:16px;border:1px solid var(--line);object-fit:cover;flex:none}
.brand h1{font-family:"Cinzel",Georgia,"Times New Roman",serif;font-size:25px;letter-spacing:.06em;margin:0;font-weight:700;color:var(--primary);line-height:1.1;direction:ltr;text-align:right}
.brand .tag{color:var(--silver);font-size:13px;margin-top:2px}
.brand .sub{margin-top:1px}
.card,.tile{border:1px solid var(--line)}
.nav{border-top:1px solid #3a2f12}
#rprev canvas{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line)}

/* ===== Desktop / laptop layout (wide screens only; phone unchanged) ===== */
.nbrand,.nfoot{display:none}
@media (min-width:860px) and (hover:hover){
  body::before{background-position:calc(50% - 130px) 45%;background-size:min(46vw,560px)}
  .nav{top:0;bottom:0;left:auto;right:0;width:250px;flex-direction:column;justify-content:flex-start;gap:4px;padding:20px 14px;border-top:0;border-left:1px solid #3a2f12;background:linear-gradient(180deg,#141209 0%,#0b0a07 100%)}
  .nav .nbrand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 18px;margin-bottom:10px;border-bottom:1px solid var(--line)}
  .nav .nbrand img{width:92px;height:92px;border-radius:20px;border:1px solid var(--line)}
  .nav .nbrand b{font-family:"Cinzel",Georgia,serif;color:var(--primary);letter-spacing:.08em;font-size:20px;direction:ltr}
  .nav .nbrand span{color:var(--muted);font-size:12px}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 16px;border-radius:14px;font-size:16px;color:var(--text)}
  .nav button .ic{font-size:22px;width:28px;text-align:center}
  .nav button:hover{background:#1d180b;color:var(--primary)}
  .nav button.on{background:var(--primary);color:var(--primary-ink);font-weight:800}
  .nav .nfoot{display:block;margin-top:auto;color:var(--muted);font-size:12px;text-align:center;padding-top:12px;border-top:1px solid var(--line)}

<script>
(function(){
"use strict";
var $ = function(s){return document.querySelector(s)};
var AR = "٠١٢٣٤٥٦٧٨٩";
var EXP_TYPES = ["صيانة","دهان","سمكرة","كهرباء","ترخيص وأوراق","غسيل وتنضيف","توكيل","عمولة المعرض","عمولة مسوق","نقل","أخرى"];

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function parseNum(v){
  if(v==null) return 0;
  var s=String(v).replace(/[٠-٩]/g,function(d){return AR.indexOf(d)}).replace(/[٬,\s]/g,"").replace("٫",".");
  if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  var n=parseFloat(s); return isFinite(n)?n:0;
}
function fmt(n){var r=Math.round(n||0);if(r===0)r=0;return r.toLocaleString("en-US")}
function fmtIn(v){var s=String(v==null?"":v).replace(/[٠-٩]/g,function(d){return AR.indexOf(d)});var neg=/^\s*-/.test(s);var d=s.replace(/\D/g,"").replace(/^0+(?=\d)/,"");if(!d)return neg?"-":"";return (neg?"-":"")+d.replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function moneyInput(el){var v=el.value,pos=el.selectionStart==null?v.length:el.selectionStart,before=v.slice(0,pos).replace(/[^0-9٠-٩]/g,"").length,nv=fmtIn(v);if(nv===v)return;el.value=nv;var i=0,c=0;while(i<nv.length&&c<before){if(/\d/.test(nv[i]))c++;i++}try{el.setSelectionRange(i,i)}catch(x){}}
function pct(x){return '<span class="num">'+(Math.round((x||0)*1000)/10)+'%</span>'}
function m(n,cls){return '<span class="num '+(cls||"")+'">'+fmt(n)+'</span> ج'}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addDays(s,n){var p=s.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fdate(s){return s?'<bdi>'+s.split("-").reverse().join("/")+'</bdi>':""}
function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("show")},2600)}

/* ---------- state ---------- */
var db=null,FS=null;
var S={cars:[],expenses:[],cols:[],cap:[],pay:[],transfers:[],ledger:[],ext:[],inv:[],invmov:[],settings:null,loaded:{},tab:"home",filter:"stock",q:"",day:todayStr(),noDb:false,err:null,auth:"checking"};
var modal=null;
function allLoaded(){var l=S.loaded;return l.cars&&l.expenses&&l.cols&&l.cap&&l.pay&&l.transfers&&l.ledger&&l.ext&&l.inv&&l.invmov&&l.settings}

/* ---------- calculations ---------- */
function paidNow(c){var b=+c.buyPrice||0;return typeof c.buyPaid==="number"?Math.max(0,Math.min(c.buyPaid,b)):b}
function flowsOf(cars,d){
  var cash=0,insta=0,ids={},pk={};
  cars.forEach(function(c){ids[c.id]=1;c.parts.forEach(function(p){pk[c.id+"|"+p.id]=1})});
  function ok(x){return d==null||x===d}
  function add(src,n){if(src==="insta")insta+=n;else cash+=n}
  cars.forEach(function(c){if(ok(c.buyDate))add(c.buySrc,-paidNow(c)+(+c.tradeIn||0)+c.pCash)});
  S.expenses.forEach(function(e){if(ids[e.carId]&&ok(e.date))add(e.src,-(+e.amount||0))});
  S.cols.forEach(function(x){if(ids[x.carId]&&ok(x.date)){cash+=+x.cash||0;insta+=+x.insta||0}});
  S.pay.forEach(function(x){if(!x.roll&&pk[x.carId+"|"+x.pid]&&ok(x.date))add(x.src,-(+x.amount||0))});
  S.cap.forEach(function(x){if((x.kind==="withdraw"||x.kind==="pwithdraw"||x.kind==="jam")&&ok(x.date))add(x.src,-(+x.amount||0));else if(x.kind==="addcap"&&ok(x.date))add(x.src,+x.amount||0)});
  S.transfers.forEach(function(x){if(!ok(x.date))return;var a=+x.amount||0;if(x.dir==="toInsta"){cash-=a;insta+=a}else{cash+=a;insta-=a}});
  S.ledger.forEach(function(x){if(x.kind==="spay"&&ids[x.carId]&&ok(x.date))add(x.src,-(+x.amount||0))});
  S.invmov.forEach(function(x){if(!ok(x.date))return;if(x.kind==="dep")add(x.src==="insta"?"insta":"cash",+x.amount||0);else if(x.kind==="wd")add(x.src==="insta"?"insta":"cash",-(+x.amount||0))});
  var lm=lmapOf();
  S.ledger.forEach(function(x){if(ok(x.date))add(x.src,lsigned(x,lm))});
  return {cash:cash,insta:insta};
}
function calc(){
  var exp={},cash={},insta={},paidBy={},rolledBy={},lossPd={},spd={};
  S.expenses.forEach(function(e){exp[e.carId]=(exp[e.carId]||0)+(+e.amount||0)});
  var trd={},fft={};S.cols.forEach(function(c){if(c.forf){fft[c.carId]=(fft[c.carId]||0)+(+c.cash||0)+(+c.insta||0);return}if(c.trade)trd[c.carId]=(trd[c.carId]||0)+(+c.trade||0);cash[c.carId]=(cash[c.carId]||0)+(+c.cash||0);insta[c.carId]=(insta[c.carId]||0)+(+c.insta||0)});
  S.pay.forEach(function(p){var k=p.carId+"|"+p.pid;paidBy[k]=(paidBy[k]||0)+(+p.amount||0);if(p.roll)rolledBy[k]=(rolledBy[k]||0)+(+p.amount||0)});
  S.cap.forEach(function(x){if(x.kind==="lossrepay"&&x.carId)lossPd[x.carId]=(lossPd[x.carId]||0)+(+x.amount||0)});
  S.ledger.forEach(function(x){if(x.kind==="spay")spd[x.carId]=(spd[x.carId]||0)+(+x.amount||0)});
  var cars=S.cars.map(function(c){
    var e=exp[c.id]||0,ca=cash[c.id]||0,ins=insta[c.id]||0,sold=typeof c.sellPrice==="number";
    var buy=+c.buyPrice||0,cost=buy+e,owedS=buy-paidNow(c),sPaid=spd[c.id]||0;
    var profit=sold?c.sellPrice-cost:null;
    var shs=shareList(c.partners||[],buy);
    var parts=(c.partners||[]).map(function(p,pi){
      var amt=+p.amount||0,hasPct=hasPctOf(p),share=shs[pi];
      var due=amt+(sold?profit*share:0),paid=paidBy[c.id+"|"+p.id]||0;
      return {id:p.id,name:p.name,roll:p.roll||null,rolled:rolledBy[c.id+"|"+p.id]||0,amount:amt,pct:hasPct?+p.pct:null,of:p.of||"",share:share,profit:sold?profit*share:null,due:due,paid:paid,remaining:due-paid};
    });
    var pTotal=parts.reduce(function(a,p){return a+p.amount},0),pCash=parts.reduce(function(a,p){return a+(p.roll?0:p.amount)},0);
    var R0=parts.length?1-parts.reduce(function(a,p){return a+p.share},0):1;
    var invs=(c.investors||[]).map(function(v){var amt=+v.amount||0,sh=invShare(v,R0,buy),iv=invById(v.iid);return {iid:v.iid,name:iv?iv.name:(v.name||"مستثمر"),amount:amt,pct:hasPctOf(v)?+v.pct:null,mode:v.mode||"mine",share:sh,profit:sold?profit*sh:null}});
    var iTotal=invs.reduce(function(a,v){return a+v.amount},0);
    var ownerCap=buy-pTotal-iTotal,ownerShare=R0-invs.reduce(function(a,v){return a+v.share},0);
    var mp=sold?profit*ownerShare:null;
    var lossActive=!!(sold&&c.lossDeferred&&mp<0),lossAmt=lossActive?-mp:0,lossPaid=lossActive?(lossPd[c.id]||0):0;
    return Object.assign({},c,{owedSeller:owedS,sellerPaid:sPaid,sellerRem:owedS-sPaid,exp:e,cashIn:ca,instaIn:ins,cost:cost,sold:sold,profit:profit,
      dep:sold?0:Math.max(0,ca+ins),forfAmt:fft[c.id]||0,tradeGot:trd[c.id]||0,remaining:sold?c.sellPrice-ca-ins-(trd[c.id]||0):null,parts:parts,pTotal:pTotal,pCash:pCash,invs:invs,iTotal:iTotal,ownerCap:ownerCap,ownerShare:ownerShare,
      myProfit:mp,lossActive:lossActive,lossAmt:lossAmt,lossPaid:lossPaid,lossRem:lossAmt-lossPaid});
  }).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
  var capital=+(S.settings&&S.settings.capital)||0, fund=+(S.settings&&S.settings.fund)||0;
  var withdraw=0,repay=0,pw=0;
  var jam=0,addcap=0;
  S.cap.forEach(function(x){var a=+x.amount||0;if(x.kind==="withdraw")withdraw+=a;else if(x.kind==="repay")repay+=a;else if(x.kind==="pwithdraw")pw+=a;else if(x.kind==="jam")jam+=a;else if(x.kind==="addcap")addcap+=a});
  var profit=0,profitEx=0,lossDef=0,lossPaid=0,soldN=0,stockN=0,stockCost=0,debts=0,deposits=0,unre=0,cashTot=0,instaTot=0,pOwed=0;
  cars.forEach(function(c){
    cashTot+=c.cashIn;instaTot+=c.instaIn;
    c.parts.forEach(function(p){pOwed+=p.remaining});
    if(c.sold){
      soldN++;profit+=c.myProfit;
      if(c.lossActive){lossDef+=c.lossAmt;lossPaid+=c.lossPaid}else profitEx+=c.myProfit;
      if(c.remaining>0)debts+=c.remaining;
    }else{stockN++;stockCost+=c.cost;deposits+=c.cashIn+c.instaIn}
    if(!c.reimbursed)unre+=c.exp;
  });
  var forfT=0;cars.forEach(function(c){forfT+=c.forfAmt});profit+=forfT;profitEx+=forfT;
  var recv=0,owe=0;loansCalc().forEach(function(l){if(l.dir==="out")recv+=l.remaining;else owe+=l.remaining});
  var sOwe=0;cars.forEach(function(c){sOwe+=c.sellerRem});owe+=sOwe;
  var extTot=0;S.ext.forEach(function(x){extTot+=+x.amount||0});
  var F=flowsOf(cars),safeBal=capital+F.cash,instaBal=F.insta,cashNow=safeBal+instaBal;
  var lossRem=lossDef-lossPaid,wDef=withdraw-repay,deficit=wDef+lossRem,capNow=capital+addcap-jam-deficit;
  var undist=profitEx-repay-lossPaid-pw,value=capNow+undist;
  var IS=invStats(cars);
  var check=Math.round(cashNow+stockCost+debts+recv-owe-deposits-pOwed-IS.bal-value)===0;
  return {deposits:deposits,forfT:forfT,jam:jam,addcap:addcap,extTot:extTot,cars:cars,capital:capital,fund:fund,withdraw:withdraw,repay:repay,pw:pw,wDef:wDef,deficit:deficit,capNow:capNow,undist:undist,value:value,
    profit:profit,profitEx:profitEx,recv:recv,owe:owe,sOwe:sOwe,lossDef:lossDef,lossPaid:lossPaid,lossRem:lossRem,
    soldN:soldN,stockN:stockN,stockCost:stockCost,debts:debts,cashNow:cashNow,safeBal:safeBal,instaBal:instaBal,
    cashTot:cashTot,instaTot:instaTot,fundBal:fund-unre,unre:unre,pOwed:pOwed,inv:IS,check:check};
}
function carById(id){return calc().cars.find(function(c){return c.id===id})}

function dayCalc(d){
  var T=calc();
  var buys=T.cars.filter(function(c){return c.buyDate===d});
  var exps=S.expenses.filter(function(e){return e.date===d});
  var cols=S.cols.filter(function(c){return c.date===d});
  var sales=T.cars.filter(function(c){return c.sold&&c.sellDate===d});
  var caps=S.cap.filter(function(x){return x.date===d});
  var pays=S.pay.filter(function(x){return x.date===d});
  var trs=S.transfers.filter(function(x){return x.date===d});
  var lds=S.ledger.filter(function(x){return x.date===d&&x.kind!=="spay"}),sps=S.ledger.filter(function(x){return x.date===d&&x.kind==="spay"});
  var buyT=0,expT=0,cashT=0,instaT=0,profT=0,wdT=0,pInT=0,pOutT=0,buyPd=0,spT=0;
  buys.forEach(function(c){buyT+=+c.buyPrice||0;buyPd+=paidNow(c)-(+c.tradeIn||0);pInT+=c.pCash});
  exps.forEach(function(e){expT+=+e.amount||0});
  cols.forEach(function(c){cashT+=+c.cash||0;instaT+=+c.insta||0});
  sales.forEach(function(c){profT+=c.myProfit});S.cols.forEach(function(x){if(x.forf&&x.fdate===d)profT+=(+x.cash||0)+(+x.insta||0)});
  caps.forEach(function(x){if(x.kind==="withdraw"||x.kind==="pwithdraw")wdT+=+x.amount||0});
  pays.forEach(function(x){if(!x.roll)pOutT+=+x.amount||0});
  var lmx=lmapOf(),ldT=0;lds.forEach(function(x){ldT+=lsigned(x,lmx)});sps.forEach(function(x){spT+=+x.amount||0});
  return {ims:S.invmov.filter(function(x){return x.date===d}),xs:S.ext.filter(function(x){return x.date===d}),buys:buys,exps:exps,cols:cols,sales:sales,caps:caps,pays:pays,trs:trs,lds:lds,sps:sps,spT:spT,buyPd:buyPd,acct:flowsOf(T.cars,d),
    buyT:buyT,expT:expT,cashT:cashT,instaT:instaT,profT:profT,wdT:wdT,pInT:pInT,pOutT:pOutT,
    net:cashT+instaT+pInT-buyPd-spT-expT-wdT-pOutT+ldT+invNet(S.invmov.filter(function(x){return x.date===d}))};
}

/* ---------- accounts / capital helpers ---------- */
function sgn(n){return n<0?"bad":(n>0?"good":"")}
function lossCars(){return calc().cars.filter(function(c){return c.lossActive&&c.lossRem>0.5})}
function capOut(k){return k==="withdraw"||k==="pwithdraw"||k==="jam"}
function capIn(k){return k==="addcap"}
function capMove(k){return capOut(k)||capIn(k)}
function capLabel(x){
  if(x.kind==="withdraw")return "👤 سحب من رأس المال";
  if(x.kind==="pwithdraw")return "💵 سحب أرباح";
  if(x.kind==="lossrepay"){var cr=S.cars.find(function(c){return c.id===x.carId});return "📉 سداد خسارة "+esc(cr?cr.name:"عربية")}
  if(x.kind==="jam")return "🤝 قسط جمعية"+(x.jname?" - "+esc(x.jname):"");
  if(x.kind==="addcap")return "➕ زيادة رأس المال";
  return "🏦 سداد عجز السحب";
}
function srcNote(x){return x&&x.src==="insta"?"من إنستاباي":""}
function dline(){var a=[],i;for(i=0;i<arguments.length;i++)if(arguments[i])a.push(arguments[i]);return a.join(" · ")}
function srcSel(n,sel){
  var T=calc();
  return '<select name="'+n+'"><option value="cash"'+(sel==="insta"?"":" selected")+'>الخزنة - كاش (رصيدها '+fmt(T.safeBal)+')</option><option value="insta"'+(sel==="insta"?" selected":"")+'>إنستاباي (رصيده '+fmt(T.instaBal)+')</option></select>';
}
function srcVal(){return val("src")==="insta"?"insta":"cash"}

/* ---------- db writes ---------- */
async function create(coll,data){
  try{var ref=db.collection(coll).doc();await ref.set(Object.assign({},data,{createdAt:Date.now()}));return ref.id}
  catch(e){toast("تعذر الحفظ، جرّب تاني");return null}
}
async function patch(path,data){try{await db.doc(path).update(data);return true}catch(e){toast("تعذر الحفظ، جرّب تاني");return false}}
async function removeDoc(path){try{await db.doc(path).delete();return true}catch(e){toast("تعذر الحذف");return false}}

/* ---------- rendering ---------- */
function tile(l,v,s,cls){return '<div class="tile"><div class="tl">'+l+'</div><div class="tv '+(cls||"")+'">'+v+'</div>'+(s?'<div class="ts">'+s+'</div>':"")+'</div>'}
/* ---------- tap a home tile → breakdown ---------- */
function tkv(l,v,id,s,bold){return '<div class="kv"'+(id?' data-act="car" data-id="'+id+'" style="cursor:pointer"':'')+'><span>'+l+(s?'<br><span class="sub">'+s+'</span>':'')+'</span><b>'+v+(id?' <span class="sub">‹</span>':'')+'</b></div>'}
function ttot(l,v){return '<div class="kv" style="border-bottom:0;padding-top:12px;font-weight:800"><span>'+l+'</span><b>'+v+'</b></div>'}
function tnone(t){return '<div class="sub" style="padding:10px 0">'+t+'</div>'}
function tsec(t){return '<div class="sect">'+t+'</div>'}
function capRecs(k){return S.cap.filter(function(x){return x.kind===k}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"")})}
function capRecRows(k){return capRecs(k).map(function(x){return tkv(fdate(x.date)+(x.note?" · "+esc(x.note):""),m(+x.amount||0))}).join("")}
function tileTap(k){
  var T=calc(),h="",t="",cs;
  if(k==="stock"){
    t="🚗 عربيات في المعرض ("+T.stockN+")";cs=T.cars.filter(function(c){return !c.sold});
    h+=cs.length?cs.map(function(c){return tkv(esc(c.name),m(c.cost),c.id,"شراء "+m(+c.buyPrice||0)+(c.exp>0.5?" + مصاريف "+m(c.exp):"")+" · "+fdate(c.buyDate))}).join(""):tnone("مفيش عربيات في المعرض");
    h+=ttot("إجمالي التكلفة",m(T.stockCost));
  }else if(k==="profit"){
    t="📈 أرباحك من العربيات المباعة";cs=T.cars.filter(function(c){return c.sold});
    h+=cs.length?cs.map(function(c){return tkv(esc(c.name),m(c.myProfit,c.myProfit>=0?"good":"bad"),c.id,"بيع "+m(c.sellPrice)+" − تكلفة "+m(c.cost)+((c.parts.length||c.invs.length)?" · حصتك بس":"")+(c.lossActive?" · خسارة على مراحل":""))}).join(""):tnone("لسه مفيش عربيات اتباعت");
    cs=T.cars.filter(function(c){return c.forfAmt>0.5});
    if(cs.length)h+=tsec("🔖 عرابين اتصادرت (ربح)")+cs.map(function(c){return tkv(esc(c.name),m(c.forfAmt,"good"),c.id)}).join("");
    h+=ttot("الإجمالي",m(T.profit,T.profit>=0?"good":"bad"));
  }else if(k==="debts"){
    t="🧾 مديونيات العملاء";cs=T.cars.filter(function(c){return c.sold&&c.remaining>0.5});
    h+=cs.length?cs.map(function(c){return tkv(esc(c.name),m(c.remaining,"warn"),c.id,"اتباعت بـ "+m(c.sellPrice)+" · اتحصّل "+m(c.cashIn+c.instaIn+c.tradeGot)+" · "+fdate(c.sellDate))}).join(""):tnone("مفيش فلوس باقية عند حد 👌");
    h+=ttot("الإجمالي",m(T.debts,T.debts>0.5?"warn":""));
  }else if(k==="deficit"){
    t="🏦 عجز رأس المال";
    h+=tsec("العجز جاي منين");
    h+=tkv("سحب من رأس المال",m(T.withdraw,T.withdraw>0.5?"bad":""))+tkv("− اتسدد منه",m(T.repay,"good"))+tkv("= عجز السحب",m(T.wDef,T.wDef>0.5?"bad":""));
    cs=T.cars.filter(function(c){return c.lossActive&&c.lossRem>0.5});
    h+=cs.length?cs.map(function(c){return tkv("📉 خسارة "+esc(c.name),m(c.lossRem,"bad"),c.id,"الخسارة "+m(c.lossAmt)+" · اتسدد "+m(c.lossPaid))}).join(""):tkv("خسائر عربيات",m(0));
    h+=ttot("إجمالي العجز",m(T.deficit,T.deficit>0.5?"bad":""));
    h+=tsec("رأس المال")+tkv("رأس المال الأصلي",m(T.capital))+(T.addcap>0.5?tkv("+ زيادات",m(T.addcap,"good")):"")+(T.jam>0.5?tkv("− أقساط جمعية",m(T.jam,"bad")):"")+tkv("− العجز",m(T.deficit,T.deficit>0.5?"bad":""))+ttot("رأس المال الحالي",m(T.capNow));
    if(capRecs("withdraw").length)h+=tsec("👤 السحوبات من رأس المال")+capRecRows("withdraw");
    if(capRecs("repay").length)h+=tsec("✅ السداد")+capRecRows("repay");
  }else if(k==="fund"){
    t="💼 رصيد العهدة";cs=T.cars.filter(function(c){return !c.reimbursed&&c.exp>0.5});
    h+=tkv("العهدة",m(T.fund));
    h+=tsec("اتصرف منها ولسه ما اترديش");
    h+=cs.length?cs.map(function(c){return tkv(esc(c.name),m(c.exp,"bad"),c.id,c.sold?"اتباعت · رجّع المصاريف للعهدة":"لسه في المعرض")}).join(""):tnone("مفيش مصاريف مستنية ترجع");
    h+=ttot("الباقي في العهدة",m(T.fundBal,T.fundBal<0?"bad":""));
  }else if(k==="undist"){
    t="💵 أرباح متاحة";
    h+=tkv("أرباح العربيات المباعة",m(T.profitEx-T.forfT,"good"),null,T.lossDef>0.5?"من غير العربيات اللي خسارتها على مراحل":"");
    if(T.forfT>0.5)h+=tkv("+ عرابين اتصادرت",m(T.forfT,"good"));
    h+=tkv("− سحبت أرباح",m(T.pw,T.pw>0.5?"bad":""))+tkv("− سددت بيها عجز السحب",m(T.repay,T.repay>0.5?"bad":""))+tkv("− سددت بيها خسائر عربيات",m(T.lossPaid,T.lossPaid>0.5?"bad":""));
    h+=ttot("المتاح دلوقتي",m(T.undist));
    if(capRecs("pwithdraw").length)h+=tsec("💵 سحوبات الأرباح")+capRecRows("pwithdraw");
  }else if(k==="ext"){
    t="🤝 أرباح خارجية";cs=S.ext.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"")});
    h+=cs.length?cs.map(function(x){var p=[x.seller?"البايع: "+esc(x.seller):"",x.buyer?"المشتري: "+esc(x.buyer):"",fdate(x.date)].filter(Boolean).join(" · ");return tkv(esc(x.desc||"عمولة"),m(+x.amount||0,"good"),null,p+(x.note?"<br>"+esc(x.note):""))}).join(""):tnone("لسه مفيش عمولات خارجية");
    h+=ttot("الإجمالي",m(T.extTot,"good"));
  }else if(k==="own"){
    t="⭐ أرباحك الخاصة";
    h+=tkv("أرباح العربيات المباعة",m(T.profit,T.profit>=0?"good":"bad"),null,'<span class="num">'+T.soldN+'</span> عربية');
    h+=ttot("الإجمالي",m(T.profit,T.profit>=0?"good":"bad"));
    h+='<div class="two" style="margin-top:12px"><button class="btn sec small" data-act="tinfo" data-k="profit">تفاصيل العربيات</button></div>';
  }
  modal={type:"tinfo",k:k};
  openSheet(sheetHead(t)+'<div class="card">'+h+'</div>'+(/stock|profit|debts|deficit|fund/.test(k)?'<div class="sub" style="text-align:center;margin-top:8px">اضغط على أي عربية تفتح تفاصيلها</div>':""));
}
function tapTile(html,k){return html.replace('<div class="tile"','<div class="tile" data-act="tinfo" data-k="'+k+'" style="cursor:pointer"').replace(/<\/div>$/,'<div class="ts" style="opacity:.6">اضغط للتفاصيل ‹</div></div>')}
function statusBadge(c){
  if(!c.sold)return c.dep>0.5?'<span class="badge b-debt">محجوزة بعربون</span>':'<span class="badge b-stock">في المعرض</span>';
  if(c.remaining>0)return '<span class="badge b-debt">باقي فلوس</span>';
  return '<span class="badge b-paid">اتباعت</span>';
}
function carCard(c){
  var line=c.sold?('ربحك <b class="'+(c.myProfit>=0?"good":"bad")+'">'+m(c.myProfit)+'</b>'):('اشتريت '+fdate(c.buyDate));
  return '<div class="card car" data-act="car" data-id="'+c.id+'"><div class="row"><span class="name">'+esc(c.name)+(c.parts.length?'<span class="ptag">🤝 شراكة</span>':'')+(c.invs.length?'<span class="ptag">💼 مستثمر</span>':'')+(c.lossActive?'<span class="ptag">📉 خسارة على مراحل</span>':'')+(!c.sold&&c.dep>0.5?'<span class="ptag">🔖 عربون '+fmt(c.dep)+'</span>':'')+(c.sellerRem>0.5?'<span class="ptag">⏳ باقي للبايع '+fmt(c.sellerRem)+'</span>':'')+'</span>'+statusBadge(c)+'</div>'+
    '<div class="row sub" style="margin-top:6px"><span>التكلفة '+m(c.cost)+'</span><span>'+line+'</span></div></div>';
}

function filteredCars(){
  var T=calc(),q=S.q.trim().toLowerCase();
  return T.cars.filter(function(c){
    if(S.filter==="stock"&&c.sold)return false;
    if(S.filter==="sold"&&!c.sold)return false;
    if(S.filter==="debt"&&!(c.sold&&c.remaining>0))return false;
    if(S.filter==="partner"&&!c.parts.length)return false;
    if(q&&c.name.toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function carListHtml(){
  var l=filteredCars();
  if(!l.length)return '<div class="empty">'+(S.cars.length?"مفيش عربيات بالشكل ده":"لسه مسجلتش أي عربية.<br>دوس على «شراء عربية» وابدأ.")+'</div>';
  return l.map(carCard).join("");
}

  /* السلف: باند واحد لكل سلفة. الزيادة والفلوس اللي بترجع بيتعدّلوا في نفس الباند من غير سطر جديد.

  loansCalc().forEach(function(l){var o=l.dir==="out",left=Math.max(0,l.remaining),done=left<0.5,who=l.person||"؟";

function kashCalc(){

function kashPages(){return (((S.kashp&&S.kashp.pages))||[]).slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"")||a.ts-b.ts})}
/* الصفحة حسب وقت تسجيل الحركة: أي حاجة تتسجل بعد فتح صفحة جديدة تروح لها حتى لو تاريخها قديم */
function kashPageOf(e,P){var t=e.at!=null?e.at:(e.c||0),n=0;P.forEach(function(p){if(t>=p.ts)n++});return n}
/* a = رقم التقفيل اللي اترد فيه الأصل، f = رقم التقفيل اللي اترد فيه الربح (-1 = لسه) */
function kashSettle(c,key,P){var r={a:-1,f:-1};if(!c.sold)return r;
  for(var k=0;k<P.length;k++){if(r.a<0&&(c.soldAt?P[k].ts>c.soldAt:(P[k].date||"")>=(c.sellDate||"9999")))r.a=k;if(r.a>=0&&(P[k].pk||[]).indexOf(c.id+"|"+key)<0){r.f=k;break}}
  return r}
/* اللي هيترد مع التقفيل الجاي وليهم ربح (عشان نسأل: الأصل بس ولا الأصل والربح) */
function kashPend(){var T=calc(),P=kashPages(),L=[];
  T.cars.forEach(function(c){if(!c.sold)return;
    c.parts.map(function(p){return {key:"p"+p.id,n:p.name,a:+p.amount||0,pd:+p.paid||0,rl:+p.rolled||0,pr:p.profit}}).concat(c.invs.map(function(v){return {key:"i"+v.iid,n:v.name,a:+v.amount||0,pd:0,pr:v.profit}})).forEach(function(p){
      var pr=p.pr?Math.round(p.pr):0;pr-=Math.max(0,Math.min(p.rl||0,p.pd-p.a));if(pr<=0||p.a<0.5)return;var st=kashSettle(c,p.key,P);if(st.f>=0)return;
      L.push({key:c.id+"|"+p.key,n:p.n||"شريك",car:c.name,base:st.a<0?Math.max(0,p.a-p.pd):0,pr:pr})})});
  return L}

/* ---------- loans / ledger ---------- */
function lmapOf(){var m={};S.ledger.forEach(function(x){if(x.kind==="loan")m[x.id]=x});return m}
function lsigned(x,lm){
  var a=+x.amount||0;
  if(x.kind==="loan")return x.dir==="out"?-a:a;
  if(x.kind==="ladd"&&lm[x.loanId])return lm[x.loanId].dir==="out"?-a:a;
  if(x.kind==="pay"&&lm[x.loanId])return lm[x.loanId].dir==="out"?a:-a;
  return 0;
}
function loansCalc(){
  var m={},list=[];
  function srt(a,b){return (b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0)}
  S.ledger.forEach(function(x){if(x.kind==="loan"){m[x.id]={id:x.id,person:x.person||"",dir:x.dir,amount0:+x.amount||0,amount:+x.amount||0,adds:0,date:x.date,src:x.src,note:x.note||"",createdAt:x.createdAt||0,paid:0,pays:[],moves:[],invs:(x.dir==="out"&&x.invs)||[]};list.push(m[x.id])}});
  S.ledger.forEach(function(x){var l=m[x.loanId];if(!l)return;if(x.kind==="pay"){l.paid+=+x.amount||0;l.pays.push(x);l.moves.push(x)}else if(x.kind==="ladd"){l.adds+=+x.amount||0;l.amount+=+x.amount||0;l.moves.push(x)}});
  /* لو جزء من السلفة من فلوس مستثمر: اللي بيرجع بيتقسم على قد نصيب كل واحد */
  list.forEach(function(l){l.remaining=l.amount-l.paid;
    var r=l.amount>0?Math.max(0,l.remaining)/l.amount:0;
    l.invs=l.invs.map(function(v){var a=+v.amount||0;return {iid:v.iid,name:v.name||"",amount:a,left:a*r}});
    l.invTot=l.invs.reduce(function(a,v){return a+v.amount},0);l.invLeft=l.invTot*r;
    l.myAmount=l.amount-l.invTot;l.myLeft=Math.max(0,l.remaining)-l.invLeft;
    l.pays.sort(srt);l.moves.sort(srt)});
  return list.sort(srt);
}

function readLoanInv(total){
  var rows=document.querySelectorAll("#sheet .lirow"),out=[],used={},sum=0,bad=null,L=calc().inv.list;
  rows.forEach(function(r){if(bad)return;var iid=r.querySelector(".liv").value,a=parseNum(r.querySelector(".lia").value);if(!a)return;
    var o=L.find(function(x){return x.id===iid});if(!o){bad="اختار المستثمر";return}
    if(used[iid]){bad=o.name+" متكرر";return}used[iid]=1;
    if(a>o.free+0.5){bad="رصيد "+o.name+" المتاح "+fmt(o.free)+" بس";return}
    sum+=a;out.push({iid:iid,name:o.name,amount:a})});
  if(bad)return {error:bad};
  if(sum>total+0.5)return {error:"جزء المستثمرين أكبر من مبلغ السلفة"};
  return {list:out};
}

}

function readPartners(){
  var rows=document.querySelectorAll("#sheet .prow"),out=[],bad=null;
  rows.forEach(function(r,i){
    var n=r.querySelector(".pn").value.trim(),a=parseNum(r.querySelector(".pa").value),pt=r.querySelector(".pp").value.trim();

    if(!n||a<0||(a<=0&&pt==="")){bad="اكتب اسم الشريك والمبلغ اللي دفعه أو نسبته من الربح";return}
    if(mine&&pt===""){bad="حدد نسبة "+n+" من نصيبك";return}
    var o2={id:r.dataset.pid||("p"+Date.now().toString(36)+i),name:n,amount:a};if(mine)o2.of="mine";var prs=r.querySelector(".pr");if(prs&&prs.value&&ROLLC)o2.roll={car:ROLLC.id,pid:prs.value};

function shareSum(list,price){var all=0,mine=0;list.forEach(function(p){if(p.of==="mine")mine+=hasPctOf(p)?(+p.pct)/100:0;else all+=hasPctOf(p)?(+p.pct)/100:(price>0?(+p.amount||0)/price:0)});if(all>1.0001)return all;if(mine>1.0001)return 2;return all+(1-all)*mine}

function updatePreview(){
  var pv=$("#pv");if(!pv||!modal||modal.type!=="form")return;
  var k=modal.kind;
  if(k==="sellerpay"){
    var Ts=calc(),sa=parseNum(val("amount")),sc2=carById(val("carId")),si=val("src")==="insta";
    var sf2=Ts.safeBal+(si?0:-sa),ib2=Ts.instaBal+(si?-sa:0);
    pv.innerHTML='باقي للبايع بعد السداد: <b>'+m(Math.max((sc2?sc2.sellerRem:0)-sa,0))+'</b><br>بعد العملية: الخزنة <b class="'+(sf2<0?"bad":"")+'">'+m(sf2)+'</b> · إنستاباي <b class="'+(ib2<0?"bad":"")+'">'+m(ib2)+'</b>';
    return;
  }
  if(k==="loan"||k==="loanpay"){
    var Tp=calc(),pa0=parseNum(val("amount")),sg0;
    if(k==="loan")sg0=val("dir")==="in"?pa0:-pa0;
    else{var lq0=loansCalc().find(function(x){return x.id===val("loanId")});sg0=lq0&&lq0.dir==="out"?pa0:-pa0}
    var ins0=val("src")==="insta";
    var sf=Tp.safeBal+(ins0?0:sg0),ib=Tp.instaBal+(ins0?sg0:0);
    pv.innerHTML='بعد العملية: الخزنة <b class="'+(sf<0?"bad":"")+'">'+m(sf)+'</b> · إنستاباي <b class="'+(ib<0?"bad":"")+'">'+m(ib)+'</b>';
    return;
  }
  if(k==="transfer"){
    var T0=calc(),ta=parseNum(val("amount")),toSafe=val("dir")!=="toInsta";
    var s0=T0.safeBal+(toSafe?ta:-ta),i0=T0.instaBal+(toSafe?-ta:ta);
    pv.innerHTML='بعد التحويل: الخزنة <b class="'+(s0<0?"bad":"")+'">'+m(s0)+'</b> · إنستاباي <b class="'+(i0<0?"bad":"")+'">'+m(i0)+'</b>';
    return;
  }
  if(k==="invmove"){
    var Ti=calc(),ia0=parseNum(val("amount")),io0=Ti.inv.list.find(function(x){return x.id===val("iid")}),wd0=val("kind")==="wd",ii0=val("src")==="insta",sg1=wd0?-ia0:ia0;
    var sf1=Ti.safeBal+(ii0?0:sg1),ib1=Ti.instaBal+(ii0?sg1:0);
    pv.innerHTML=(io0?'رصيد '+esc(io0.name)+' بعد العملية: <b>'+m(io0.bal+sg1)+'</b> · كاش '+m(io0.free+sg1)+(wd0&&ia0>io0.free+0.5?'<br><b class="bad">المبلغ أكبر من الكاش اللي عنده (الباقي شغال في عربيات)</b>':'')+'<br>':'')+'بعد العملية: الخزنة <b class="'+(sf1<0?"bad":"")+'">'+m(sf1)+'</b> · إنستاباي <b class="'+(ib1<0?"bad":"")+'">'+m(ib1)+'</b>';
    return;
  }
  if(k==="buy"||k==="edit"){
    var price=parseNum(val("price")),sum=0,n=0,ssum=0,pd0=val("paid").trim(),stxt="";
    if(pd0!==""){var pdn=parseNum(pd0);stxt=pdn>price?'<b class="bad">المدفوع أكبر من سعر الشراء</b>':'هتدفع دلوقتي: <b>'+m(pdn)+'</b> · باقي للبايع: <b class="warn">'+m(price-pdn)+'</b>'}
    var plist=[],pnames=[];
    document.querySelectorAll("#sheet .prow").forEach(function(r){
      var a=parseNum(r.querySelector(".pa").value),ptx=r.querySelector(".pp").value.trim(),po=r.querySelector(".po");
      if(a>0||ptx!==""){sum+=a;n++;plist.push({amount:a,pct:ptx!==""?parseNum(ptx):null,of:po&&po.value==="mine"?"mine":""});pnames.push(r.querySelector(".pn").value.trim()||"شريك")}
    });
    ssum=shareSum(plist,price);
    var ilst=[],inames=[],isum=0;
    document.querySelectorAll("#sheet .irow").forEach(function(r){var a=parseNum(r.querySelector(".ia").value),pt=r.querySelector(".ip").value.trim(),md=r.querySelector(".im").value,s=r.querySelector(".iv"),op=s&&s.options[s.selectedIndex];if(a>0){isum+=a;ilst.push({amount:a,pct:pt!==""?parseNum(pt):0,mode:md});inames.push(op?op.text.replace(/ \(متاح.*$/,""):"مستثمر")}});
    if(!n&&!ilst.length){pv.innerHTML=stxt;return}
    var R0=1-ssum,ish=ilst.map(function(v){return invShare(v,R0,price)}),isr=ish.reduce(function(a,b){return a+b},0),mine=price-sum-isum;
    var shl=(n?shareList(plist,price).map(function(s,i){return esc(pnames[i])+' '+pct(s)}):[]).concat(ish.map(function(s,i){return '💼 '+esc(inames[i])+' '+pct(s)}));
    pv.innerHTML=mine<0?'<b class="bad">مبالغ الشركاء والمستثمرين أكبر من سعر الشراء</b>':(ssum>1.0001||isr>R0+0.0001)?'<b class="bad">نسب الأرباح أكتر من ١٠٠٪</b>':
      'رأس مالك: <b>'+m(mine)+'</b>'+(n?' · رأس مال الشركاء: '+m(sum):'')+(isum?' · فلوس مستثمرين: '+m(isum):'')+'<br>نسبة ربحك: <b>'+pct(R0-isr)+'</b> · '+shl.join(' · ');
    if(stxt)pv.innerHTML+='<br>'+stxt;
    return;
  }
  var c=carById(val("carId"));if(!c)return;
  var cash=parseNum(val("cash")),ins=parseNum(val("insta"));
  if(k==="sell"){
    var pre=c.sold?0:c.cashIn+c.instaIn,p=parseNum(val("price")),tv=parseNum(val("tval")),tr=tv>0?Math.min(p,tv):0,rest=p-tr-cash-ins-pre,profit=p-c.cost;
    var t='تكلفة العربية: '+m(c.cost)+'<br>صافي الربح: <b class="'+(profit>=0?"good":"bad")+'">'+m(profit)+'</b>';
    c.invs.forEach(function(v){t+='<br>💼 '+esc(v.name)+' ('+pct(v.share)+'): <b class="'+(profit>=0?"good":"bad")+'">'+m(profit*v.share)+'</b>'});
    if(c.parts.length||c.invs.length)t+='<br>ربحك (نسبة '+pct(c.ownerShare)+'): <b class="'+(profit>=0?"good":"bad")+'">'+m(profit*c.ownerShare)+'</b>';
    if(pre>0.5)t+='<br>🔖 عربون مدفوع قبل كده: <b>'+m(pre)+'</b> (بيتخصم من السعر)';
    if(tv>0)t+=tv>p?'<br>🔁 إنت هتدفع فرق للعميل: <b class="warn">'+m(tv-p)+'</b>':'<br>🔁 العميل هيدفع فرق: <b>'+m(p-tv)+'</b>';
    pv.innerHTML=t+(tv>p?'':'<br>باقي على العميل: <b>'+m(rest>0?rest:0)+'</b>');
  }else if(k==="collect"){
    var after=(c.remaining||0)-cash-ins;
    pv.innerHTML='باقي على العميل دلوقتي: '+m(c.remaining||0)+'<br>بعد التحصيل: <b>'+m(after>0?after:0)+'</b>';
  }
}

        if(okf){done({carId:xcar.id});toast("العربون بقى ربح للمعرض ✔")}
      }else{
        var xc1=parseNum(val("cash")),xi1=parseNum(val("insta"));
        if(xc1<0||xi1<0||xc1+xi1<=0)return toast("اكتب المبلغ اللي رجّعته");
        if(xc1+xi1>xcar.dep+0.5)return toast("المبلغ أكبر من العربون ("+fmt(xcar.dep)+")");
        if(await create("collections",{carId:xcar.id,date:xdt,cash:-xc1,insta:-xi1,dep:true,depRef:true,note:val("note").trim()||"رد عربون"})){done({carId:xcar.id});toast("اترد العربون ✔")}
      }
    }else if(k==="collect"){
      var c1=parseNum(val("cash")),i1=parseNum(val("insta"));
      if(c1+i1<=0)return toast("اكتب المبلغ المحصّل");
      if(await create("collections",{carId:val("carId"),date:val("date")||todayStr(),cash:c1,insta:i1,note:val("note").trim()})){done(o);toast("اتسجّل التحصيل ✔")}
    }else if(k==="payout"){
      var pa=parseNum(val("amount"));if(pa<=0)return toast("اكتب المبلغ");
      if(await create("payouts",{carId:val("carId"),pid:val("pid"),amount:pa,date:val("date")||todayStr(),src:srcVal(),note:val("note").trim()})){done(o);toast("اتسجّل التسليم ✔")}
    }else if(k==="capital"){
      var am=parseNum(val("amount")),ck=val("kind"),T2=calc();
      if(am<=0)return toast("اكتب المبلغ");
      var rec={kind:ck,amount:am,date:val("date")||todayStr(),note:val("note").trim()};
      if(ck==="withdraw"||ck==="pwithdraw"||ck==="jam"||ck==="addcap")rec.src=srcVal();
      if(ck==="jam"&&val("jname").trim())rec.jname=val("jname").trim();
      if(ck==="pwithdraw"&&am>T2.undist+0.5)return toast("المبلغ أكبر من الأرباح المتاحة ("+fmt(T2.undist)+"). للسحب من رأس المال اختار «سحب من رأس المال»");
      if(ck==="repay"&&am>T2.wDef+0.5)return toast("السداد أكبر من عجز السحب ("+fmt(T2.wDef)+")");
      if(ck==="lossrepay"){
        var lcar=carById(val("carId"));
        if(!lcar||!lcar.lossActive)return toast("اختار عربية عليها خسارة");
        if(am>lcar.lossRem+0.5)return toast("المبلغ أكبر من المتبقي من الخسارة ("+fmt(lcar.lossRem)+")");
        if(am>T2.undist+0.5)return toast("المبلغ أكبر من الأرباح المتاحة ("+fmt(T2.undist)+")");
        rec.carId=lcar.id;
      }
      if(await create("capital",rec)){
        if(ck==="lossrepay"&&o.carId)done({carId:rec.carId});else closeSheet();
        toast("اتسجّل ✔");
      }
    }else if(k==="ret"){
      var rcar=carById(val("carId"));if(!rcar||!rcar.sold)return toast("العربية مش متباعة");
      var rcs=parseNum(val("cash")),ris=parseNum(val("insta")),coll=rcar.cashIn+rcar.instaIn;
      if(rcs<0||ris<0)return toast("راجع المبالغ");
      if(Math.abs(rcs+ris-coll)>0.5)return toast("لازم اللي يترد يساوي اللي اتحصّل ("+fmt(coll)+")");
      if(S.cols.some(function(x){return x.carId===rcar.id&&x.trade}))return toast("البيعة دي كان فيها عربية داخلة، الرجوع لازم يتظبط يدوي (امسح العربية الداخلة وألغي البيع)");
      if(S.cap.some(function(x){return x.kind==="lossrepay"&&x.carId===rcar.id}))return toast("العربية دي عليها سداد خسارة، امسح دفعات السداد الأول");
      var rdt=val("date")||todayStr(),raw=S.cars.find(function(x){return x.id===rcar.id})||{};
      var rok=true;
      if(rcs+ris>0)rok=!!(await create("collections",{carId:rcar.id,date:rdt,cash:-rcs,insta:-ris,refund:true,note:"مرتجع"}));
      if(rok)rok=await patch("cars/"+rcar.id,{sellPrice:null,sellDate:null,lossDeferred:false,returns:(raw.returns||[]).concat([{date:rdt,sellPrice:rcar.sellPrice,sellDate:rcar.sellDate,refund:rcs+ris,note:val("note").trim()}])});
      if(rok){done({carId:rcar.id});toast("العربية رجعت للمعرض ✔")}
    }else if(k==="ext"){
      var xd=val("desc").trim(),xa=parseNum(val("amount")),xh=val("how");
      if(!xd)return toast("اكتب وصف العملية");
      if(xa<=0)return toast("اكتب مبلغ العمولة");
      if(await create("external",{desc:xd,seller:val("seller").trim(),buyer:val("buyer").trim(),amount:xa,date:val("date")||todayStr(),how:EXT_HOW[xh]?xh:"cash",note:val("note").trim()})){closeSheet();toast("اتسجّلت العمولة ✔")}
    }else if(k==="transfer"){
      var ta=parseNum(val("amount"));if(ta<=0)return toast("اكتب المبلغ");
      if(await create("transfers",{dir:val("dir")==="toInsta"?"toInsta":"toSafe",amount:ta,date:val("date")||todayStr(),note:val("note").trim()})){closeSheet();toast("اتسجّل التحويل ✔")}
    }else if(k==="loan"){
      var lpn=val("person").trim(),lam=parseNum(val("amount"));
      if(!lpn)return toast("اكتب اسم الشخص");
      if(lam<=0)return toast("اكتب المبلغ");
      var ldir=val("dir")==="in"?"in":"out",linv=[];
      if(ldir==="out"){var LR=readLoanInv(lam);if(LR.error)return toast(LR.error);linv=LR.list}
      var lrec={kind:"loan",person:lpn,dir:ldir,amount:lam,date:val("date")||todayStr(),src:srcVal(),note:val("note").trim()};if(linv.length)lrec.invs=linv;
      var lnid=await create("ledger",lrec);
      if(lnid){closeSheet();toast("اتسجّلت ✔")}
    }else if(k==="loanadd"){
      var aid=val("loanId"),aa=parseNum(val("amount"));
      if(!loansCalc().some(function(x){return x.id===aid}))return toast("السلفة مش موجودة");
      if(aa<=0)return toast("اكتب المبلغ");
      if(await create("ledger",{kind:"ladd",loanId:aid,amount:aa,date:val("date")||todayStr(),src:srcVal(),note:val("note").trim()})){closeSheet();openLoan(aid);toast("اتضافت الزيادة ✔")}
    }else if(k==="loanpay"){
      var lid=val("loanId"),pa2=parseNum(val("amount")),ln2=loansCalc().find(function(x){return x.id===lid});
      if(!ln2)return toast("السلفة مش موجودة");
      if(pa2<=0)return toast("اكتب المبلغ");
      if(pa2>ln2.remaining+0.5)return toast("المبلغ أكبر من المتبقي ("+fmt(ln2.remaining)+")");
      if(await create("ledger",{kind:"pay",loanId:lid,amount:pa2,date:val("date")||todayStr(),src:srcVal(),note:val("note").trim()})){closeSheet();openLoan(lid);toast("اتسجّلت الدفعة ✔")}
    }else if(k==="sellerpay"){
      var spc=carById(val("carId")),spa=parseNum(val("amount"));
      if(!spc)return toast("العربية مش موجودة");
      if(spa<=0)return toast("اكتب المبلغ");
      if(spa>spc.sellerRem+0.5)return toast("المبلغ أكبر من المتبقي للبايع ("+fmt(spc.sellerRem)+")");
      if(await create("ledger",{kind:"spay",carId:spc.id,amount:spa,date:val("date")||todayStr(),src:srcVal(),note:val("note").trim()})){done(o);toast("اتسجّل السداد ✔")}
    }else if(k==="investor"){
      var inm=val("iname").trim(),ip=val("ipct").trim(),inote=val("note").trim(),ia=parseNum(val("amount")),idt=val("date")||todayStr(),isrc=srcVal();
      if(!inm)return toast("اكتب اسم المستثمر");
      var ipv=null;if(ip!==""){ipv=parseNum(ip);if(ipv<0||ipv>100)return toast("النسبة لازم تكون من ٠ لـ ١٠٠")}
      if(o.iid){if(await patch("investors/"+o.iid,{name:inm,pct:ipv,note:inote})){openInv(o.iid);toast("اتعدّل ✔")}}
      else{
        var nid=await create("investors",{name:inm,pct:ipv,note:inote});
        if(nid&&ia>0)await create("invmoves",{iid:nid,kind:"dep",amount:ia,date:idt,src:isrc,note:"أول إيداع"});
        if(nid){closeSheet();S.tab="inv";render();toast("اتضاف المستثمر ✔")}
      }
    }else if(k==="invmove"){
      var ik=val("kind")==="wd"?"wd":"dep",iid2=val("iid"),iam=parseNum(val("amount")),io=calc().inv.list.find(function(x){return x.id===iid2});
      if(!io)return toast("اختار المستثمر");if(iam<=0)return toast("اكتب المبلغ");
      if(ik==="wd"&&iam>io.free+0.5)return toast("المتاح للسحب "+fmt(io.free)+" بس (الباقي شغال في عربيات)");
      if(await create("invmoves",{iid:iid2,kind:ik,amount:iam,date:val("date")||todayStr(),src:srcVal(),note:val("note").trim()})){if(o.iid)openInv(iid2);else closeSheet();toast("اتسجّل ✔")}
    }else if(k==="invloss"){
      var lid2=val("iid"),lam2=parseNum(val("amount")),lo3=calc().inv.list.find(function(x){return x.id===lid2});
      if(!lo3)return toast("المستثمر مش موجود");if(lam2<=0)return toast("اكتب المبلغ");
      if(lam2>lo3.repayable+0.5)return toast("أقصى سداد دلوقتي "+fmt(lo3.repayable));
      if(await create("invmoves",{iid:lid2,kind:"lossrepay",amount:lam2,date:val("date")||todayStr(),note:val("note").trim()})){if(o.fromSale&&o.carId)done({carId:o.carId});else openInv(lid2);toast("اتسجّل السداد ✔")}
    }else if(k==="settings"){
      try{await db.doc("settings/main").set({capital:parseNum(val("capital")),fund:parseNum(val("fund"))});closeSheet();toast("اتحفظت ✔")}
      catch(e){toast("تعذر الحفظ، جرّب تاني")}
    }
  }finally{submitting=false}
}

function renderDetail(){

  }
  h+='</div>';

  if(c.sold&&c.myProfit<0){
    var lp=S.cap.filter(function(x){return x.kind==="lossrepay"&&x.carId===c.id}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"")});
    h+='<div class="sect">الخسارة 📉</div><div class="card">';
    if(!c.lossDeferred){
      h+='<div class="sub" style="margin-bottom:10px">خسارتك في العربية دي <b class="bad">'+m(-c.myProfit)+'</b> وبتتخصم من أرباحك على طول. لو عايز تسددها من أرباح عربيات تانية على مراحل، فعّل السداد على مراحل.</div>'+
         '<button class="btn sec" data-act="lossdef" data-id="'+c.id+'" data-on="1">سداد الخسارة على مراحل</button>';
    }else{
      h+='<div class="kv"><span>خسارتك</span><b class="bad">'+m(c.lossAmt)+'</b></div><div class="kv"><span>اتسدد من الأرباح</span><b>'+m(c.lossPaid)+'</b></div><div class="kv"><span>المتبقي</span><b class="'+(c.lossRem>0.5?"warn":"good")+'">'+m(Math.max(c.lossRem,0))+'</b></div>'+
         '<div class="two" style="margin-top:10px"><button class="btn" data-act="form" data-kind="capital" data-sub="lossrepay" data-car="'+c.id+'">+ سداد دفعة</button><button class="btn sec" data-act="lossdef" data-id="'+c.id+'" data-on="0">إلغاء السداد على مراحل</button></div>';

    }
    h+='</div>';
  }
  if(hasP){
    h+='<button class="btn" style="margin:6px 0 4px" data-act="report" data-kind="carp" data-car="'+c.id+'">📄 تقرير شامل للعربية بكل الشركاء والنسب</button>';

        h+='<div class="kv"><span>ربحه</span><b class="'+(p.profit>=0?"good":"bad")+'">'+m(p.profit)+'</b></div>'+

           '<div class="kv"><span>اتسلّم</span><b>'+m(p.paid)+'</b></div>'+

      h+='<div style="padding:6px 0 8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec small" data-act="form" data-kind="payout" data-car="'+c.id+'" data-pid="'+esc(p.id)+'">تسليم فلوس لـ'+esc(p.name)+'</button><button class="btn sec small" data-act="report" data-kind="partner" data-name="'+esc(p.name)+'" data-car="'+c.id+'">📄 تقرير للشريك</button></div></div>';
    });
    h+='</div>';
  }
  if(c.invs.length){
    h+='<div class="sect">💼 فلوس مستثمرين</div><div class="card">';
    if(!hasP)h+='<div class="kv"><span>رأس مالك</span><b>'+m(c.ownerCap)+'</b></div><div class="kv"><span>نسبة ربحك</span><b>'+pct(c.ownerShare)+'</b></div>';
    c.invs.forEach(function(v){

    h+='</div>';

    var sps2=S.ledger.filter(function(x){return x.kind==="spay"&&x.carId===c.id}).sort(function(a,b){return (b.date||"").localeCompare(a.date||"")});

  h+='<div class="two" style="margin-bottom:10px"><button class="btn sec" data-act="form" data-kind="expense" data-car="'+c.id+'">+ مصروف</button>'+

var INV_MODES=[["mine","من نصيبي أنا (بعد الشركاء)"],["all","من الربح كله"],["money","حسب فلوسه من سعر الشراء"]];
function invById(id){return S.inv.find(function(x){return x.id===id})}
function invName(id){var o=invById(id);return o?o.name:"مستثمر"}
function invShare(v,R0,price){
  var md=v.mode||"mine";
  if(md==="money")return price>0?(+v.amount||0)/price:0;
  var p=hasPctOf(v)?(+v.pct)/100:0;
  return md==="all"?p:p*R0;
}
function invNet(list){var n=0;list.forEach(function(x){if(x.kind==="dep")n+=+x.amount||0;else if(x.kind==="wd")n-=+x.amount||0});return n}
function invModeTxt(v){
  if(v.mode==="money")return "حسب فلوسه";
  if(v.mode==="all")return (v.pct!=null?v.pct+"% ":"")+"من الربح كله";
  return (v.pct!=null?v.pct+"% ":"")+"من نصيبك";
}
function invStats(cars){
  var mp={},list=[];
  S.inv.forEach(function(v){mp[v.id]={id:v.id,name:v.name||"",pct:hasPctOf(v)?+v.pct:null,note:v.note||"",createdAt:v.createdAt||0,dep:0,wd:0,prof:0,loss:0,lr:0,working:0,lent:0,loans:[],cars:[],moves:[]};list.push(mp[v.id])});
  S.invmov.forEach(function(x){var o=mp[x.iid];if(!o)return;var a=+x.amount||0;if(x.kind==="dep")o.dep+=a;else if(x.kind==="wd")o.wd+=a;else if(x.kind==="lossrepay")o.lr+=a;o.moves.push(x)});
  cars.forEach(function(c){(c.invs||[]).forEach(function(v){var o=mp[v.iid];if(!o)return;o.cars.push({c:c,v:v});if(!c.sold)o.working+=v.amount;else if(v.profit>=0)o.prof+=v.profit;else o.loss+=-v.profit})});
  loansCalc().forEach(function(l){l.invs.forEach(function(v){var o=mp[v.iid];if(!o)return;o.lent+=v.left;o.loans.push({l:l,v:v})})});
  var T={list:list,bal:0,working:0,lent:0,free:0,lossRem:0,prof:0,loss:0,cap:0};
  list.forEach(function(o){
    o.cap=o.dep-o.wd;o.lossRem=o.loss-o.lr;o.profNet=o.prof-o.lr;o.bal=o.cap+o.prof-o.loss;o.free=o.bal-o.working-o.lent;
    o.repayable=Math.max(0,Math.min(o.lossRem,o.profNet));
    o.moves.sort(function(a,b){return (b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0)});
    o.cars.sort(function(a,b){return (b.c.buyDate||"").localeCompare(a.c.buyDate||"")});
    T.bal+=o.bal;T.working+=o.working;T.lent+=o.lent;T.free+=o.free;T.lossRem+=Math.max(o.lossRem,0);T.prof+=o.prof;T.loss+=o.loss;T.cap+=o.cap;
  });
  list.sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0)});
  return T;
}

function readInvestors(carId){
  var rows=document.querySelectorAll("#sheet .irow"),out=[],bad=null,T=calc(),c=carId?T.cars.find(function(x){return x.id===carId}):null,used={};
  rows.forEach(function(r){
    if(bad)return;
    var iid=r.querySelector(".iv").value,a=parseNum(r.querySelector(".ia").value),pt=r.querySelector(".ip").value.trim(),md=r.querySelector(".im").value;
    if(!iid&&!a)return;
    var o=T.inv.list.find(function(x){return x.id===iid}),nm=o?o.name:"المستثمر";
    if(!iid){bad="اختار المستثمر";return}
    if(used[iid]){bad=nm+" متكرر في نفس العربية";return}used[iid]=1;
    if(a<=0){bad="اكتب المبلغ اللي هتاخده من "+nm;return}
    if(md!=="money"&&pt===""){bad="حدد نسبة "+nm;return}
    var rec={iid:iid,name:o?o.name:"",amount:a,mode:md==="all"||md==="money"?md:"mine"};
    if(md!=="money"){var pv=parseNum(pt);if(pv<0||pv>100){bad="نسبة الربح لازم تكون من ٠ لـ ١٠٠";return}rec.pct=pv}
    if(o&&!(c&&c.sold)){var av=invAvail(o,c);if(a>av+0.5){bad="رصيد "+nm+" المتاح "+fmt(av)+" بس";return}}
    out.push(rec);
  });
  return bad?{error:bad}:{list:out};
}
function invCheck(plist,ilist,price){
  var tot=plist.reduce(function(a,p){return a+p.amount},0)+ilist.reduce(function(a,v){return a+v.amount},0);
  if(tot>price+0.5)return "مبالغ الشركاء والمستثمرين أكبر من سعر الشراء";
  var R0=1-shareSum(plist,price),s=0;ilist.forEach(function(v){s+=invShare(v,R0,price)});
  if(s>R0+0.0001)return "نسب الأرباح أكتر من ١٠٠٪";
  return null;
}

function cashOwn(T){
  var pc=0,pw=0;
  T.cars.forEach(function(c){c.parts.forEach(function(p){var r=Math.max(p.remaining,0);if(c.sold)pc+=r;else pw+=r})});
  var ic=Math.max(T.inv.free,0);
  return {pc:pc,pw:pw,ic:ic,iw:T.inv.working,mine:T.cashNow-pc-ic,tot:T.cashNow};
}
function cashSplit(T){
  var hasP=T.cars.some(function(c){return c.parts.length});

    '<div class="kv"><span>💰 بتاعتك انت</span><b class="'+(o.mine<0?"bad":"")+'">'+m(o.mine)+'</b></div>'+
    '<div class="kv"><span>🤝 بتاعة الشركاء <span class="sub">(فلوسهم وأرباحهم من عربيات اتباعت)</span></span><b>'+m(o.pc)+'</b></div>'+

/* ---------- جرد الشركاء والمستثمرين ---------- */
function jardPeople(){
  var T=calc(),mp={},L=[];
  function get(n){if(!mp[n]){mp[n]={name:n,pc:[],inv:null};L.push(mp[n])}return mp[n]}
  T.cars.forEach(function(c){c.parts.forEach(function(p){if(p.name)get(p.name).pc.push({c:c,p:p})})});
  T.inv.list.forEach(function(o){if(o.name)get(o.name).inv=o});
  L.forEach(function(x){
    var s={amt:0,prof:0,due:0,paid:0,rem:0,open:0,cash:0,inCars:0};
    x.pc.forEach(function(r){s.amt+=r.p.amount;var rr=Math.max(r.p.remaining,0);if(r.c.sold){s.prof+=r.p.profit;s.cash+=rr}else{s.open++;s.inCars+=rr}s.due+=r.p.due;s.paid+=r.p.paid;s.rem+=r.p.remaining});
    x.ps=s;x.kind=x.pc.length&&x.inv?"both":x.inv?"inv":"partner";
    x.ncars=x.pc.length+(x.inv?x.inv.cars.length:0);
    x.owed=s.rem+(x.inv?x.inv.bal:0);x.cash=s.cash+(x.inv?Math.max(x.inv.free,0):0);x.inCars=s.inCars+(x.inv?x.inv.working:0);
    x.net=s.prof+(x.inv?x.inv.prof-x.inv.loss:0);
    x.put=s.amt+(x.inv?x.inv.cap:0);
    x.rows=[];
    x.pc.forEach(function(r){x.rows.push({c:r.c,t:"p",amount:r.p.amount,share:r.p.share,profit:r.p.profit,paid:r.p.paid,rem:r.p.remaining})});
    if(x.inv)x.inv.cars.forEach(function(r){x.rows.push({c:r.c,t:"i",amount:r.v.amount,share:r.v.share,profit:r.v.profit,mode:r.v})});
    x.rows.sort(function(a,b){return (b.c.buyDate||"").localeCompare(a.c.buyDate||"")});
  });
  L.sort(function(a,b){return a.name.localeCompare(b.name,"ar")});
  return {T:T,list:L};
}

function rbInvAll(){
  var T=calc(),I=T.inv;if(!I.list.length)return null;
  var B=[{t:"tiles",items:[{l:"إجمالي فلوس المستثمرين",v:rnum(I.bal)+" ج",acc:true},{l:"شغالة في عربيات",v:rnum(I.working)+" ج"},{l:"كاش في الخزنة",v:rnum(I.free)+" ج"},
    {l:"أرباحهم من العربيات",v:rnum(I.prof)+" ج",c:RK.good},{l:"عدد المستثمرين",v:String(I.list.length)}]}];
  if(I.loss>0.5)B[0].items.push({l:"خسائر عليهم لسه",v:rnum(I.lossRem)+" ج",c:I.lossRem>0.5?RK.warn:RK.good});
  B.push({t:"sec",title:"المستثمرين"});
  var tc=0,tpf=0,tl=0,tw=0,tb=0;
  B.push({t:"table",cols:[{h:"المستثمر",w:.22},{h:"رأس ماله",w:.16,k:"n"},{h:"أرباحه",w:.15,k:"n"},{h:"خسائره",w:.14,k:"n"},{h:"في عربيات",w:.15,k:"n"},{h:"الرصيد",w:.18,k:"n"}],
    rows:I.list.map(function(o){tc+=o.cap;tpf+=o.prof;tl+=o.loss;tw+=o.working;tb+=o.bal;return [o.name,o.cap,{v:o.prof,c:RK.good},o.loss>0.5?{v:o.loss,c:RK.bad}:"",o.working,o.bal]})
      .concat([{cells:["الإجمالي",tc,tpf,tl,tw,tb]}])});
  var owe=I.list.filter(function(o){return o.lossRem>0.5});
  if(owe.length)B.push({t:"table",cols:[{h:"خسائر لسه عليهم",w:.4},{h:"اتسدد من أرباحه",w:.3,k:"n"},{h:"الباقي عليه",w:.3,k:"n"}],rows:owe.map(function(o){return [o.name,o.lr,{v:o.lossRem,c:RK.warn}]})});
  var act=[];T.cars.forEach(function(c){if(!c.sold&&c.invs.length)act.push(c)});
  if(act.length){B.push({t:"sec",title:"عربيات في المعرض بفلوس مستثمرين ("+act.length+")"});
    B.push({t:"table",cols:[{h:"العربية",w:.4},{h:"المستثمر",w:.32},{h:"من فلوسه",w:.28,k:"n"}],
      rows:[].concat.apply([],act.map(function(c){return c.invs.map(function(v){return [c.name,v.name,v.amount]})}))})}
  B.push({t:"note",text:"الرصيد = رأس ماله (اللي جابه − اللي اتسحب له) + أرباحه − خسائره. التقرير ده للمراجعة بس ومش بيسجّل أي حركة."});
  return {title:"تقرير شامل للمستثمرين",sub:I.list.length+" مستثمر · حتى "+rfd(todayStr()),file:PFX+"-investors-"+todayStr(),blocks:B};
}

function stlRange(){

  if(sp==="week")f=addDays(t,-6);
  else if(sp==="month")f=t.slice(0,8)+"01";
  else if(sp==="range"){f=modal.sf||"";t=modal.st||t}
  return {f:f,t:t};
}
function stlCars(){
  var R=stlRange(),sp=modal.sp||"all";
  return calc().cars.filter(function(c){return c.sold&&(sp==="all"||((c.sellDate||"")>=R.f&&(c.sellDate||"")<=R.t))})
    .sort(function(a,b){return (b.sellDate||"").localeCompare(a.sellDate||"")});
}
function stlSelected(){var sel=modal.sel||{};return stlCars().filter(function(c){return sel[c.id]})}

function stlFx(c){return typeof c.fexp==="number"?c.fexp:c.exp}
function rbSettle(){

  var invDue=0,invP=0,salesT=0,costT=0,expT=0,profT=0,myP=0,myCap=0,fx=0,fxOpen=0,custRem=0,ppl={},order=[];
  cars.forEach(function(c){

    var f=stlFx(c);fx+=f;if(!c.reimbursed)fxOpen+=f;

    });
  });
  var myTot=myCap+myP,pDue=0,pPaid=0,pRem=0;

  var outExp=Math.max(0,expT-fx),fxDone=fx-fxOpen;

  var sum=myTot+pDue+invDue+fx+outExp,diff=salesT-sum;

function makePdf(cv){
  var jpg=atob(cv.toDataURL("image/jpeg",0.93).split(",")[1]),W=cv.width,H=cv.height,pw=595,ph=Math.round(pw*H/W*100)/100;
  var parts=[],off=0,offs=[];
  function add(s){parts.push(s);off+=s.length}
  add("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  offs[1]=off;add("1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n");
  offs[2]=off;add("2 0 obj\n<</Type/Pages/Kids[3 0 R]/Count 1>>\nendobj\n");
  offs[3]=off;add("3 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 "+pw+" "+ph+"]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>\nendobj\n");
  offs[4]=off;add("4 0 obj\n<</Type/XObject/Subtype/Image/Width "+W+"/Height "+H+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+jpg.length+">>\nstream\n");add(jpg);add("\nendstream\nendobj\n");
  var cs="q "+pw+" 0 0 "+ph+" 0 0 cm /Im0 Do Q";
  offs[5]=off;add("5 0 obj\n<</Length "+cs.length+">>\nstream\n"+cs+"\nendstream\nendobj\n");
  var xr=off,x="xref\n0 6\n0000000000 65535 f \n",i;
  for(i=1;i<=5;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  add(x+"trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");
  var bin=parts.join(""),u=new Uint8Array(bin.length);
  for(i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return u;
}

function dlShim(){return {save:async function(o){
  var blob=o.data instanceof Blob?o.data:new Blob([o.data],{type:/\.pdf$/.test(o.filename)?"application/pdf":/\.png$/.test(o.filename)?"image/png":/\.json$/.test(o.filename)?"application/json":"text/csv;charset=utf-8"});
  try{var file=new File([blob],o.filename,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:o.filename});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
}}}

    var sp3=S.ledger.filter(function(x){return x.kind==="spay"&&x.carId===cid});for(var u=0;u<sp3.length;u++)await removeDoc("ledger/"+sp3[u].id);
    var cp=S.cap.filter(function(x){return x.carId===cid});
    for(var q=0;q<cp.length;q++)await removeDoc("capital/"+cp[q].id);
    if(await removeDoc("cars/"+cid)){closeSheet();toast("اتحذفت")}})}
  else if(a==="delitem"){var coll=t.dataset.coll,iid=t.dataset.id;if(coll==="payouts"){var rq=S.pay.find(function(x){return x.id===iid});if(rq&&rq.roll)return toast("ده نقل حساب شريك، عدّله من تعديل عربية "+carNameById(rq.toCar))}
    if(coll==="car"){openDetail(iid);return}
    confirmBox(coll==="ledger"&&S.ledger.some(function(x){return x.id===iid&&x.kind==="loan"})?"ده هيحذف السلفة وكل دفعاتها. متأكد؟":"تحذف الحركة دي؟",async function(){
      if(coll==="ledger"){var lp2=S.ledger.filter(function(x){return (x.kind==="pay"||x.kind==="ladd")&&x.loanId===iid});for(var i=0;i<lp2.length;i++)await removeDoc("ledger/"+lp2[i].id)}
      if(await removeDoc(coll+"/"+iid))toast("اتحذفت")})}
});
function liveKind(){return modal&&modal.type==="form"&&(modal.kind==="sell"||modal.kind==="collect"||modal.kind==="buy"||modal.kind==="edit"||modal.kind==="invmove"||modal.kind==="transfer"||modal.kind==="loan"||modal.kind==="loanpay"||modal.kind==="sellerpay")}
document.addEventListener("input",function(e){
  if(e.target&&e.target.dataset&&e.target.dataset.money)moneyInput(e.target);

  if(liveKind())updatePreview();
});
document.addEventListener("change",function(e){
  if(modal&&modal.type==="report"){
    var rn=e.target.name,rmap={rperson:"person",rinv:"inv",rday:"day",rmonth:"month",rpartner:"partner",rcar:"car",rcarp:"car",rexp:"exd"};
    if(rn==="stlcar"){modal.sel=modal.sel||{};if(e.target.checked)modal.sel[e.target.value]=1;else delete modal.sel[e.target.value];var st=$("#sheet").scrollTop;drawReportSheet();$("#sheet").scrollTop=st;return}
    if((rn==="stlf"||rn==="stlt")&&e.target.value){if(rn==="stlf")modal.sf=e.target.value;else modal.st=e.target.value;stlSelectAll();drawReportSheet();return}
    if(rmap[rn]){
      if(rn==="rcar"||rn==="rcarp")modal.car=e.target.value;
      else if(rn==="rexp")modal.exd=e.target.value==="1";
      else if(e.target.value)modal[rmap[rn]]=e.target.value;
      if(rn==="rpartner"){modal.car="";drawReportSheet();return}
      regenReport();return}
  }
  if(e.target.classList&&e.target.classList.contains("pr")&&ROLLC){var rr=e.target.closest(".prow"),rop=ROLLC.parts.find(function(q){return q.id===e.target.value});if(rr&&rop){var pn1=rr.querySelector(".pn"),pa1=rr.querySelector(".pa");if(!pn1.value.trim())pn1.value=rop.name;if(!parseNum(pa1.value))pa1.value=fmtIn(Math.round(rollAvail(ROLLC,rop.id,ROLLSELF)))}updatePreview();return}
  if(e.target.classList&&e.target.classList.contains("iv")){var ro=e.target.closest(".irow"),io1=invById(e.target.value),pp1=ro&&ro.querySelector(".ip");if(pp1&&io1&&hasPctOf(io1)&&ro.querySelector(".im").value!=="money")pp1.value=io1.pct;updatePreview();return}
  if(e.target.classList&&e.target.classList.contains("im")){var pp2=e.target.closest(".irow").querySelector(".ip");if(pp2)pp2.disabled=e.target.value==="money";updatePreview();return}
  if(e.target.id==="dayin"&&e.target.value){S.day=e.target.value;render();return}
  if(modal&&modal.type==="form"&&modal.kind==="payout"&&e.target.name==="pid"){
    var c=carById(modal.o.carId),p=c&&c.parts.find(function(q){return q.id===e.target.value});
    var f=$("#sheet [name='amount']");if(p&&f)f.value=Math.max(Math.round(p.remaining),0)||"";
    return;
  }
  if(liveKind())updatePreview();
});
