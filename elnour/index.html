<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسابات النور والفتح</title>
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="النور والفتح">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c;--card:#17171a;--card2:#202024;--line:#2c2c31;
  --text:#f4f1ea;--muted:#9b978e;--gold:#e7b53c;--gold2:#ffd76a;
  --red:#d6222a;--red2:#ff4a52;--green:#2fbf71;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font-family:inherit;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 110px}
.hidden{display:none!important}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

/* login */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 16px;max-width:420px;margin:0 auto}
#login .logo{width:100%;max-width:320px;margin:0 auto 24px;display:block;border-radius:14px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;width:100%}
.btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1305}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#04150c}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.err{color:var(--red2);font-size:14px;min-height:20px;text-align:center;margin-top:8px}
.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:18px;line-height:1.8}

/* header */
header{position:sticky;top:0;z-index:5;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .in{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
header img{width:40px;height:40px;border-radius:10px}
header .t{flex:1;line-height:1.3}
header .t b{display:block;font-size:16px}
header .t small{color:var(--muted);font-size:12px}
.iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px}

/* hero */
.hero{margin-top:16px;border-radius:18px;padding:18px;background:linear-gradient(135deg,#1d1508,#0d0d0f 60%);border:1px solid #4a3a14;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;background:radial-gradient(circle,rgba(231,181,60,.25),transparent 70%)}
.hero small{color:var(--muted)}
.hero .big{font-size:32px;font-weight:800;color:var(--gold2);margin:4px 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:rgba(255,255,255,.04);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:16px}
.stat small{font-size:11px}

.row{display:flex;gap:8px;align-items:center}
.search{margin:16px 0 10px;position:relative}
.search input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold2)}

.cust{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:#2a2112;color:var(--gold2);display:grid;place-items:center;font-weight:800;flex:none}
.cust .n{flex:1;min-width:0}
.cust .n b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cust .n small{color:var(--muted);font-size:12px}
.cust .bal{text-align:left;font-weight:800}
.cust .bal small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.pos{color:var(--red2)}.zero{color:var(--green)}.neg{color:var(--gold2)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;line-height:2}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;border-radius:30px;padding:12px 22px;width:auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#101012;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 12px;font-size:12px;cursor:pointer}
nav.tabs button i{display:block;font-style:normal;font-size:20px;line-height:1.2}
nav.tabs button.on{color:var(--gold2)}

/* customer page */
.cbox{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.cbox .nm{font-size:20px;font-weight:800}
.cbox .ph{color:var(--muted);font-size:14px}
.cbox .bl{font-size:34px;font-weight:800;margin:10px 0 2px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts .btn{padding:14px 8px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mv{display:flex;gap:10px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line)}
.mv .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;flex:none}
.mv .dot.d{background:rgba(214,34,42,.15);color:var(--red2)}
.mv .dot.p{background:rgba(47,191,113,.15);color:var(--green)}
.mv .i{flex:1;min-width:0}
.mv .i b{font-size:14px}
.mv .i small{display:block;color:var(--muted);font-size:12px;line-height:1.6}
.mv .a{text-align:left;font-weight:800;font-size:15px}
.mv .a small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.mv .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:2px 0}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#141416;border-top:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:18px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:12px;z-index:30;font-size:14px}
.badge{font-size:11px;border-radius:8px;padding:2px 8px;background:#2a2112;color:var(--gold2)}
.list-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.list-item .f{flex:1}
.list-item small{color:var(--muted);display:block;font-size:12px}
.note{background:#1d1508;border:1px solid #4a3a14;color:#e9d8a6;border-radius:12px;padding:12px;font-size:13px;line-height:1.8;margin:12px 0}
</style>
</head>
<body>

<section id="splash" style="min-height:100vh;display:grid;place-items:center"><img src="icon-192.png" style="width:90px;border-radius:20px;opacity:.9"></section>
<section id="login" class="hidden">
  <img class="logo" src="logo.jpg" alt="النور والفتح">
  <div id="loginBox" class="hidden">
    <label class="field"><span>اسم المستخدم</span><input id="lu" autocomplete="username" autocapitalize="none"></label>
    <label class="field"><span>كلمة السر</span><input id="lp" type="password" autocomplete="current-password"></label>
    <button class="btn btn-gold" onclick="doLogin()">دخول</button>
    <div class="err" id="lerr"></div>
  </div>
  <div id="setupBox" class="hidden">
    <div class="note">أول تشغيل: اعمل حساب المحاسب الرئيسي. الحساب ده هو اللي يضيف الشركاء بعد كده.</div>
    <label class="field"><span>الاسم</span><input id="sn"></label>
    <label class="field"><span>اسم الدخول (إنجليزي أو أرقام)</span><input id="su" autocapitalize="none"></label>
    <label class="field"><span>كلمة السر (6 على الأقل)</span><input id="sp" type="password"></label>
    <button class="btn btn-gold" onclick="doSetup()">إنشاء الحساب</button>
    <div class="err" id="serr"></div>
  </div>
</section>

<!-- APP -->
<section id="app" class="hidden">
  <header><div class="in">
    <img src="icon-192.png" alt="">
    <div class="t"><b>حسابات النور والفتح</b><small id="who"></small> <small id="sync" style="color:var(--gold)"></small></div>
    <button class="iconbtn" id="backBtn" onclick="go('home')">رجوع</button>
  </div></header>

  <div class="wrap" id="view"></div>
  <button class="btn btn-gold fab hidden" id="fab" onclick="openCustomerForm()">＋ عميل جديد</button>

  <nav class="tabs"><div class="in">
    <button data-t="home" onclick="go('home')"><i>⌂</i>العملاء</button>
    <button data-t="log" onclick="go('log')"><i>☰</i>الحركات</button>
    <button data-t="more" onclick="go('more')"><i>⚙</i>الإعدادات</button>
  </div></nav>
</section>

<div id="modal"></div>

<script type="module" src="app.js"></script>
</body>
</html>
